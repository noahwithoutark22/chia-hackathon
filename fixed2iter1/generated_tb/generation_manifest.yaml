# CHIA cocotb + pyuvm generated testbench — simulation manifest
#
# Generated at integration stage (stage 6 of 6).
# This file identifies the exact DUT top module/file, the HDL sources that
# must be passed directly to the simulator (only the existing DUT RTL — there
# is no generated SystemVerilog in this project), and the exact pyuvm test
# class names selectable via the UVM_TESTNAME environment variable read by
# the top-level cocotb entry point.

top_module: adder

# RTL file (relative to the repository root) containing the top module.
top_file: examples/adder/adder.sv

# HDL sources passed directly to the simulator.  Only the existing DUT RTL is
# listed.  The reference model, driver, monitor, scoreboard, coverage,
# assertions, env, and test are all Python and must NOT be listed here.
compile_files:
  - examples/adder/adder.sv

# Exact pyuvm uvm_test class names selectable via UVM_TESTNAME.
test_classes:
  - AdderDirectedTest
  - AdderBasicAdditionNoCarryTest
  - AdderCarryPropagationTest
  - AdderMaximumOverflowTest
  - AdderCarryInIsolationTest
  - AdderResetClearsOutputsTest
  - AdderAllZerosTest
  - AdderMidRangeAdditionTest
  - AdderCornerCaseTest
  - AdderRandomTest
  - AdderFullRegressionTest

# Top-level Python cocotb test module to run (without the .py extension).
python_test_module: generated_tb.test_top
