dut:
  name: adder
  description: >
    Registered, parameterized WIDTH-bit adder with carry-in and carry-out.
    On each rising edge of clk (when not in reset), the (WIDTH+1)-bit result
    of a + b + cin is captured into {cout, sum}. Reset is active-low and,
    per the RTL source of truth, asynchronous (sensitivity list
    'always @(posedge clk or negedge rst_n)').

parameters:
  - name: WIDTH
    type: integer
    default: 8
    description: >
      Bit width of inputs a, b and of output sum. The full add result is
      WIDTH+1 bits wide; cout holds the overflow (carry-out) bit.

clock_and_reset:
  clock:
    name: clk
    active_edge: posedge
    description: Primary clock; registered datapath state advances on its rising edge.
  reset:
    name: rst_n
    style: async
    active_level: low
    description: >
      Asynchronous active-low reset (RTL is source of truth). When rst_n is
      asserted low, sum and cout clear to 0 immediately on the negedge of
      rst_n, independent of clk. Deassert (release to 1) before normal
      addition. NOTE: spec.md describes this as 'synchronous' — see
      discrepancies.

ports:
  - name: clk
    direction: input
    type: logic
    description: Clock input; sampling edge is posedge.
  - name: rst_n
    direction: input
    type: logic
    description: Asynchronous active-low reset.
  - name: a
    direction: input
    type: logic
    width: [WIDTH-1, 0]
    description: Unsigned first addend.
  - name: b
    direction: input
    type: logic
    width: [WIDTH-1, 0]
    description: Unsigned second addend.
  - name: cin
    direction: input
    type: logic
    description: Single-bit carry-in.
  - name: sum
    direction: output
    type: reg
    width: [WIDTH-1, 0]
    description: Registered low WIDTH bits of a + b + cin.
  - name: cout
    direction: output
    type: reg
    description: Registered carry-out (overflow) bit of a + b + cin.

functional_behavior:
  - condition: rst_n asserted low (negation of rst_n, regardless of clk)
    effect:
      - sum becomes 0 immediately (asynchronous clear)
      - cout becomes 0 immediately (asynchronous clear)
  - condition: rst_n deasserted high (on each posedge clk)
    effect:
      - "{cout, sum} <= a + b + cin computed as an unsigned (WIDTH+1)-bit sum"
      - "sum <= (a + b + cin) mod 2^WIDTH"
      - "cout <= floor((a + b + cin) / 2^WIDTH)"
  - signedness: a, b interpreted as unsigned WIDTH-bit values; cin is a single bit
  - registered_datapath: >
      outputs update one active clock edge after stimulus is
      presented and stable; the add itself is described (per spec) as synchronous
      on clk, while reset is asynchronous per RTL

directed_test_scenarios:
  - name: reset_clear_async
    description: Assert rst_n low and verify sum and cout clear to zero without waiting for a clock edge.
    stimulus:
      - drive nonzero a, b, cin
      - assert rst_n low
    expected_result:
      - sum == 0
      - cout == 0
      - clear occurs on negedge rst_n (async), before any further posedge clk
  - name: reset_release_then_add
    description: Deassert rst_n high and verify the add resumes on the next rising clock edge.
    stimulus:
      - assert rst_n low, release to 1, then apply known a, b, cin
    expected_result:
      - on next posedge clk, sum and cout match a + b + cin
  - name: basic_no_carry
    description: Simple addition with no carry-out.
    stimulus:
      - a = 50, b = 75, cin = 0, WIDTH = 8
    expected_result:
      - sum = 125
      - cout = 0
  - name: overflow_at_max
    description: Overflow when the sum reaches 2^WIDTH.
    stimulus:
      - a = 255, b = 1, cin = 0, WIDTH = 8
    expected_result:
      - sum = 0
      - cout = 1
  - name: full_scale_with_cin
    description: Both addends max and carry-in set; maximum representable output.
    stimulus:
      - a = 255, b = 255, cin = 1, WIDTH = 8
    expected_result:
      - sum = 255
      - cout = 1
  - name: cin_in_isolation
    description: carry-in alone with zero addends.
    stimulus:
      - a = 0, b = 0, cin = 1
    expected_result:
      - sum = 1
      - cout = 0
  - name: carry_propagation_all_bits
    description: Verify carry ripples through every bit position (WIDTH = 8).
    stimulus:
      - for each k in 0..WIDTH-1: a = (1 << k), b = (1 << k) - 1, cin = 0
    expected_result:
      - sum == (a + b + cin) mod 2^WIDTH
      - cout == 1 only for the in-range boundary case where (1<<k) + ((1<<k)-1) >= 2^WIDTH
  - name: alternating_pattern
    description: Alternating bit patterns.
    stimulus:
      - a = 0x55, b = 0xAA, cin = 0, WIDTH = 8
    expected_result:
      - sum = 0xFF
      - cout = 0

corner_cases:
  - name: zero_operands
    description: a = 0, b = 0, cin = 0 -> sum = 0, cout = 0.
  - name: maximum_operands_full_scale
    description: a = b = 2^WIDTH - 1, cin = 0 -> sum = 2^WIDTH - 2, cout = 0.
  - name: overflow_ceiling_exact
    description: a + b + cin == 2^WIDTH exactly -> sum = 0, cout = 1.
  - name: overflow_ceiling_minus_one
    description: a + b + cin == 2^WIDTH - 1 -> sum = 2^WIDTH - 1, cout = 0.
  - name: reset_during_pending_add
    description: Assert reset while a nonzero addition would otherwise target the clock edge; verify outputs still clear on negedge rst_n.
  - name: reset_reassert_burst
    description: Toggle rst_n repeatedly while holding inputs to confirm robust async clear and clean resume.
  - name: single_bit_carry_at_lsb
    description: a = 1, b = 0, cin = 0 and the mirror a = 0, b = 1, cin = 0.
  - name: width_override_sweep
    description: If WIDTH is overridden (e.g. 4 or 16), re-run boundary cases at that width.

randomized_testing_strategy:
  architecture:
    - randomized_driver: generate constrained-random a, b, cin per transaction
    - golden_reference: >
        compute expected (sum, cout) from the reference model,
        mirrored into the SV scoreboard
    - scoreboard_comparison: >
        sample DUT sum and cout on the clock edge after the
        driven transaction and compare bit-exact against the reference
  constraints:
    - a, b uniform over [0, 2^WIDTH - 1]
    - cin constrained to 0 or 1
    - a configurable overflow-biased subset so that cout == 1 cases are exercised
    - a configurable reset-assertion subset to exercise the async reset path
  timing:
    - allow a clean one-cycle latency between stimulus presentation and DUT
      output sampling (registered datapath)
    - for async reset randomization, drive rst_n low independent of clk and
      confirm immediate clearing
  termination:
    - run a fixed number of transactions (e.g. several thousand) or until the
      functional coverage goals are met
  width:
    - primary regression at default WIDTH = 8; optional sweep at other widths

functional_coverage:
  - name: input_range
    points:
      - a_bins: partition [0, 2^WIDTH - 1] into bins (zero, low, mid, high, max)
      - b_bins: partition [0, 2^WIDTH - 1] into bins (zero, low, mid, high, max)
      - cin_bins: [0, 1]
    crosses:
      - cross a_bins, b_bins, cin_bins
  - name: output_range
    points:
      - sum_zero: sum == 0
      - sum_max: sum == 2^WIDTH - 1
      - cout_val: [0, 1]
    crosses:
      - cross sum_zero, sum_max, cout_val
  - name: carry_events
    points:
      - carry_in: cin == 1
      - carry_out: cout == 1
      - both_carries: (cin == 1) and (cout == 1)
    crosses:
      - cross carry_in, carry_out
  - name: reset_coverage
    points:
      - reset_applied: rst_n seen low at least once
      - reset_during_pending_add: reset asserted while a nonzero add is pending
      - reset_while_idle: reset asserted with zero inputs
  - name: width_coverage
    points:
      - width_param: each distinct WIDTH instantiation exercised (default 8 plus overrides)
    note: >
      Any bin bound depending on 2^WIDTH - 1 must be recomputed for each WIDTH
      under test (bin ranges derive from the parameterization).

scoreboard_reference_model_strategy:
  type: golden_reference
  reference_model: |
    def adder_ref(a, b, cin, width=8):
        mask = (1 << width) - 1
        total = (a & mask) + (b & mask) + (cin & 1)
        sum_out = total & mask
        cout = (total >> width) & 1
        return sum_out, cout
  wiring:
    - mirror adder_ref into a SystemVerilog scoreboard reference function
    - >
        wiring to ref_model.py via DPI-C is a documented future TODO (see
        templates/scoreboard.sv.j2); plain-SV reference is used initially
  comparison:
    - on each valid (non-reset) transaction, sample DUT sum and cout one active
      clock edge after stimulus
    - compare bit-exact against (sum_ref, cout_ref); flag and report any mismatch
    - align to the registered one-cycle latency of the DUT
  reset_handling:
    - while rst_n is low, expect sum == 0 and cout == 0 regardless of stimulus;
      perform no a+b+cin reference comparison during that window
    - >
        treat reset assertion asynchronously (per RTL): a comparison skip applies
        from the negedge of rst_n until deassertion
  scope:
    - used for all directed and randomized scenarios as the pass/fail oracle

useful_assertions:
  - name: reset_clears_outputs
    property: >
      When rst_n is low (before/independent of clk), sum == 0 and cout == 0.
    kind: immediate/sample on reset assertion
    coverage_tie: reset_coverage.reset_applied
  - name: sum_width_bounds
    property: sum is always within [0, 2^WIDTH - 1].
  - name: cout_single_bit
    property: cout is always 0 or 1.
  - name: functional_relation
    property: >
      For any sampled (a, b, cin), one clock later
      2^WIDTH * cout + sum == a + b + cin (unsigned, WIDTH-bit operands).
  - name: reset_not_overriding_add
    property: >
      A posedge clk that coincides with rst_n low must not update sum/cout
      from the add; this validates that reset dominates in the RTL priority.
  - name: no_x_outputs
    property: >
      After reset deassertion, sum and cout are never X/Z when driven normally.

discrepancies:
  - item: >
      Reset style mismatch. spec.md states 'active-low, synchronous reset'
      (cleared on the rising edge of clk), but adder.sv implements
      'always @(posedge clk or negedge rst_n)' with the clear in the
      negedge-rst_n sensitivity list — an asynchronous active-low reset that
      clears sum/cout immediately on the negedge of rst_n, independent of clk.
  - item: >
      RTL is the source of truth: verification targets the asynchronous reset
      behavior. The specification should be updated to describe the reset as
      asynchronous. This does not affect the add function, only the timing of
      the clear.
  - item: >
      Naming-only discrepancy: ref_model.py header references 'adder.v' while
      the actual RTL file is 'adder.sv'. No behavioral impact.
  - item: >
      The add datapath behavior is consistent across RTL, rtl_info.json,
      spec.md, and ref_model.py (unsigned a, b; single-bit cin; one-cycle
      registered {cout, sum}); no other discrepancies were found.
