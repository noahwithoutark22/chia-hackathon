weaknesses:
- id: W_01
  severity: high
  category: weakened_oracle
  title: read_data==0x00 oracle for unsupported-address transactions disabled in scoreboard
    and randomized self-scoring
  affected_tests:
  - I2C07UnsupportedSlave00Test
  - I2C08UnsupportedSlave01Test
  - I2C09UnsupportedSlave7FTest
  - I2CCornerCaseTest
  - I2CRandomizedTest
  evidence:
  - tb/scoreboard.py:166-172 gates compare_read_data to (slave_addr==0x50 and rw==1)
    only, so read_data is never compared for unsupported-address transactions, despite
    the reference model returning read_data=0 and spec section 4 requiring read_data=0x00
    for the transaction result.
  - tb/sequences.py:1017-1028 applies the identical gating in I2CRandomizedSequence._random_transaction,
    even though its own comment/docstring claim read_data must be compared for 'unsupported-address
    transactions (must be 0x00)'.
  - 'verification_plan.yaml I2C_DISC_001 explicitly states: keep the specification/reference-model
    expectation (read_data == 0x00 after unsupported-address transactions) as the
    oracle and ''do not weaken the check to match the RTL''; plan scoreboard_reference_model_strategy
    pass_criteria also requires ''for transactions to unsupported addresses, read_data
    must be 0x00 ... any mismatch is a failure''.'
  - tb/CONTRACT.md section 12.6 claims the scoreboard and randomized sequence 'still
    require read_data == 0x00 for unsupported-address transactions' and that I2CRandomizedTest
    is 'the bench's detector for the major I2C_DISC_001 defect' - the code implements
    no such check.
  - 'simulation_result.json: all 16 tests pass with 0 scoreboard mismatches (I2CRandomizedTest
    58/58 matched). The only read_data==0x00 checks on unsupported transactions (I2C07/08/09
    and corner sequences) run immediately after a fresh reset, when read_data is already
    0x00, so a stale non-zero read_data left by an earlier supported read can never
    be observed.'
  likely_cause: The TB was adapted to observed/suspected RTL behavior (comments say
    'verified empirically') that stale read_data is retained on unsupported-address
    transactions, and the oracle was weakened to keep the regression green - the exact
    adaptation spec section 10 and plan I2C_DISC_001 forbid.
  investigation_targets:
  - tb/scoreboard.py (_on_monitor_item / compare_read_data)
  - tb/sequences.py (I2CRandomizedSequence._random_transaction)
  - tb/CONTRACT.md (section 12.6)
  recommended_action: Restore the read_data == 0x00 comparison for every unsupported-address
    transaction in both I2CScoreboard and I2CRandomizedSequence, and add a directed
    sequence that performs a supported read producing non-zero read_data immediately
    followed by an unsupported-address transaction so the check is exercised non-trivially
    (the current I2C07/08/09 checks are vacuous post-reset).
  confidence: high
- id: W_02
  severity: medium
  category: missing_scenario_check
  title: I2C_12 open-drain test dropped the START/access-phase drive checks and may
    only observe the environment's constant pull-up drive
  affected_tests:
  - I2C12OpenDrainBusReleaseTest
  evidence:
  - verification_plan.yaml I2C_12 specifies check_bus_start_phase (sda driven low
    while scl released) and check_bus_access_phase (scl driven low) and expects START-like/access/STOP
    conditions; spec section 7 requires a transaction to produce a START-like condition,
    abstracted transfer, and STOP-like condition.
  - tb/sequences.py OpenDrainBusReleaseSeq (lines 570-649) only asserts that scl/sda
    are released while idle before and after the transaction; its docstring states
    the driven START-like/access-phase patterns are 'intentionally not asserted' based
    on 'verified empirically' behavior, removing exactly what the plan scenario asked
    to verify.
  - tb/test_top.py _drive_i2c_pullups (lines 68-82) continuously writes dut.scl=1
    and dut.sda=1 on every clock cycle, so a sampled 'released'/1 level is (at least
    partly) produced by the environment drive and cannot in itself prove the DUT released
    the line; the check therefore cannot distinguish 'DUT releases line' from 'environment
    asserts the observed level'.
  - 'simulation_result.json: I2C12 passed (1 transaction, 1 matched) with the reduced
    release-only check.'
  likely_cause: The generation/observation stage downgraded the scenario after observing
    the bus levels never showed a driven-low phase, choosing to document the limitation
    instead of keeping the spec-mandated phase observations as checks.
  investigation_targets:
  - tb/sequences.py (OpenDrainBusReleaseSeq)
  - tb/test_top.py (_drive_i2c_pullups)
  recommended_action: Re-instrument I2C_12 to sample scl/sda during the START-like
    and access phases and assert the plan's driving pattern (SDA low during START,
    SCL low during access); if the pull-up coroutine overrides inout resolution, model
    the pull-ups so DUT-driven lows remain observable, and keep the phase assertions
    tied to the spec rather than to observed RTL behavior.
  confidence: high
- id: W_03
  severity: medium
  category: blind_spot
  title: RTL-vs-model memory reset divergence (I2C_DISC_002) is deliberately avoided
    in stimulus, so it can never be detected or reported
  affected_tests:
  - I2C02WriteThenReadBackTest
  - I2C04RepeatedWritesTest
  - I2C05BoundaryAddr00Test
  - I2C06BoundaryAddrFFTest
  - I2C10StartWhileBusyTest
  - I2C11DonePulseWidthTest
  - I2C13MultiRegIndependenceTest
  - I2C14BackToBackTest
  - I2CCornerCaseTest
  - I2CRandomizedTest
  evidence:
  - verification_plan.yaml I2C_DISC_002 documents that the RTL memory is not cleared
    on reset while the reference model's is, and states the environment should 'report
    any read-after-reset stale-value behavior as a DUT defect rather than silently
    accepting it'.
  - tb/sequences.py RESERVED_NEVER_WRITTEN (lines 90-103) reserves registers 0x20/0x2A/0x42
    so 'never-written reads 0x00' expectations hold in any scenario order, and I2CRandomizedSequence
    (lines 896-901) restricts supported reads to registers written after the most
    recent reset.
  - Every directed/corner scenario starts from a fresh reset (and each test is a separate
    simulation), so no test ever reads a register that was written before a reset;
    the read-after-reset stale-memory scenario is never generated and the documented
    divergence is never observed.
  likely_cause: The environment keeps the reference model and DUT memories in lockstep
    by construction (scoreboard _watch_reset plus stimulus restrictions), which sidesteps
    the documented discrepancy instead of exercising it as the plan's detection/reporting
    intent required.
  investigation_targets:
  - tb/sequences.py (RESERVED_NEVER_WRITTEN, I2CRandomizedSequence)
  - tb/scoreboard.py (_watch_reset)
  recommended_action: Add a dedicated scenario that writes a register, asserts/deasserts
    reset, then reads the same register and reports the observed value against the
    documented ambiguity; if spec interpretation is to treat memory as cleared, the
    DUT's stale value must be flagged as a defect rather than excluded from stimulus.
  confidence: high
- id: W_04
  severity: low
  category: coverage_accuracy
  title: write_data_cp and read_data_cp coverage bins are contaminated by read/write
    transactions where the sampled field is a don't-care default
  affected_tests:
  - I2C02WriteThenReadBackTest
  - I2CCornerCaseTest
  - I2CRandomizedTest
  evidence:
  - 'simulation_result.json I2C02 log: write_data_cp coverage=2/4 after exactly one
    write (0xAA) and one read; the read transaction''s default write_data=0 satisfies
    the data_0x00 bin, so the bin can be full without any write of 0x00 ever occurring.'
  - tb/coverage.py sample_transaction samples write_data from every monitor item,
    including reads, and _classify_write_data maps 0 -> data_0x00; values outside
    {0x00, 0x55, 0xAA, 0xFF} (e.g. the 0x11/0x22/0x33 directed writes) return None
    and are silently not binned at all.
  - tb/coverage.py read_data_cp similarly samples read_data on supported-address writes,
    where the byte is unspecified by the benchmark contract, so stale/don't-care bytes
    contribute to 'read pattern' coverage.
  likely_cause: Bin classification is applied to the raw write_data/read_data fields
    captured on every done-pulse sample without gating by transaction direction (rw)
    or by whether the field has defined semantics for that transaction, so default
    don't-care values fill meaningful bins.
  investigation_targets:
  - tb/coverage.py (sample_transaction, _classify_write_data, _classify_read_data)
  recommended_action: Gate write_data_cp sampling to rw==0 transactions and read_data_cp
    to transactions where read_data has defined semantics (supported reads and unsupported-address
    results), or add explicit write-only/read-only bins, so the covergroup reports
    actual exercised stimulus rather than driver defaults.
  confidence: high
