# i2c_master cocotb+pyuvm testbench — generation manifest (integration stage).
#
# This manifest is the authoritative runtime contract for the generated
# environment.  The top module, RTL file, compiled sources, python test
# module, and the exact pyuvm test class names selectable via UVM_TESTNAME
# are all listed here.  The `scenarios` list maps each directed
# verification-plan scenario ID (I2C_01 .. I2C_14) to the generated
# sequence class (tb/sequences.py) and test class (tb/test.py).

top_module: i2c_master
top_file: benchmarks/i2c_benchmark/i2c_master.sv

# Only the DUT RTL is passed to the simulator.  There is no generated
# SystemVerilog source (everything else — environment, stimulus,
# observation, check, coverage, assertions, tests — is Python).
compile_files:
  - benchmarks/i2c_benchmark/i2c_master.sv

# Exact runtime pyuvm uvm_test class names (selectable via UVM_TESTNAME).
test_classes:
  - I2C01ResetBehaviorTest
  - I2C02WriteThenReadBackTest
  - I2C03ReadBeforeWriteTest
  - I2C04RepeatedWritesTest
  - I2C05BoundaryAddr00Test
  - I2C06BoundaryAddrFFTest
  - I2C07UnsupportedSlave00Test
  - I2C08UnsupportedSlave01Test
  - I2C09UnsupportedSlave7FTest
  - I2C10StartWhileBusyTest
  - I2C11DonePulseWidthTest
  - I2C12OpenDrainBusReleaseTest
  - I2C13MultiRegIndependenceTest
  - I2C14BackToBackTest
  - I2CCornerCaseTest
  - I2CRandomizedTest

# Top-level Python cocotb test module (without .py).
python_test_module: test_top

# Authoritative mapping between the accepted verification plan
# (directed_test_scenarios) and the generated directed environment.
scenarios:
  - id: I2C_01
    name: Reset Behavior
    sequence: ResetBehaviorSeq
    test: I2C01ResetBehaviorTest
  - id: I2C_02
    name: Write Then Read Back
    sequence: WriteThenReadBackSeq
    test: I2C02WriteThenReadBackTest
  - id: I2C_03
    name: Read Before Write Returns Zero
    sequence: ReadBeforeWriteSeq
    test: I2C03ReadBeforeWriteTest
  - id: I2C_04
    name: Repeated Writes to Same Register
    sequence: RepeatedWritesSeq
    test: I2C04RepeatedWritesTest
  - id: I2C_05
    name: Boundary Register Address 0x00
    sequence: BoundaryAddr00Seq
    test: I2C05BoundaryAddr00Test
  - id: I2C_06
    name: Boundary Register Address 0xFF
    sequence: BoundaryAddrFFSeq
    test: I2C06BoundaryAddrFFTest
  - id: I2C_07
    name: Unsupported Slave Address 0x00
    sequence: UnsupportedSlave00Seq
    test: I2C07UnsupportedSlave00Test
  - id: I2C_08
    name: Unsupported Slave Address 0x01
    sequence: UnsupportedSlave01Seq
    test: I2C08UnsupportedSlave01Test
  - id: I2C_09
    name: Unsupported Slave Address 0x7F
    sequence: UnsupportedSlave7FSeq
    test: I2C09UnsupportedSlave7FTest
  - id: I2C_10
    name: Start While Busy Is Ignored
    sequence: StartWhileBusySeq
    test: I2C10StartWhileBusyTest
  - id: I2C_11
    name: Done Pulse Width
    sequence: DonePulseWidthSeq
    test: I2C11DonePulseWidthTest
  - id: I2C_12
    name: Open-Drain Bus Release
    sequence: OpenDrainBusReleaseSeq
    test: I2C12OpenDrainBusReleaseTest
  - id: I2C_13
    name: Multi-Register Independence
    sequence: MultiRegIndependenceSeq
    test: I2C13MultiRegIndependenceTest
  - id: I2C_14
    name: Back-to-Back Transactions
    sequence: BackToBackSeq
    test: I2C14BackToBackTest

# Additional verification strategies from the plan (no scenario id).
corner_cases_test: I2CCornerCaseTest
corner_sequences:
  - CornerReadNeverWrittenSeq
  - CornerAddr00BoundarySeq
  - CornerAddrFFBoundarySeq
  - CornerData00Seq
  - CornerDataFFSeq
  - CornerData55Seq
  - CornerDataAASeq
  - CornerUnsupported00Seq
  - CornerUnsupported7FSeq
  - CornerUnsupported01Seq
  - CornerStartWhileBusySeq

randomized_test: I2CRandomizedTest
randomized_sequence: I2CRandomizedSequence