weaknesses:
- id: W-CORNER-TEST-CRASH
  severity: critical
  category: test_infrastructure
  title: FifoCornerTest crashes on ReadOnly-phase reset drive
  affected_tests:
  - FifoCornerTest
  evidence:
  - FifoCornerTest status=runtime_error, returncode=2, clean_exit=false
  - 'Error traceback: RuntimeError: Attempting settings a value during the ReadOnly
    phase at sequences.py:112 (_assert_reset -> dut.rst_n.setimmediatevalue(0))'
  - Crash occurs in ResetAtFullSeq.body() at line 800, immediately after _check_outputs(full=1,
    empty=0, count=self.depth) which awaits ReadOnly()
  - FifoCornerTest is the 9th test in the regression; it runs 10 corner-case sequences
    sequentially; the crash on sequence 9 (ResetAtFullSeq) prevents sequence 10 (DoutRetentionSeq)
    from ever executing
  - Returncode 2 with no UVM errors/mismatches/assertion_failures confirms infrastructure
    crash, not a DUT bug
  likely_cause: 'Inference: _check_outputs() awaits ReadOnly() then reads DUT pins
    synchronously and returns. The calling coroutine resumes in the ReadOnly simulation
    phase. ResetAtFullSeq.body() calls _check_outputs(full=1, ...) and then immediately
    calls _assert_reset(), which drives dut.rst_n via setimmediatevalue(0) before
    any clock-edge or timer trigger advances past ReadOnly. cocotb forbids signal
    writes during ReadOnly, causing RuntimeError. Other sequences avoid this because
    their code path after _check_outputs() first awaits a cocotb trigger (FallingEdge,
    ClockCycles, or _drive_item->finish_item) that naturally advances past ReadOnly.

    '
  investigation_targets:
  - tb/sequences.py (FifoSeqBase._assert_reset method, ResetAtFullSeq.body method)
  - tb/sequences.py (FifoSeqBase._check_outputs method)
  recommended_action: 'Fix _assert_reset() to guard against being called during the
    ReadOnly phase: either await a Timer(1, unit="ns") or await FallingEdge(dut.clk)
    before driving rst_n, ensuring simulation time has advanced past the ReadOnly
    phase. Alternatively, insert an explicit await self._wait(1) between _check_outputs(full=1,...)
    and _assert_reset() in ResetAtFullSeq.body(). The root cause is that _assert_reset()
    assumes it is never called during ReadOnly, but ResetAtFullSeq violates that assumption.
    The fix should be in _assert_reset() itself so all callers are protected.

    '
  confidence: high
- id: W-CORNER-SEQUENCES-UNVERIFIED
  severity: high
  category: functional_coverage
  title: Two corner-case sequences never executed due to crash
  affected_tests:
  - FifoCornerTest
  evidence:
  - ResetAtFullSeq (fill to full then assert async reset) never completed - crashed
    on first _assert_reset call
  - DoutRetentionSeq (dout retains last value after ignored empty read) never started
    - it follows ResetAtFullSeq in CORNER_SEQUENCES
  - The 'reset while stuck full' recovery path and 'dout retention after prior successful
    reads' behavior were never verified by any passing test
  - TC009 (ResetDuringOpSeq) asserts reset with only 2 entries stored (count==2 of
    DEPTH==4), never at full occupancy
  - TC004 (ReadUntilEmptySeq) checks dout retention at post-reset value 0, but DoutRetentionSeq
    was designed to also check retention of a non-zero value after real reads
  likely_cause: 'Inference: Direct consequence of W-CORNER-TEST-CRASH. The for-loop
    in FifoCornerTest._run_scenario() iterates CORNER_SEQUENCES sequentially; the
    crash at sequence index 8 (ResetAtFullSeq) aborts the loop, so sequence index
    9 (DoutRetentionSeq) is never started.

    '
  investigation_targets:
  - tb/sequences.py (CORNER_SEQUENCES list, ResetAtFullSeq, DoutRetentionSeq)
  - tb/test.py (FifoCornerTest._run_scenario)
  recommended_action: 'After fixing W-CORNER-TEST-CRASH, verify that both ResetAtFullSeq
    and DoutRetentionSeq complete successfully and the scoreboard reports zero mismatches
    for the full FifoCornerTest run. Consider also running the corner-case sequences
    as separate test classes to isolate future crashes.

    '
  confidence: high
- id: W-ASSERT-RESET-TIMING-ASSUMPTION
  severity: medium
  category: test_infrastructure
  title: _assert_reset does not guard against ReadOnly-phase entry
  affected_tests:
  - FifoCornerTest
  - Any future test that calls _assert_reset after _check_outputs
  evidence:
  - FifoSeqBase._assert_reset() in sequences.py:112 calls self.dut.rst_n.setimmediatevalue(0)
    as its first statement with no preceding trigger
  - FifoSeqBase._release_reset() correctly awaits FallingEdge(self.dut.clk) before
    driving, showing awareness of cocotb phase constraints
  - The _check_outputs() method explicitly documents that it leaves the coroutine
    in the ReadOnly region (sequences.py:177-197, WARNING comment about ReadOnly semantics)
  - Current code assumes _assert_reset is only called outside ReadOnly, but ResetAtFullSeq
    violates this assumption
  likely_cause: 'Inference: _assert_reset was written before ResetAtFullSeq was added
    (it was part of W2 improvement in iteration 8). The original callers of _assert_reset
    (_reset_init, _reset_init_checked) are always called at the start of a body()
    or after a _release_reset+wait sequence, which are never in ReadOnly. ResetAtFullSeq
    is the first caller that reaches _assert_reset immediately after _check_outputs.

    '
  investigation_targets:
  - tb/sequences.py (FifoSeqBase._assert_reset method at line 112)
  recommended_action: 'Add a defensive await Trigger at the start of _assert_reset()
    (e.g. await Timer(0) or await FallingEdge(self.dut.clk)) to ensure the coroutine
    is never in the ReadOnly phase when it attempts to drive rst_n. This makes the
    method robust against all calling contexts.

    '
  confidence: high
