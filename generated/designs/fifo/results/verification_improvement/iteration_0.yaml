weaknesses:
- id: W-DRIVER-TRY-NEXT-CRASH
  severity: critical
  category: testbench_infrastructure
  title: Driver crashes on try_next_item() return value; all 12 stimulus tests abort
    before any FIFO data-path verification
  affected_tests:
  - FifoTC002Test
  - FifoTC003Test
  - FifoTC004Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoTC010Test
  - FifoCornerTest
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - 'simulation_result.json: 12 of 13 tests have status=runtime_error, returncode=2,
    clean_exit=false with the identical traceback at 85-95ns: File ".../tb/driver.py",
    line 148, in run_phase -> self._drive(next_item.wr_en, next_item.rd_en, next_item.din)
    -> AttributeError: ''tuple'' object has no attribute ''wr_en'''
  - 'The crash is in the back-to-back path of driver.run_phase: next_item = self.seq_item_port.try_next_item()
    (driver.py:141) returns a tuple, not a FifoTransaction, so line 148 raises before
    the item is driven.'
  - 'All 12 failing tests show counts {uvm_errors:0, uvm_fatals:0, uvm_warnings:0,
    scoreboard_mismatches:0, assertion_failures:0}: no sequence inline check and no
    scoreboard comparison of a data transfer ever executed; even the first _drive_item()/finish_item()
    handshake did not complete.'
  likely_cause: 'Inference: pyuvm runtime/API mismatch. The toolchain reports pyuvm
    5.0.0; at that version seq_item_port.try_next_item() returns a tuple (item, seq_id)
    (SV-UVM-style), while driver.py treats the return as a bare FifoTransaction. The
    TB was authored for a different pyuvm API (test_top.py even installs ''pyuvm 3.0.0''
    compatibility shims), so the back-to-back optimization path is incompatible with
    the runtime library.'
  investigation_targets:
  - tb/driver.py (run_phase, lines 130-160 especially 141-148)
  - tb/sequences.py (_drive_item / start_item / finish_item)
  - tb/test_top.py (_install_pyuvm_shims)
  recommended_action: Fix the driver's back-to-back path to unpack/guard the try_next_item()
    return value (handle the (item, seq_id) tuple form and call item_done() for it),
    or remove the try_next_item() optimization entirely and fall back to the blocking
    get_next_item() with idle cycles. Add a minimal 2-item smoke test that must pass
    to prove consecutive items complete. Pin the pyuvm version the TB is validated
    against.
  confidence: high
- id: W-STALE-COVERAGE-MERGE
  severity: high
  category: coverage_integrity
  title: Coverage aggregate merges stale per-test files from a previous run, inflating
    reported coverage for a run in which 12/13 tests crashed
  affected_tests:
  - FifoTC001Test
  evidence:
  - 'FifoTC001Test log (the only test reaching report_phase): ''FifoCoverage aggregate
    merge from 12 per-test file(s)'' followed by ''op_against_flags: 8/16 bins hit'',
    ''count_levels: 5/5'', ''FifoCoverage aggregate: 41/49 total bins hit (83.7%)''.'
  - TC001's own in-process export written this run (fifo_coverage_FifoTC001Test.yml,
    fifo_coverage.yml, both Sep 8 05:24) shows only 1 op_against_flags bin hit (('wr_idle','rd_idle','not_full','is_empty'))
    and count_levels only empty_level; fifo_operation_cg cover_percentage is 22.2%.
  - 'The 12 other per-test files (fifo_coverage_FifoTC002Test.yml ... fifo_coverage_FifoRandomizedTest.yml)
    are timestamped Sep 7 06:59 (previous run) and contain data-path bins (e.g. FifoTC002Test.yml:
    wr_active=3, rd_active=3, one_entry=4) that no test in this run could have produced,
    because all 12 stimulus tests crashed at <=95ns before any stimulus cycle was
    sampled.'
  likely_cause: 'Inference: coverage.py _merge_per_test_coverage() globs every fifo_coverage_*.yml
    on disk with no run identity/timestamp filtering and takes the per-bin max. Tests
    that crash never overwrite their per-test files, so results from an earlier (passing)
    run persist and are merged into the current run''s aggregate, producing false
    confidence.'
  investigation_targets:
  - tb/coverage.py (_merge_per_test_coverage, lines 434-546)
  - tb/fifo_coverage_*.yml (file timestamps and contents)
  recommended_action: Isolate coverage artifacts per run (delete stale fifo_coverage_*.yml
    before each run, or write per-test files into a per-run/run-id directory), and
    make the aggregate merge log the participating files/timestamps so stale data
    cannot be reported as this run's coverage.
  confidence: high
- id: W-EMPTY-FUNCTIONAL-VERIFICATION
  severity: high
  category: false_confidence
  title: Run performed zero functional data-path verification; the sole pass is a
    reset check and every checker/metric counter stayed at zero
  affected_tests:
  - FifoTC001Test
  - FifoTC002Test
  - FifoTC003Test
  - FifoTC004Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoTC010Test
  - FifoCornerTest
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - 'FifoTC001Test log: ''TEST PASSED: 5 items checked, 0 mismatches, 3 resets observed''
    and its coverage shows 5/5 sampled cycles are (wr_idle, rd_idle, is_empty) - a
    reset/idle-only observation with no wr_en or rd_en cycle sampled.'
  - Simulation_result.json counts for every one of the 13 tests are {uvm_errors:0,
    uvm_fatals:0, uvm_warnings:0, scoreboard_mismatches:0, assertion_failures:0};
    the 12 failing tests died in driver.run_phase before any scoreboard comparison
    or assertion involving transferred data could run.
  - The fresh fifo_coverage.yml from this run reports fifo_operation_cg 22.2%, fifo_occupancy_cg
    20.0%, fifo_data_cg 37.5% - all contributed by idle-at-empty reset cycles only.
  likely_cause: 'Inference: the pass/fail criterion (test.py report_phase) is ''scoreboard
    mismatch count == 0'', and the harness ''counts'' only track errors/mismatches/assertions.
    A driver crash leaves mismatch=0 and all counters zero, so the run summary looks
    clean (1 pass, no mismatches) even though no functional stimulus was ever applied.'
  investigation_targets:
  - tb/test.py (report_phase, lines 98-119)
  - tb/scoreboard.py (run_phase / _advance_and_check)
  - simulation_result.json (counts per test)
  recommended_action: Require a minimum amount of exercised stimulus in report_phase
    (e.g. items_checked > 0 AND at least one sampled wr_en==1 or rd_en==1 cycle per
    test) and fail the test otherwise; count driver/sequence exceptions as assertion_failures
    so a crashed environment is reflected in the metrics instead of appearing verified.
  confidence: high
- id: W-PYVUM-COCOTB-API-SKEW
  severity: low
  category: environment_api
  title: TB targets pyuvm 3.0.0 / pre-cocotb-2 API while the run uses pyuvm 5.0.0
    and cocotb 2.1.0
  affected_tests:
  - FifoTC001Test
  - FifoTC002Test
  - FifoTC003Test
  - FifoTC004Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoTC010Test
  - FifoCornerTest
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - simulation_result.json toolchain reports pyuvm 5.0.0 and cocotb 2.1.0, while test_top.py's
    docstring and _install_pyuvm_shims() implement and describe 'pyuvm 3.0.0' compatibility
    (wildcard ConfigDB legal_chars patch, keep_singletons workaround for pyuvm 3.0.0
    defaults).
  - 'Every run log contains repeated cocotb 2.x DeprecationWarnings: ''The ''units''
    argument has been renamed to ''unit'''' (Clock(..., units="ns")), ''Use handle.set(Immediate(...))
    or handle.value = Immediate(...) instead'' (setimmediatevalue), and ''The ''name''
    field will be removed'' (Event(name=...)).'
  - The try_next_item() misuse that crashes the driver (W-DRIVER-TRY-NEXT-CRASH) is
    a direct symptom of this API skew.
  likely_cause: 'Inference: the generated TB was written and validated against pyuvm
    3.0.0 / cocotb 1.9-style APIs but executed against pyuvm 5.0.0 / cocotb 2.1.0,
    so deprecated call forms and version-dependent sequencer behavior diverge from
    the runtime.'
  investigation_targets:
  - tb/test_top.py (lines 78-95, 128-138)
  - tb/driver.py (run_phase)
  - tb/sequences.py (Timer/ClockCycles usage)
  recommended_action: Pin the simulation environment's pyuvm/cocotb versions to the
    ones the TB is validated against (or migrate the TB to the installed API), and
    do a cleanup pass removing deprecated forms (units= -> unit=, setimmediatevalue
    -> set/handle.value = Immediate(...)). Then re-run the suite to confirm the driver
    handshake works.
  confidence: medium
