weaknesses:
- id: W-DRIVER-IDLE-WALL
  severity: medium
  category: stimulus
  title: Driver inserts mandatory idle cycle between every pair of driven items
  affected_tests:
  - FifoBackToBackTest
  evidence:
  - 'driver.py line 127: self._drive_idle() is called unconditionally after every
    item_done() (line 121) in the run_phase loop, guaranteeing wr_en=0, rd_en=0 on
    the cycle immediately following every driven transaction.'
  - 'driver.py lines 104-107 (docstring): explicitly documents this as CONTRACT 9.3''s
    ''declared idle wall between consecutive items (a no-op for FIFO semantics)''.'
  - 'BackToBackSeq in sequences.py lines 905-906: two consecutive _drive_item(1, 1,
    rw1) and _drive_item(1, 1, rw2) calls for simultaneous rw are still separated
    by an idle wall in the driver, because _drive_item blocks on seq_item_port.get_next_item()
    and the driver always inserts _drive_idle() after item_done().'
  - 'BackToBackTest coverage (fifo_coverage_FifoBackToBackTest.yml): wr_active+rd_active
    bin has only 2 hits (the two simultaneous rw cycles from Phase 5), confirming
    these active cycles are isolated by idle gaps. The wr_rd_combos cross shows wr_active+rd_active=2
    vs wr_idle+wr_idle=28.'
  likely_cause: 'Inference: the driver architecture always applies _drive_idle() after
    item_done() as a structural design choice (CONTRACT 9.3). No mechanism exists
    in the driver or sequencer to allow truly consecutive active cycles without an
    intervening idle gap. For a synchronous FIFO the idle cycle is functionally a
    no-op, so this is low functional risk but means the BackToBack test does not actually
    test truly back-to-back active cycles.'
  investigation_targets:
  - tb/driver.py (run_phase, lines 109-127)
  recommended_action: Add a driver option (e.g. a flag or a different sequencer API
    path) that allows the sequence to request back-to-back items without an intervening
    idle cycle. The BackToBackSeq should use this path for its Phase 5 consecutive
    simultaneous rw operations. Alternatively, document explicitly in the verification
    plan that 'back-to-back' means 'no other stimulus between items' (not 'no idle
    cycle between items').
  confidence: high
- id: W-SHARED-REF-MODEL
  severity: medium
  category: checking
  title: Scoreboard and check_fifo_ordering assertion share the identical reference
    model module
  affected_tests:
  - FifoTC001Test
  - FifoTC002Test
  - FifoTC003Test
  - FifoTC004Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoTC010Test
  - FifoCornerTest
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - 'scoreboard.py line 55: import ref_model; line 169: ref_model.step(self._state,
    wr_en, rd_en, int(tr.din), self.depth)'
  - 'assertions.py line 63: import ref_model; line 386: state = ref_model.step(state,
    int(wr_en), int(rd_en), int(din), self.depth)'
  - 'assertions.py lines 352-363 (check_fifo_ordering docstring): explicitly acknowledges
    this as ''Implemented against the shared reference model (CONTRACT.md 11.1)'''
  - tb/ref_model.py and reference_model.py are identical 25-line deque-based models
  - The other six assertions (no_overflow, no_underflow, occupancy_bounds, flags_mutually_exclusive,
    count_update_consistency, flags_count_consistency) are truly independent pin-level
    checkers that do NOT use the reference model and provide genuine defense-in-depth.
  likely_cause: 'Inference: the check_fifo_ordering assertion was designed as a defense-in-depth
    layer (CONTRACT.md 11.1) but was implemented by importing the same ref_model module
    used by the scoreboard. If ref_model.step() has a logic error (e.g. incorrect
    queue management, wrong dout assignment), both the scoreboard (primary checker)
    and check_fifo_ordering (defense-in-depth) would agree on the wrong expected value,
    defeating the independence of the defense layer.'
  investigation_targets:
  - tb/assertions.py (check_fifo_ordering, lines 352-396)
  - tb/scoreboard.py (_advance_and_check, lines 134-173)
  recommended_action: Implement a second, independently coded reference model inside
    assertions.py (e.g. a simple deque-based FIFO model inlined in check_fifo_ordering)
    that does not share code with tb/ref_model.py. This ensures a ref_model.py bug
    is caught by disagreement between the scoreboard and the assertion checker. The
    other six assertions already provide independent defense-in-depth for their respective
    properties.
  confidence: high
- id: W-PARAM-EXERCISE
  severity: medium
  category: stimulus
  title: Only default parameter configuration (DATA_WIDTH=8, DEPTH=4) was exercised
  affected_tests:
  - FifoTC001Test
  - FifoTC002Test
  - FifoTC003Test
  - FifoTC004Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoTC010Test
  - FifoCornerTest
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - 'verification_plan.yaml lines 7-21: DATA_WIDTH test_values [4, 8, 16] and DEPTH
    test_values [2, 4, 8] are specified, implying 9 parameter combinations should
    be tested.'
  - 'simulation_result.json: none of the 13 test command arrays include DATA_WIDTH
    or DEPTH environment variables; all use the default Makefile values.'
  - 'tb/test_top.py: tb_top() resolves DATA_WIDTH and DEPTH from os.environ with defaults
    8 and 4; no override is passed.'
  - 'coverage.py line 66-67: DATA_WIDTH_DEFAULT=8, DEPTH_DEFAULT=4 are hardcoded as
    elaboration defaults.'
  - Only DEPTH=4 occupancy bins are exercised (empty_level=0, one_entry=1, mid_level=2,
    near_full_level=3, full_level=4). DEPTH=2 would collapse mid_level and one_entry
    to the same value; DEPTH=8 would add more occupancy granularity. DATA_WIDTH=4
    or 16 would change the data boundary values.
  likely_cause: 'Inference: the regression infrastructure runs each test with the
    default DUT elaboration parameters. The verification plan specifies parameter
    test_values but the simulation harness does not iterate over them. Testing all
    9 combinations would require either parameterized test classes or a regression
    loop that re-elaborates the DUT with different DATA_WIDTH/DEPTH values.'
  investigation_targets:
  - tb/test_top.py (tb_top function, DATA_WIDTH/DEPTH resolution)
  - simulation_result.json (command arrays, no DATA_WIDTH/DEPTH env vars)
  recommended_action: Add parameterized test variants or a regression script that
    iterates over the planned parameter combinations. At minimum, test DEPTH=2 (smallest,
    pointer wrap-around after 2 entries) and DATA_WIDTH=16 (widest, boundary values
    0x0000 and 0xFFFF) to cover the parameter space extremes. The coverage model (coverage.py
    _count_level_bins, max_data) already supports parameterized bin computation.
  confidence: high
- id: W-RANDOMIZED-SEED-FIXED
  severity: low
  category: stimulus
  title: Randomized test uses a deterministic seed by default, exercising the same
    stimulus pattern every regression run
  affected_tests:
  - FifoRandomizedTest
  evidence:
  - 'sequences.py lines 977-994: FifoRandomizedSeq resolves its seed via (1) explicit
    seed, (2) RANDOM_SEED env var, (3) hash(self.get_name()) & 0x7FFFFFFF. The default
    hash produces the same seed every run.'
  - 'simulation_result.json: none of the 13 test command arrays include a RANDOM_SEED
    environment variable.'
  - 'simulation_result.json FifoRandomizedTest log: ''FifoRandomizedSeq RNG seed =
    <value>'' confirming the deterministic default was used.'
  - FifoRandomizedTest drives 240+ cycles and achieves 100% reachable op_against_flags
    coverage (8/8 reachable bins), but the same 240-cycle stimulus stream replays
    every regression.
  likely_cause: 'Inference: the deterministic seed was a deliberate design choice
    for reproducibility (W-SEED-NOREPRO comment in sequences.py line 977). The RANDOM_SEED
    override mechanism exists but is not used by the regression infrastructure. Without
    seed iteration, the same stimulus patterns and occupancy trajectories replay every
    run, limiting the diversity of corner cases exercised.'
  investigation_targets:
  - tb/sequences.py (FifoRandomizedSeq.body, lines 975-999)
  recommended_action: Either (a) add a seed-iteration mechanism in the regression
    harness (e.g. hash(test_name + run_index) for each regression invocation), or
    (b) run FifoRandomizedTest multiple times with different RANDOM_SEED values in
    the regression suite. The current 240-cycle stream covers all reachable op_against_flags
    bins, but diverse seeds would exercise different data patterns, occupancy trajectories,
    and reset injection timings.
  confidence: high
