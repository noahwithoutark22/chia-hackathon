schema_version: '1.0'
decision:
  action: improve
  weakness_id: W4
  failure_class: meaningless_coverage
  failure_mechanism: misleading_bins
  source: guidance_supported
  confidence: high
diagnosis:
  observed_problem: 'fifo_data_cg samples din/dout unconditionally every cycle, inflating
    data_zero bins with idle/reset bus-idle samples. FifoTC001Test (0 accepted writes/reads)
    still records data_zero=5; aggregate data_zero=276 vs data_max=24.

    '
  consequence: 'fifo_data_cg coverage percentage is noise-inflated; the metric does
    not truthfully reflect boundary data-path exercising.

    '
candidate_interventions:
- Gate _sample_data() on wr_en==1 or rd_en==1
- Add predicates inside CoverPoint xf functions
- Split sample into write/read gated samplers
selected_intervention:
  type: conditional_coverage_sampling
  expected_effect:
  - data_zero counts reflect only genuine zero-valued writes/reads
  - boundary_data_concurrent cross fires only on active cycles
  - Coverage percentage becomes truthful
  - No functional checks affected
regression_risks:
- Numerical coverage % decreases (removing noise, not genuine coverage)
- Cross may show fewer hits (correct semantic)
validation:
- "FifoTC001Test data_zero hits \u2192 0"
- FifoRandomizedTest data_zero decreases substantially
- data_max counts unaffected
- All 13 tests pass, 0 mismatches, 0 assertions
