schema_version: '1.0'
decision:
  action: improve
  weakness_id: W-NO-PARAMETER-VARIATION
  failure_class: missing_scenarios
  failure_mechanism: insufficient_parameter_exploration
  source: guidance_supported
  confidence: high
diagnosis:
  observed_problem: "All 13 tests execute exclusively with the default elaborated\
    \ parameters DATA_WIDTH=8, DEPTH=4. The verification plan specifies test_values\
    \ DATA_WIDTH=[4,8,16] and DEPTH=[2,4,8], but the test harness has no regression-level\
    \ mechanism to iterate over these parameter combinations. Every test class, sequence,\
    \ coverage collector, scoreboard, and driver already reads DATA_WIDTH and DEPTH\
    \ from ConfigDB and scales stimulus/ checks accordingly \u2014 the parameterized\
    \ infrastructure exists but is never exercised beyond the single default configuration.\n"
  consequence: "The FIFO is never verified at non-default bus widths or depths. DEPTH=2\
    \ is especially critical: pointer wraparound occurs after only two entries, full/empty\
    \ flags toggle at minimal occupancy, and near_full_level coincides with one_entry\
    \ \u2014 exercising a distinct RTL code region. DATA_WIDTH=4 and DATA_WIDTH=16\
    \ test boundary data values at non-default widths. The 87.5% functional coverage\
    \ is only demonstrated at one configuration; coverage at other parameter combinations\
    \ is unknown.\n"
candidate_interventions:
- Add a Makefile 'regress' target that iterates DATA_WIDTH x DEPTH x key tests
- Add a Python wrapper script that invokes make for each parameter combination
- Add an internal parameter-sweep loop inside a meta-test class
selected_intervention:
  type: makefile_parameter_matrix
  changed_files:
  - tb/Makefile
  description: 'Add a ''regress'' target to the Makefile that invokes ''make'' for
    each combination of DATA_WIDTH in [4, 8, 16] and DEPTH in [2, 4, 8] (9 parameter
    configurations) for key directed tests (TC001-TC005, TC008) plus FifoCornerTest
    and FifoRandomizedTest (9 tests). Each invocation is an independent simulation
    with recompilation for the new parameters. Sequential execution with FAIL_ON_ERROR=1
    halts on the first failure. Verilator recompiles per parameter set via the existing
    DATA_WIDTH/DEPTH env-var plumbing in test_top.py.

    '
  expected_effect:
  - Exercises all 9 plan-specified parameter combinations across the highest-value
    tests
  - DEPTH=2 exercises pointer wraparound at minimum depth with full/empty toggle every
    entry
  - DATA_WIDTH=4 tests boundary data at narrow bus width (max_data=0xF)
  - DATA_WIDTH=16 tests boundary data at wide bus width (max_data=0xFFFF)
  - Coverage collectors and scoreboards already parameterized; no Python TB changes
    needed
  - Addresses the highest-severity weakness (severity=high) with minimal scope
regression_risks:
- Regression wall-clock time increases by up to 9x for the parameter-swept subset
- DEPTH=2 may expose latent TB or RTL issues at extreme parameters not previously
  exercised
- Verilator recompilation per parameter set adds compile overhead
- Per-test coverage YAML files from different parameter sets share the same test name;
  the existing per-test unique filenames and optional RUN_ID scoping mitigate cross-contamination
validation:
- Run make regress and verify all 9 parameter combinations pass for TC001-TC005, TC008,
  FifoCornerTest, FifoRandomizedTest
- Inspect per-parameter-configuration coverage YAML files to confirm parameterized
  bins (count_levels, write_data_bins, read_data_bins) reflect the correct DATA_WIDTH
  and DEPTH values
- Verify that DEPTH=2 configurations correctly exercise full/empty transitions at
  1-entry granularity
- Confirm no existing default-parameter test (DATA_WIDTH=8, DEPTH=4) regresses
