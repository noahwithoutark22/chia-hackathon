schema_version: '1.0'
decision:
  action: improve
  weakness_id: W2
  failure_class: missing_corner_case
  failure_mechanism: missing_functional_scenarios
  source: mixed
  confidence: high
diagnosis:
  observed_problem: "No directed test asserts asynchronous reset while the FIFO is\
    \ at full occupancy (count==DEPTH). Both TC009 (ResetDuringOpSeq) and the corner\
    \ ResetMidStreamSeq fill only 2 entries (count==2 of DEPTH==4) before resetting.\
    \ The plan's reset_mid_stream corner case says \"Assert rst_n while writes and\
    \ reads are in flight\" and reset_clean_state is checked, but the stuck-full recovery\
    \ scenario \u2014 reset at maximum occupancy \u2014 is never deterministically\
    \ exercised. The randomized test's resets are positioned by cycle count, not occupancy,\
    \ so reset-at-full is only coincidentally possible.\n"
  consequence: 'A bug where asynchronous reset fails to clear pointers or count when
    the FIFO is full would go undetected. The op_against_flags coverage cross has
    no rst_n dimension, so there is no coverage metric to flag this hole either. The
    stuck-full recovery pattern is a standard FIFO verification obligation that is
    currently unverified.

    '
candidate_interventions:
- 'Add a ResetAtFullSeq corner sequence: fill to DEPTH, assert rst_n for 2-3 cycles,
  check empty=1/full=0/dout=0, release, verify clean post-reset write+read, and register
  it in CORNER_SEQUENCES.'
- Add an rst_n x full coverage cross to measure reset-at-full on randomized runs.
- "Defer \u2014 W2 is low severity and the randomized test may coincidentally hit\
  \ it."
selected_intervention:
  type: new_directed_corner_sequence
  expected_effect:
  - Exercises the deterministic stuck-full recovery path that is currently unverified.
  - Fills the plan's reset_mid_stream corner case gap for the full-occupancy variant.
  - Gets automatically included in FifoCornerTest via CORNER_SEQUENCES.
  - Adds a small number of scoreboard-checked cycles at the reset boundary, improving
    scenario coverage.
regression_risks:
- 'None: the new sequence is additive (appended to CORNER_SEQUENCES), does not modify
  any existing sequence, test class, driver, monitor, scoreboard, coverage definition,
  or coverage export logic.'
- The sequence uses the same reset/check primitives (_assert_reset, _release_reset,
  _check_outputs) as every other sequence, so timing assumptions are consistent.
- "FifoCornerTest will run the new sequence after existing corner sequences, adding\
  \ a few hundred cycles \u2014 well within the WATCHDOG_MAX_CYCLES budget."
validation:
- FifoCornerTest must still pass with zero scoreboard mismatches.
- The new sequence's inline checks must confirm empty=1/full=0/dout=0/count=0 immediately
  after reset assertion while the FIFO was previously full.
- Post-reset write+read must return the correct value, confirming clean recovery.
- "No existing test must regress \u2014 run the full 13-test regression and confirm\
  \ all pass."
