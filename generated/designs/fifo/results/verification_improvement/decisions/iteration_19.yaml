schema_version: '1.0'
decision:
  action: improve
  weakness_id: W-NO-PARAMETER-VARIATION
  failure_class: missing_scenarios
  failure_mechanism: insufficient_parameter_exploration
  source: mixed
  confidence: high
diagnosis:
  observed_problem: 'All 13 tests execute exclusively with the default parameters
    DATA_WIDTH=8 and DEPTH=4. The verification plan specifies test_values DATA_WIDTH=[4,8,16]
    and DEPTH=[2,4,8] (9 parameter configurations). No test has ever been run under
    a non-default parameter combination, leaving the majority of the planned design
    space unexercised. The TB Python code (sequences, assertions, scoreboard) already
    scales correctly with DEPTH and DATA_WIDTH via ConfigDB reads, but no mechanism
    iterates the simulation over the plan-specified parameter matrix.

    '
  consequence: 'DEPTH=2 pointer wraparound (only 2 entries before full/empty toggle),
    DATA_WIDTH=4 boundary data at non-default bus width (max=0xF), and DATA_WIDTH=16
    wide-bus boundary data (max=0xFFFF) are never exercised. A bug that manifests
    only at a non-default parameter combination would be missed. Quality score is
    stalled at 81.88 across iterations 14-18.

    '
candidate_interventions:
- 'Makefile regress target: iterate make invocations over DATA_WIDTH x DEPTH matrix
  for key tests'
- "cocotb test_factory in test_top.py to generate per-parameter-configuration test\
  \ variants (requires DUT recompilation per config \u2014 impractical without Makefile\
  \ support)"
- Inline parameter loop inside test.py (rejected in iteration 18 for causing test
  failures; conflates parameter sweep with seed sweep)
selected_intervention:
  type: makefile_parameter_matrix
  description: 'Add a ''regress'' target to tb/Makefile that invokes ''make'' for
    each combination of DATA_WIDTH in [4, 8, 16] and DEPTH in [2, 4, 8] (9 parameter
    configurations) for key directed tests TC001-TC005, TC008, FifoCornerTest, FifoBackToBackTest,
    and FifoRandomizedTest. Each invocation is an independent Verilator compilation
    + cocotb simulation with recompiled RTL parameters via the existing DATA_WIDTH/DEPTH
    env-var plumbing. Sequential execution with a halt-on-failure flag ensures early
    termination on the first failure. DATA_WIDTH and DEPTH are passed as Verilator
    compile-time parameter overrides (e.g. -GDATA_WIDTH=<val> -GDEPTH=<val>) so the
    RTL is actually instantiated at the target width and depth, and the TB components
    read the same values from environment/ConfigDB.

    '
  expected_effect:
  - Exercises all 9 plan-specified parameter combinations across 11 high-value tests
    (99 total simulation runs)
  - DEPTH=2 exercises pointer wraparound at minimum depth with full/empty toggle every
    entry
  - DATA_WIDTH=4 tests boundary data at narrow bus width (max_data=0xF)
  - DATA_WIDTH=16 tests boundary data at wide bus width (max_data=0xFFFF)
  - "All existing coverage collectors, scoreboards, and assertion checkers already\
    \ parameterized \u2014 no Python TB changes needed"
  - Addresses the highest-severity open weakness (severity=high) with Makefile-only
    scope
  - Indirectly exercises boundary_data_concurrent cross bins at non-default widths,
    partially addressing W-BOUNDARY-CROSS-GAP
  justification_for_retry: "Iteration 17 proposed the same mechanism (makefile_parameter_matrix)\
    \ but the execution LLM produced zero TB changes (result=no_change). The approach\
    \ was never actually implemented \u2014 the execution phase failed to act, not\
    \ the design phase. The evidence strongly supports the mechanism: the Makefile\
    \ already has DATA_WIDTH/DEPTH as overridable exported variables, the TB Python\
    \ code reads them from ConfigDB, and a regress target is the standard cocotb pattern\
    \ for multi-configuration sweeps. No design-level flaw was found in the approach.\n"
regression_risks:
- Verilator may not support -G parameter overrides in the expected syntax for all
  parameters; the COMPILE_ARGS mechanism must be verified for DATA_WIDTH/DEPTH override
  correctness
- DEPTH=2 with TC002 writes [17,34,51][:min(3,depth-1)] = [17] only 1 value; the test
  still passes but exercises less stimulus
- 99 simulation runs significantly increase regression wall-clock time; consider parallelization
  in a future iteration
- "If any test fails under a new parameter configuration, the regress target halts\
  \ and the quality score drops \u2014 must ensure all tests are truly parameter-agnostic"
validation:
- After implementation, run 'make -C tb regress UVM_TESTNAME=FifoTC003Test DATA_WIDTH=16
  DEPTH=8' and verify Verilator compiles with the overridden parameters
- Confirm FifoTC003Test (write_until_full) passes under DEPTH=2 (only 2 writes to
  fill, then overflow write dropped)
- Confirm FifoTC010Test (boundary_roundtrip) passes under DATA_WIDTH=4 (max_data=0xF,
  values 0 and 0xF round-trip)
- Check simulation_result.json shows parameter-swept runs with different DATA_WIDTH/DEPTH
  values
- Verify no test that previously passed at DATA_WIDTH=8 DEPTH=4 now fails under the
  same defaults (regression guard)
