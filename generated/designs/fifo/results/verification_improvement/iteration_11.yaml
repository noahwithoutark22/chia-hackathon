weaknesses:
- id: W-CORNER-TEST-CRASH
  severity: critical
  category: tb_timing_bug
  title: ResetAtFullSeq crashes on ReadOnly-phase signal drive, aborting FifoCornerTest
  affected_tests:
  - FifoCornerTest
  evidence:
  - FifoCornerTest status=runtime_error, returncode=2, clean_exit=false
  - 'Traceback: RuntimeError: Attempting settings a value during the ReadOnly phase
    at sequences.py:112 (setimmediatevalue) called from sequences.py:791 (ResetAtFullSeq.body
    calls _assert_reset)'
  - Crash occurs at 2040ns in simulation, after ResetMidStreamSeq completes but before
    DoutRetentionSeq starts
  - "FifoCornerTest scoreboard_mismatches=0, assertion_failures=0, uvm_errors=0 \u2014\
    \ the crash is a TB bug, not a DUT bug"
  likely_cause: 'Inference: ResetAtFullSeq.body() calls _check_outputs(full=1, empty=0,
    count=d) which internally awaits ReadOnly() to sample pins. Immediately after
    _check_outputs returns, the sequence calls _assert_reset(), whose first action
    is self.dut.rst_n.setimmediatevalue(0). At that point the coroutine is still executing
    within cocotb''s ReadOnly phase (the event loop has not advanced to ReadWrite),
    and cocotb 2.1.0 forbids signal writes during ReadOnly. All other sequences that
    call _assert_reset() do so at the start of body() before any _check_outputs()
    call, avoiding this conflict.'
  investigation_targets:
  - tb/sequences.py  (ResetAtFullSeq.body lines 781-804, _assert_reset lines 110-121,
    _check_outputs lines 177-208)
  recommended_action: 'Fix ResetAtFullSeq.body() to insert a cocotb phase transition
    between _check_outputs() and _assert_reset(). Two options: (1) insert ''await
    Timer(0)'' or ''await cocotb.triggers.ReadWrite()'' before calling _assert_reset(),
    which advances the simulation past ReadOnly; or (2) restructure _assert_reset()
    to await a FallingEdge or Timer(0) before driving rst_n. The same fix should be
    applied defensively in _assert_reset() itself so no future sequence can hit this
    invariant.'
  confidence: high
- id: W-CORNER-DOUT-RETENTION-UNVERIFIED
  severity: high
  category: incomplete_coverage
  title: DoutRetentionSeq never executes because preceding ResetAtFullSeq crashes
  affected_tests:
