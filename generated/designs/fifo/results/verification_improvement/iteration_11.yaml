  - DoutRetentionSeq is CORNER_SEQUENCES[9] and never starts (the for-loop in FifoCornerTest._run_scenario
    aborts on the exception)
  - The plan corner_cases entry 'dout_retention_after_ignored_read' maps to DoutRetentionSeq;
    this scenario is never exercised
  - TC004 (ReadUntilEmptySeq) does check dout retention as part of its sequence, but
    DoutRetentionSeq additionally verifies that normal operation resumes correctly
    after an ignored read, which TC004 does not cover
  likely_cause: 'Inference: direct consequence of W-CORNER-TEST-CRASH. The sequential
    for-loop in FifoCornerTest._run_scenario (test.py:314-320) does not catch exceptions
    per sequence, so a crash in any sequence aborts the entire test.'
  investigation_targets:
  - tb/test.py  (FifoCornerTest._run_scenario lines 312-320)
  - tb/sequences.py  (DoutRetentionSeq lines 807-834)
  recommended_action: After fixing W-CORNER-TEST-CRASH, verify DoutRetentionSeq runs
    successfully. Additionally, consider wrapping each corner-case sequence in a try/except
    within FifoCornerTest._run_scenario so that one sequence's crash does not prevent
    subsequent sequences from executing. Log failures per-sequence for visibility.
  confidence: high
- id: W-CORNER-SEQUENCES-LOST
  severity: high
  category: incomplete_coverage
  title: All corner-case sequences after the crash point are lost, including ResetAtFullSeq
    itself
  affected_tests:
  - FifoCornerTest
  evidence:
  - ResetAtFullSeq (reset_at_full corner case) crashes mid-execution, so its verification
    of reset-at-full-occupancy is incomplete
  - DoutRetentionSeq never starts
  - Both the reset_at_full and dout_retention_after_ignored_read plan corner_cases
    are unverified
  - Previous corner-case sequences (WriteWhenFullSeq through ResetMidStreamSeq, indices
    0-7) ran but their results are discarded because the test overall reports runtime_error
  likely_cause: 'Inference: the FifoCornerTest._run_scenario method iterates CORNER_SEQUENCES
    sequentially without per-sequence error isolation. The RuntimeError from ResetAtFullSeq
    propagates up, failing the entire test before the remaining sequences can execute.'
  investigation_targets:
  - tb/test.py  (FifoCornerTest._run_scenario lines 312-320)
  - tb/sequences.py  (CORNER_SEQUENCES list lines 1043-1054)
  recommended_action: Wrap each sequence invocation in FifoCornerTest._run_scenario
    with per-sequence exception handling so that one crash does not prevent subsequent
    corner-case sequences from running. Log each sequence's pass/fail individually.
    This ensures maximum corner-case coverage even when one sequence has a TB bug.
  confidence: high
- id: W-DRIVER-IDLE-WALL
  severity: medium
  category: stimulus_limitation
  title: Driver inserts mandatory idle cycle between every two sequence items, preventing
    truly back-to-back DUT operations
  affected_tests:
  - FifoBackToBackTest
  - FifoRandomizedTest
  - All directed tests
  evidence:
  - 'driver.py lines 109-127: after item_done(), _drive_idle() is called before the
    next get_next_item(); this drives wr_en=0 rd_en=0 din=0 for at least one clock
    cycle between consecutive items'
  - 'driver.py docstring (lines 104-107) acknowledges: ''An idle cycle (wr_en=0, rd_en=0)
    is driven before blocking for the next item, preserving CONTRACT 9.3''s declared
    idle wall'''
  - The DUT therefore never sees wr_en=1 on two consecutive rising edges, nor rd_en=1
    on two consecutive rising edges, nor a write followed immediately by a read on
    consecutive edges
  - FifoBackToBackTest name implies back-to-back, but every pair of operations is
    separated by an idle cycle at the DUT level
  likely_cause: 'Inference: intentional design decision documented in driver.py and
    CONTRACT.md 9.3, but it limits verification coverage. For a synchronous FIFO with
    the given protocol idle cycles are semantic no-ops, so this does not create a
    false-confidence issue for this specific DUT. However, it means the TB cannot
    detect bugs that only manifest under truly zero-gap consecutive operations (e.g.,
    internal pipeline timing issues).'
  investigation_targets:
  - tb/driver.py  (run_phase lines 93-127, especially the _drive_idle call after item_done)
  recommended_action: Add a back-to-back mode to FifoDriver that, when enabled by
    a ConfigDB flag, skips the idle cycle between consecutive items when the sequence
    provides them rapidly. This would allow FifoBackToBackTest and FifoRandomizedTest
    to exercise truly consecutive operations without idle gaps.
  confidence: high
- id: W-REF-MODEL-MUTABLE-STATE
  severity: low
  category: scoreboard_robustness
  title: Reference model step() mutates its input state dict in place, creating implicit
    coupling with scoreboard
  affected_tests:
  - All tests using the scoreboard
  evidence:
  - 'tb/ref_model.py step() lines 6-22: q = state[''queue''] obtains a reference to
    the deque, then q.append() and q.popleft() mutate it in place'
  - 'tb/scoreboard.py line 169-171: calls ref_model.step(self._state, ...) and uses
    the returned state; because step mutates in place, self._state''s queue is modified
    as a side effect'
  - 'This works correctly for the current single-scoreboard architecture, but creates
    a subtle invariant: the scoreboard MUST pass self._state directly and must not
    create copies beforehand'
  - If a future change introduces a second scoreboard or prediction path that passes
    a copy of the state, the copy's queue would diverge from the original's, causing
    silent prediction errors
  likely_cause: 'Inference: the reference model is a direct copy of benchmarks/fifo/ref_model.py
    per CONTRACT.md 11.1 and must not be modified. The mutation-in-place behavior
    is by design in the original model. The scoreboard correctly accounts for this
    by tracking the returned state reference.'
  investigation_targets:
  - tb/ref_model.py  (step function, lines 6-22)
  - tb/scoreboard.py  (run_phase, _advance_and_check, lines 118-173)
  recommended_action: No immediate fix required. Document the mutation-in-place invariant
    explicitly in scoreboard.py comments (already partially done). If multi-scoreboard
    or prediction-comparison separation is added later, the scoreboard should clone
    the state before passing it to step().
  confidence: medium
