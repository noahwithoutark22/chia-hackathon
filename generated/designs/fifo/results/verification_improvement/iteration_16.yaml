weaknesses:
- id: W-NO-PARAMETER-VARIATION
  severity: high
  category: missing_scenarios
  title: All tests exercise only default DATA_WIDTH=8 DEPTH=4
  affected_tests:
  - FifoTC001Test
  - FifoTC002Test
  - FifoTC003Test
  - FifoTC004Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoTC010Test
  - FifoCornerTest
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - 'simulation_result.json: all 13 tests run with identical default parameters (DATA_WIDTH=8
    DEPTH=4); no evidence of parameter-swept runs'
  - 'verification_plan.yaml specifies test_values: DATA_WIDTH=[4,8,16] DEPTH=[2,4,8]'
  - 'tb/test_top.py lines 112-113: data_width and depth resolved from environment
    with fixed defaults DATA_WIDTH=8 DEPTH=4'
  likely_cause: 'Inference: the test harness resolves parameters from environment
    variables with hardcoded defaults but the simulation manifest does not iterate
    over the plan-specified parameter combinations.  Only a single parameter configuration
    is exercised.

    '
  investigation_targets:
  - tb/test_top.py
  - simulation_result.json
  recommended_action: 'Add a parameterized test matrix that runs key directed tests
    (at minimum TC001-TC005 and TC008) under each combination of DATA_WIDTH in [4,
    8, 16] and DEPTH in [2, 4, 8].  DEPTH=2 is especially critical because pointer
    wraparound occurs after only two entries and the full/empty flags toggle at minimal
    occupancy.  DATA_WIDTH=4 and DATA_WIDTH=16 test boundary data values at non-default
    bus widths.

    '
  confidence: high
- id: W-RANDOMIZED-SINGLE-SEED
  severity: medium
  category: limited_stimulus
  title: Randomized test always uses the same deterministic seed
  affected_tests:
  - FifoRandomizedTest
  evidence:
  - 'tb/sequences.py FifoRandomizedSeq: seed resolved to hash(self.get_name()) & 0x7FFFFFFF,
    producing one fixed seed per test name'
  - 'simulation_result.json FifoRandomizedTest: clean exit, 0 mismatches, but only
    one stimulus pattern exercised'
  - 'tb/sequences.py line 950: seed = hash(self.get_name()) & 0x7FFFFFFF (deterministic,
    never varies across runs)'
  likely_cause: 'Inference: the randomization infrastructure prioritises reproducibility
    (one deterministic seed per test name) but provides no mechanism for seed sweeps
    across regression iterations, so the constrained-random stimulus always explores
    the same input trajectory.

    '
  investigation_targets:
  - tb/sequences.py
  - tb/test.py
  recommended_action: 'Extend the randomized test to iterate over multiple seeds (e.g.
    10-20 seeds per regression run) or add a RANDOM_SEED_COUNT environment variable
    that drives a seed sweep loop.  This increases the probability of exercising corner-case
    stimulus patterns that a single seed misses.

    '
  confidence: high
- id: W-DRIVER-IDLE-WALL
  severity: low
  category: structural_limitation
  title: Driver inserts an idle cycle between every pair of consecutive items preventing
    true back-to-back active operations
  affected_tests:
  - FifoTC002Test
  - FifoTC003Test
  - FifoTC004Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoTC010Test
  - FifoCornerTest
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - 'tb/driver.py lines 120-127: after every item_done() the driver unconditionally
    calls self._drive_idle() (wr_en=0, rd_en=0, din=0), guaranteeing at least one
    idle rising edge between any two active items'
  - 'tb/driver.py line 116-120: the driver waits FallingEdge before driving and FallingEdge
    again before item_done, inserting a full idle cycle even when consecutive items
    are available from the sequencer'
  likely_cause: 'Inference: the driver architecture uses FallingEdge synchronization
    for safe stimulus application and always deasserts all inputs after each item
    for timing safety.  This prevents the DUT from ever seeing active inputs (wr_en=1
    or rd_en=1) on two consecutive rising clock edges.

    '
  investigation_targets:
  - tb/driver.py
  recommended_action: 'For this synchronous FIFO the idle wall is low risk because
    each clock edge is functionally independent.  However, for stronger verification
    consider adding a back-to-back driver mode that can drive consecutive items on
    consecutive falling edges (skipping the idle drive when the sequencer has a pending
    item), and enable it in the BackToBack and randomized tests.

    '
  confidence: medium
- id: W-BOUNDARY-CROSS-GAP
  severity: low
  category: coverage_gap
  title: boundary_data_concurrent (data_max data_max_out) bin never hit by any directed
    test
  affected_tests:
  - FifoTC010Test
  - FifoCornerTest
  - FifoBackToBackTest
  evidence:
  - 'tb/fifo_coverage_FifoTC010Test.yml: boundary_data_concurrent bins (''data_max'',''data_max_out''):
    0 hits; only (''data_max'',''data_zero_out''): 2 and (''data_zero'',''data_max_out''):
    2 are hit'
  - 'tb/fifo_coverage_FifoCornerTest.yml: boundary_data_concurrent (''data_max'',''data_max_out''):
    0 hits'
  - 'tb/fifo_coverage_FifoRandomizedTest.yml: only the randomized test hits all 4
    bins including (''data_max'',''data_max_out''): 3'
  likely_cause: 'Inference: the boundary_data_concurrent cross samples din and dout
    on the same clock edge.  din is the write input (0xFF only on active write cycles)
    while dout is the registered output from the previous read.  Due to the driver
    idle wall all directed sequences write 0xFF and read 0xFF on separate cycles with
    an idle gap between them, so din and dout are never simultaneously at the maximum
    value.

    '
  investigation_targets:
  - tb/coverage.py
  - tb/sequences.py
  recommended_action: 'Add a directed sequence that writes 0xFF, reads (getting 0xFF
    on dout), then on the very next active cycle writes 0xFF again so that din=0xFF
    and dout=0xFF (still registered from the previous read) appear simultaneously.
    Alternatively accept that this cross bin is only covered by the randomized test
    and document the dependency.

    '
  confidence: medium
