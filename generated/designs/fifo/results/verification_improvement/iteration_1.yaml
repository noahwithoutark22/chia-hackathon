weaknesses:
- id: W1-driver-try-next-crash
  severity: critical
  category: driver-runtime-error
  title: Back-to-back driver mishandles try_next_item() bool return, crashing every
    data-path test
  affected_tests:
  - FifoTC002Test
  - FifoTC003Test
  - FifoTC004Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoTC010Test
  - FifoCornerTest
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - 12 of 13 tests report status=runtime_error, returncode=2, clean_exit=false (all
    except FifoTC001Test).
  - 'Identical traceback in every failed test: ''File driver.py, line 161, in run_phase:
    self._drive(next_item.wr_en, next_item.rd_en, next_item.din)'' followed by ''AttributeError:
    ''bool'' object has no attribute ''wr_en''''.'
  - All failures occur at the same simulation time (95ns for TC002..TC010/Corner/BackToBack;
    85ns for Randomized), i.e. during the first back-to-back item after the reset
    prologue, before any real data-path cycle is exercised.
  - 'driver.py lines 146-161: when try_next_item() returns a bare bool (True when
    an item is available), the code only unpacks None/tuple forms, so next_item becomes
    the bool and _drive(next_item.wr_en,...) dereferences a bool.'
  likely_cause: "The driver assumes try_next_item() returns either None or a (item,\
    \ seq_id) tuple (per its own comment), but the pyuvm version used at simulation\
    \ runtime returns a Boolean success flag. The attempted defensive tuple-unpacking\
    \ does not handle the bare-boolean return, so the availability signal is mistaken\
    \ for the item itself. (Inference: symptom\u2014bool subscripts .wr_en\u2014is\
    \ fully consistent with try_next_item() returning True/False.)"
  investigation_targets:
  - tb/driver.py (run_phase back-to-back block, ~lines 144-173; _has_try_next detection
    at line 70)
  - tb/conformance to the runtime pyuvm seq_item_port API return contract
  recommended_action: Correct the back-to-back driver to use the blocking get_next_item()/item_done()
    sequencer API (which returns the item itself) instead of try_next_item(), or,
    if try_next_item() is kept, treat its Boolean return strictly as an availability
    indicator and only extract the item when it is not a bool / not None AND is actually
    a FifoTransaction. Re-run the full regression to confirm all 13 tests execute
    their stimulus instead of dying in the driver.
  confidence: high
- id: W2-single-pass-false-confidence
  severity: high
  category: regression-integrity
  title: Only the reset-only test passes; the suite reports overwhelmingly unverified
    behavior
  affected_tests:
  - FifoTC001Test
  evidence:
  - 'The sole passing test (FifoTC001Test) is reset_check: ''TEST PASSED: 5 items
    checked, 0 mismatches, 3 resets observed''; its coverage shows only reset-state
    bins (is_empty=5, not_full=5, wr_idle=5, rd_idle=5, empty_level=5) and reachable
    op_against_flags 1/8 (12.5%) with 7 reachable bins explicitly reported as NOT
    hit.'
  - FifoTC001Test never drives wr_en/rd_en/din (wr_active=0, rd_active=0, data_max=0,
    data_zero=0), so it verifies only the reset/deassert path and zero write/read/full/empty
    data transitions.
  - "TC001 aggregate coverage log: 'FifoCoverage aggregate: 12/49 total bins hit across\
    \ all tests (24.5%)' and 'FifoCoverage merge: excluded 11 stale per-test file(s)'\
    \ \u2014 the 12 crashed tests produced no per-test coverage file, so the merged\
    \ report reflects a single reset-only run."
  likely_cause: 'Because every test that drives stimulus crashes in the driver (W1)
    before exercising the data path, FifoTC001Test (which needs no stimulus items)
    is the only test able to reach report_phase. Its pass gate (items_checked>0 and
    zero mismatches) is satisfied by reset probing alone, presenting a green result
    that does not reflect FIFO functional verification. (Inference: the pass criterion
    is structurally insufficient to detect that 12/13 tests never ran.)'
  investigation_targets:
  - tb/test.py (report_phase pass criterion, lines 98-137)
  - tb/coverage.py (_merge_per_test_coverage and reachable-only metrics)
  - tb/sequences.py (ResetCheckSeq)
  recommended_action: After fixing W1, re-run the regression; the pass/fail gate and
    coverage merge should then aggregate real data-path coverage. Consider strengthening
    the pass criterion to require meaningful stimulus (e.g. at least one accepted
    write and one accepted read, and minimum functional-coverage thresholds across
    the write/read/full/empty bins) so a reset-only run cannot satisfy PASS.
  confidence: high
