- id: W-FIFO-ORDERING-UNVERIFIED
  severity: medium
  category: scenario_coverage
  title: FIFO ordering across pointer wraps never verified in passing tests
  affected_tests:
  - FifoTC002Test
  - FifoTC004Test
  - FifoTC010Test
  evidence:
  - 'simulation_result.json: FifoTC008Test (pointer_wraparound_ordering) status=runtime_error'
  - "tb/sequences.py PointerWrapOrderingSeq: fills to full, reads 2, writes 2, reads\
    \ 2, writes 1, drains \u2014 exercises pointer wrap-around with interleaved operations"
  - 'verification_plan.yaml TC008: Interleave reads and writes across fill and drain
    cycles so rd_ptr and wr_ptr wrap modulo DEPTH'
  - 'coverage YAML files: no test that exercises more than one full fill-drain cycle
    completes'
  likely_cause: 'Inference: TC008 crashes due to W-RUNTIME-CRASH-MAJORITY. The three
    passing tests each do a single fill-then-drain cycle, which only exercises pointer
    positions 0 through DEPTH-1 once. Pointer wrap-around (where rd_ptr or wr_ptr
    wraps from DEPTH-1 back to 0 and then advances further) is never tested.'
  investigation_targets:
  - tb/sequences.py PointerWrapOrderingSeq body method
  recommended_action: 'Fix the runtime crash so TC008 can execute. Pointer wrap-around
    is a critical FIFO behavior: a defect in the modular pointer arithmetic (e.g.,
    off-by-one in the wrap condition) would only manifest after the pointer has advanced
    past position 0 more than once.'
  confidence: high
