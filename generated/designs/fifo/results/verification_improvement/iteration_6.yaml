weaknesses:
- id: W-RUNTIME-CRASH-MAJORITY
  severity: critical
  category: tb_infrastructure
  title: Ten of thirteen tests crash at runtime before exercising any scenario
  affected_tests:
  - FifoTC001Test
  - FifoTC003Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoCornerTest
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - 'simulation_result.json: all ten tests report status=runtime_error, returncode=2,
    clean_exit=false'
  - 'simulation_result.json: scoreboard_mismatches=0 and assertion_failures=0 for
    every crashing test, indicating the crash occurs before any checking logic runs'
  - 'simulation_result.json: the three passing tests (TC002, TC004, TC010) all complete
    with returncode=0 and clean_exit=true, proving the DUT and basic infrastructure
    work'
  - 'simulation_result.json TC001 log: the test starts (UVM_TESTNAME logged, cocotb
    initialized) but crashes before completing'
  - "simulation_result.json TC003 log: same pattern \u2014 compilation succeeds, cocotb\
    \ initializes, test starts, then crashes"
  likely_cause: 'Inference: the crash occurs during pyuvm phase transitions or coroutine
    cleanup in cocotb 2.1.0 / pyuvm 5.0.0 / Verilator 5.042. The tests that crash
    include both simple (TC001: reset-only, no drive_item calls) and complex (TC008:
    pointer wraparound) scenarios, ruling out DUT-specific or scenario-specific causes.
    The driver''s infinite-loop run_phase coroutine (blocked on get_next_item() when
    the sequence never issues a drive_item) may not be cleanly cancellable during
    pyuvm phase teardown, causing an unhandled exception or Verilator segfault at
    simulation exit.'
  investigation_targets:
  - tb/driver.py run_phase coroutine lifecycle and cancellation behavior
  - tb/test.py _run_single_sequence drain_cycles timing vs pyuvm run_phase objection
    teardown
  - tb/test_top.py uvm_root().run_test exception handling interaction with cocotb
    coroutine cleanup
  recommended_action: Investigate whether the driver's blocked get_next_item() coroutine
    prevents clean pyuvm run_phase termination. Add explicit sequencer.stop() or driver
    shutdown mechanism before dropping the run_phase objection. Alternatively, ensure
    the driver's infinite loop can be cancelled gracefully by catching asyncio.CancelledError.
    Reproduce with the simplest crashing test (FifoTC001Test) which never calls drive_item.
  confidence: medium
- id: W-SCOREBOARD-MISMATCH-UNCHECKED
  severity: high
  category: pass_fail_logic
  title: All three passing tests each report one scoreboard mismatch yet still pass
  affected_tests:
  - FifoTC002Test
  - FifoTC004Test
  - FifoTC010Test
  evidence:
  - 'simulation_result.json: FifoTC002Test status=pass, returncode=0, scoreboard_mismatches=1'
  - 'simulation_result.json: FifoTC004Test status=pass, returncode=0, scoreboard_mismatches=1'
  - 'simulation_result.json: FifoTC010Test status=pass, returncode=0, scoreboard_mismatches=1'
  - "tb/test.py report_phase: checks sb._mismatch_count > 0 and raises AssertionError\
    \ if true \u2014 yet the test still returns code 0"
  - "tb/scoreboard.py report_phase: logs warning 'FifoScoreboard FAILED: N comparison\
    \ mismatch(es)' when _mismatch_count is nonzero \u2014 this message is what the\
    \ simulation framework extracts as the mismatch count"
  likely_cause: "Inference: a pyuvm phase-ordering issue causes the test's report_phase\
    \ to execute before the scoreboard has processed all pending monitor transactions.\
    \ The scoreboard's run_phase is an infinite coroutine (while True: tr = await\
    \ self.analysis_fifo.get()). When pyuvm transitions from run_phase to report_phase,\
    \ the scoreboard may still have unprocessed items in its analysis FIFO. The test's\
    \ report_phase sees _mismatch_count==0 and passes. The scoreboard's report_phase\
    \ then processes the remaining item(s), finds the mismatch, and logs the warning\
    \ \u2014 but the test has already been marked as passed by cocotb."
  investigation_targets:
  - tb/test.py report_phase: sb._mismatch_count check timing relative to scoreboard
      run_phase completion
  - tb/scoreboard.py run_phase: whether analysis_fifo items are fully drained before
      report_phase
  - tb/test.py _run_single_sequence: drain_cycles count (currently 2) may be insufficient
      for the scoreboard to process final transactions before objection drop
  recommended_action: 'Add a drain mechanism that ensures the scoreboard''s analysis
    FIFO is empty before the test''s report_phase checks _mismatch_count. Options:
    (1) increase drain_cycles in _run_single_sequence to give the scoreboard more
    time, (2) add an explicit drain loop in the test''s run_phase that waits until
    the scoreboard''s analysis_fifo is empty after the sequence completes, or (3)
    move the mismatch check from report_phase to a post-drain synchronization point.
    Also investigate whether pyuvm 5.0.0 properly awaits all run_phase coroutines
    before starting report_phase.'
  confidence: high
