    0 hits'
  - 'tb/fifo_coverage coverage.py: op_against_flags cross reachable bin (1, 1, 0,
    0) has 0 hits in all three passing tests'
  - 'simulation_result.json: TC005, TC006, TC007 (the three tests that exercise simultaneous
    R/W) all crash with runtime_error'
  likely_cause: 'Inference: the only tests designed to exercise simultaneous read+write
    (TC005 mid-occupancy, TC006 at full, TC007 at empty) all crash at runtime due
    to W-RUNTIME-CRASH-MAJORITY. The three passing tests are sequential-only (write-then-read
    or read-then-write). No test in the passing set drives wr_en=1 and rd_en=1 in
    the same cycle.'
  investigation_targets:
  - tb/sequences.py SimultaneousReadWriteSeq, SimultaneousReadWriteFullSeq, SimultaneousReadWriteEmptySeq
  - tb/test.py FifoTC005Test, FifoTC006Test, FifoTC007Test
  recommended_action: Fix the runtime crash (W-RUNTIME-CRASH-MAJORITY) so that TC005/TC006/TC007
    can execute. The simultaneous read+write scenario is a critical FIFO behavior
    per the specification ('When both read and write are accepted in the same cycle,
    both operations occur and the occupancy remains unchanged') and per DIS-2 (write
    silently dropped during simultaneous R/W at full). Without exercising this, a
    defect in the simultaneous-cycle logic would be undetected.
  confidence: high
