weaknesses:
- id: W1-READONLY-DOUBLE-AWAIT
  severity: critical
  category: test_infrastructure_crash
  title: Back-to-back output checks crash with illegal ReadOnly transition, blocking
    all count-validation tests
  affected_tests:
  - FifoTC001Test
  - FifoTC003Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoCornerTest
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - 'Every one of the 10 runtime_error tests ends with: ''RuntimeError: Attempted
    illegal transition: awaiting ReadOnly in ReadOnly phase'' raised at tb/sequences.py:174
    (_check_outputs -> await ReadOnly()), reached via _check_count() at tb/sequences.py:187.'
  - In every failing test the crash occurs at the line calling _check_count() immediately
    after a preceding _check_outputs() call within the same clock phase (e.g. TC001
    lines 234-235, TC003 lines 284-285, TC005 lines 350-351, TC006 lines 381-382,
    TC007 lines 406-407, TC008 lines 446-447).
  - The three passing tests (TC002/TC004/TC010) never call _check_count(), calling
    _check_outputs() only after an explicit _wait()/read, so the one-shot ReadOnly
    trigger is re-armed each time and they avoid the crash by chance.
  - simulation_result.json marks the whole run 'functional_failure' and these 10 tests
    have returncode 2 / clean_exit false.
  likely_cause: 'Inference: tb/sequences.py _check_outputs() awaits the one-shot cocotb
    ReadOnly() trigger unconditionally on every call. When a sequence issues two _check_*()
    calls within the same read-only timestep (e.g. _check_outputs(...) then _check_count(...)),
    the second await ReadOnly() fires while the coroutine is already inside the read-only
    phase, which cocotb rejects. The count-validation helper is therefore unusable
    in the back-to-back check pattern used by every data-path and corner scenario.'
  investigation_targets:
  - tb/sequences.py:174 (_check_outputs)
  - tb/sequences.py:185-188 (_check_count)
  - tb/sequences.py:234-235, 284-285, 350-351, 406-407, 446-447 (crashing call sites)
  recommended_action: 'Make _check_outputs() read-only-phase safe: track a flag/attribute
    indicating the coroutine is already in the ReadOnly phase and only await ReadOnly()
    on the first check (or await ReadOnly() once per timestep up front, then sample
    all requested pins from that single read-only sample). Alternatively ensure consecutive
    _check_*() calls are always separated by a clock edge. Do not leave the only count-validation
    path raising at runtime.'
  confidence: high
- id: W2-CRITICAL-CORNER-NOT-VERIFIED
  severity: high
  category: coverage_gap_critical_corner
  title: Plan's most critical corner cases never actually run because their tests
    crash
  affected_tests:
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoCornerTest
  evidence:
  - The simultaneous read+write tests (TC005 mid, TC006 at-full, TC007 at-empty),
    the pointer-wraparound test (TC008), and the reset-during-operation test (TC009)
    all end in the W1 ReadOnly runtime_error before completing, so their intended
    corner behavior is never checked.
  - 'In the passing tests, coverage.py reports op_against_flags reachable bin (1,1,0,0)
    (simultaneous read+write at mid occupancy) as NOT hit: FifoTC002Test ''reachable-only:
    5/8 bins hit'' and FifoTC004Test ''reachable-only: 7/8 bins hit ... NOT hit: [(1,
    1, 0, 0)]''. The other 8 bins of the cross are all zero-hit in the passing runs
    too.'
  - TC002 (pass) reports full_level=0 and is_full=0 (never reaches full), so the write-while-full
    drop path is not exercised by any passing test; only TC004/TC010 reach full, and
    those do not drive concurrent read+write.
  likely_cause: 'Inference: the directed corner scenarios that would exercise simultaneous
    read/write, wraparound ordering, and mid-stream reset all call _check_count()
    (see W1) and therefore all crash before their stimulus/assertions complete. The
    only tests that survive are the basic write/read, read-until-empty, and data-boundary
    scenarios that avoid _check_count().'
  investigation_targets:
  - tb/sequences.py (SimultaneousReadWriteSeq, SimultaneousReadWriteFullSeq, SimultaneousReadWriteEmptySeq,
    PointerWrapOrderingSeq, ResetDuringOpSeq, and CORNER_SEQUENCES)
  - tb/coverage.py (_REACHABLE_OP_FLAG_COMBOS, op_against_flags reporting)
  recommended_action: After fixing W1, re-run the full regression and confirm the
    corner tests complete and their functional-coverage bins hit, in particular op_against_flags
    (1,1,0,0), write_while_full, and fifo_occupancy_cg full_level. Add a regression
    gate that fails if any reachable op_against_flags bin or occupancy level remains
    unhit across the suite.
  confidence: high
- id: W3-BACK-TO-BACK-NOT-ACHIEVED
  severity: medium
  category: back_to_back_stimulus_limitation
  title: Driver idle wall prevents truly consecutive operations so the "back-to-back"
    scenario cannot exercise back-to-back traffic
  affected_tests:
  - FifoBackToBackTest
  evidence:
  - 'driver.py docstring (W-DRIVER-IDLE-WALL) and run_phase explicitly insert an idle
    cycle (_drive_idle()) between every item: ''the driver cannot hold a second item
    while the first is still being applied'' and ''an idle cycle (wr_en=0, rd_en=0)
    is driven before blocking for the next item, preserving CONTRACT 9.3''s declared
    idle wall.'''
  - driver.py run_phase (lines 126-144) drives the item, then calls _drive_idle()
    before awaiting the next item, so the DUT never sees non-idle enables on two strictly
    consecutive rising edges.
  - FifoBackToBackTest also crashes with the W1 ReadOnly error (tc/sequences.py:827),
    so even the idle-separated burst is never verified in this run.
  likely_cause: 'Inference: a deliberate one-item-at-a-time sequencer/driver protocol
    (documented as W-DRIVER-IDLE-WALL) guarantees an idle no-op between consecutive
    items, so the test named ''back-to-back operations'' cannot actually produce back-to-back
    stimulus and its verification claim is not satisfied.'
  investigation_targets:
  - tb/driver.py:110-144 (run_phase)
  - tb/sequences.py:806-874 (BackToBackSeq)
  recommended_action: Either restructure the driver to support consecutive non-idle
    items (e.g. version-safe try_next_item handling that returns the item, or driving
    back-to-back within a single get/finish cycle) so the back-to-back scenario drives
    truly consecutive operations, or rename/re-scope the scenario and its coverage
    claims to explicitly reflect the idle-wall protocol. Confirm the test completes
    after the W1 fix.
  confidence: medium
