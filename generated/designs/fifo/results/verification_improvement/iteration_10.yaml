weaknesses:
- id: W-CORNER-RUNTIME-READONLY-DRIVE
  severity: high
  category: test_runtime_timing
  title: FifoCornerTest crashes driving rst_n while still in cocotb ReadOnly phase
  affected_tests:
  - FifoCornerTest
  evidence:
  - 'simulation_result.json FifoCornerTest: status=runtime_error, returncode=2, clean_exit=false;
    log ends at 1860.00ns with ''RuntimeError: Attempting settings a value during
    the ReadOnly phase.'''
  - Traceback shows the failure in tb/sequences.py:112 (self.dut.rst_n.setimmediatevalue(0)
    inside _assert_reset) called from tb/sequences.py:770 (ResetAtFullSeq.body), i.e.
    immediately after tb/sequences.py:767 '_check_outputs(full=1, empty=0, count=4)'
  - tb/sequences.py _check_outputs() awaits ReadOnly() (line 199) and returns leaving
    the caller in the read-only region; _assert_reset() (line 110-120) drives rst_n
    synchronously before any time-advancing trigger.
  - FifoCornerTest is an aggregate of the 10 plan corner-case sequences (CORNER_SEQUENCES);
    the crash aborts the loop so ResetAtFullSeq, ResetMidStreamSeq and DoutRetentionSeq
    never execute and the test's report/coverage phase never runs (tx coverage file
    fifo_coverage_FifoCornerTest.yml on disk is stale at 10:11:31 vs 10:51 for all
    other tests).
  likely_cause: 'Inference: sequence code that performs an inline check (_check_outputs)
    followed by a synchronous DUT drive (_assert_reset) in the same coroutine violates
    cocotb''s write-region rule; setimmediatevalue during ReadOnly is rejected. ResetAtFullSeq
    is the only sequence with this exact check-then-assert-reset pattern, so only
    the corner aggregate hits it.'
  investigation_targets:
  - tb/sequences.py: _check_outputs (line 177-208), _assert_reset (line 110-120),
      ResetAtFullSeq (line 744-783)
  - tb/test.py: FifoCornerTest._run_scenario (line 312-320)
  recommended_action: 'Make every sequence-side drive leave the read-only region first:
    have _assert_reset/_drive begin with a FallingEdge/NextTimeStep (or Timer(0,''step''))
    before setimmediatevalue, and/or make _check_outputs advance out of ReadOnly before
    returning. Add a per-corner-sequence completion guard so a mid-loop crash cannot
    silently skip the remaining corner scenarios. Re-run FifoCornerTest to completion
    and confirm all 10 corner sequences execute and their coverage is exported.'
  confidence: high
- id: W-PARAM-SWEEP-UNEXERCISED
  severity: medium
  category: stimulus_parameters
  title: Planned DATA_WIDTH/DEPTH parameter matrix never exercised
  affected_tests:
  - FifoTC001Test
  - FifoTC002Test
  - FifoTC003Test
  - FifoTC004Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoTC010Test
  - FifoCornerTest
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - Every test in simulation_result.json logs 'UVM_TESTNAME=... DATA_WIDTH=8 DEPTH=4'
    and no make command contains a DATA_WIDTH or DEPTH override, so all 13 tests ran
    the single default configuration.
  - verification_plan.yaml parameters list test_values DATA_WIDTH [4,8,16] and DEPTH
    [2,4,8]; tb/test_top.py already reads DATA_WIDTH/DEPTH env vars, but the run never
    used them (coverage occupancy bins are built for DEPTH=4 only).
  likely_cause: 'Inference: the regression harness invokes the same Makefile target
    for every test without parameter permutation, so the parameterized test_values
    in the plan are never instantiated.'
  investigation_targets:
  - tb/test_top.py: _get_int_env / fifo_tb_top (DATA_WIDTH, DEPTH resolution)
  - tb/coverage.py: _count_level_bins (parameterized occupancy bins)
  recommended_action: Run the regression across the plan's parameter test_values (DATA_WIDTH
    in {4,8,16} x DEPTH in {2,4,8}) by exporting DATA_WIDTH/DEPTH per test invocation;
    verify the DEPTH-scaled sequences and count-level bins at each configuration.
    Add a manifest/verification-plan check that records the actually-elaborated parameters
    per test.
  confidence: high
- id: W-RANDOMIZED-SEED-UNREPRODUCIBLE
  severity: low
  category: reproducibility
  title: Randomized test's 'deterministic default' seed is process-salted, not reproducible
  affected_tests:
  - FifoRandomizedTest
  evidence:
  - tb/sequences.py FifoRandomizedSeq.body uses seed = hash(self.get_name()) & 0x7FFFFFFF
    when no seed/RANDOM_SEED is given, and the docstring claims 'the same configuration
    always replays the identical stimulus stream'.
  - Python str hash is randomized per process (PYTHONHASHSEED) unless the interpreter
    pins it; each test runs in its own sim process (per-test COCOTB_RESULTS_FILE),
    so the default stimulus stream differs between runs without an explicit RANDOM_SEED.
    This run logged 'FifoRandomizedTest used RNG seed 893152642 (replay with RANDOM_SEED=893152642)'.
  likely_cause: 'Inference: the default seed source (built-in hash of the object name)
    is not stable across interpreter processes, defeating the advertised reproducibility
    of the constrained-random stimulus and any later debug/replay workflow.'
  investigation_targets:
  - tb/sequences.py: FifoRandomizedSeq.seed resolution (lines ~975-998) and docstring
      claim
  - tb/test.py: FifoRandomizedTest.report_phase seed reporting
  recommended_action: Replace the hash-based default with a fixed literal seed (or
    a harness-pinned PYTHONHASHSEED / RANDOM_SEED export for every test process) so
    rerunning the same regression reproduces the identical random stimulus; keep logging
    the seed actually used.
  confidence: medium
- id: W-CROSS-TEST-COVERAGE-MERGE-NOOP
  severity: low
  category: coverage_reporting
  title: Regression-wide coverage merge never ran (each test merged only its own file)
  affected_tests:
  - FifoTC001Test
  - FifoTC002Test
  - FifoTC003Test
  - FifoTC004Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoTC010Test
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - Every test log in simulation_result.json reports 'FifoCoverage aggregate merge
    from 1 per-test file(s)' and 'excluded 12 stale per-test file(s) ... (mtime <
    run start time)'.
  - tb/coverage.py _merge_per_test_coverage filters files by mtime >= process start;
    in a sequential per-test regression without RUN_ID each process only sees its
    own freshly-written file, so the cross-test aggregate is never computed and the
    generic fifo_coverage.yml is overwritten by the last test (FifoRandomizedTest
    at 10:51:49).
  likely_cause: 'Inference: the mtime-based stale filter treats earlier tests'' coverage
    files of the same regression as stale because their mtime predates the current
    process start; RUN_ID scoping, which would fix this, is not set by the harness.'
  investigation_targets:
  - tb/coverage.py: FifoCoverage.report_phase / _merge_per_test_coverage (RUN_ID and
      mtime logic)
  recommended_action: Set RUN_ID across the whole regression via the make invocation
    (or compute the aggregate merge in a dedicated post-run step over the explicit
    per-test file list) so the regression-wide coverage report reflects all tests
    instead of one test's snapshot.
  confidence: high
- id: W-DATA-COV-DROPPED-WRITE-INFLATION
  severity: low
  category: coverage_meaningfulness
  title: data_max write-data bin credited to a dropped (ignored) write in TC006
  affected_tests:
  - FifoTC006Test
  evidence:
  - 'FifoTC006Test log: fifo_data_cg.write_data_bins 1/2 bins hit (50.0%) while read_data_bins
    0/2 bins hit; the only boundary din in TC006 is 0xFF driven on the simultaneous
    read/write cycle at full, where the write is dropped by design (verification_plan
    DIS-2), so data_max on the write bus is recorded without any max value ever being
    stored or read back.'
  - tb/coverage.py _sample_data samples din whenever wr_en==1 regardless of whether
    the write was accepted (full/empty gating is absent), documented as a metric-quality
    fix but still crediting ignored-write cycles.
  likely_cause: 'Inference: the data covergroup gates only on wr_en/rd_en activity,
    not on acceptance; a write-while-full cycle therefore counts as a data-path boundary-data
    sample even though the FIFO never stored the value.'
  investigation_targets:
  - tb/coverage.py: _sample_data gating (lines ~296-309) and fifo_data_cg definition
  recommended_action: Gate write_data_bins/read_data_bins on accepted operations (e.g.
    use the pre-edge full/empty flags or the scoreboard's acceptance model) so coverage
    reflects values actually stored/read, or split the bins into 'driven' vs 'accepted'
    to avoid inflating boundary-data confidence. Re-export the data coverage for TC006
    afterward.
  confidence: medium
