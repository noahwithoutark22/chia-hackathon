weaknesses:
- id: W-CHECK-TIMING-NOT-READONLY
  severity: medium
  category: check_timing
  title: Sequence inline checks read DUT pins at RisingEdge, not ReadOnly
  affected_tests:
  - FifoTC001Test
  - FifoTC002Test
  - FifoTC003Test
  - FifoTC004Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoTC010Test
  - FifoCornerTest
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - sequences.py _check_outputs (line 166) calls _read_signal which reads DUT pins
    via int(getattr(self.dut, pin).value) without first awaiting ReadOnly.
  - monitor.py run_phase (lines 120-127) correctly uses await RisingEdge then await
    ReadOnly before _sample(), ensuring all nonblocking assignments and combinational
    re-derivation have settled.
  - 'The discrepancy means sequence inline checks and monitor samples use different
    sampling regions: checks at the RisingEdge trigger (pre-settle), samples at ReadOnly
    (post-settle).'
  likely_cause: 'Inference: the sequence checking primitives were written to read
    DUT pins directly for simplicity, without synchronizing to the ReadOnly region.
    This works today because all sequence checks happen on idle cycles (after the
    driver''s mandatory idle wall), where no nonblocking assignment updates dout/count
    and full/empty combinational outputs are unchanged between RisingEdge and ReadOnly.
    The check timing is correct by accident of the driver idle-wall, not by design.'
  investigation_targets:
  - sequences.py _check_outputs method (line 165-180)
  - sequences.py _read_signal method (line 157-163)
  - driver.py run_phase idle wall (line 127)
  recommended_action: Change _check_outputs (or _read_signal) to await ReadOnly()
    before reading DUT pins, matching the monitor's sampling convention. Alternatively,
    document and enforce the invariant that _check_outputs may only be called on idle
    cycles, and add an assertion that wr_en=0 and rd_en=0 at check time.
  confidence: high
- id: W-DRIVER-IDLE-WALL
  severity: low
  category: temporal_coverage
  title: Driver inserts mandatory idle cycle between every consecutive driven item,
    preventing true back-to-back consecutive-cycle stimulus
  affected_tests:
  - FifoBackToBackTest
  - FifoRandomizedTest
  - FifoCornerTest
  evidence:
  - driver.py run_phase (line 127) calls self._drive_idle() immediately after self.seq_item_port.item_done(),
    driving wr_en=0, rd_en=0, din=0 before blocking on the next get_next_item.
  - FifoTC002Test log shows 18 items checked for 3 accepted writes and 3 accepted
    reads = 6 meaningful operations, implying at least 12 idle/no-op cycles were monitored.
  - FifoBackToBackTest log shows 49 items checked for 11 accepted writes and 11 accepted
    reads = 22 meaningful operations, implying at least 27 idle cycles.
  - FifoRandomizedTest log shows 497 items checked for 112 accepted writes and 102
    accepted reads = 214 meaningful operations, implying at least 283 idle cycles.
  likely_cause: 'Inference: the driver idle wall is an explicit design choice documented
    as CONTRACT section 9.3, described as a declared no-op for FIFO semantics. Each
    item is driven for one full DUT cycle, and the idle cycle is an unavoidable consequence
    of the blocking get_next_item/item_done sequencer API. The idle cycle means the
    DUT never sees non-idle inputs on two consecutive rising edges.'
  investigation_targets:
  - driver.py run_phase (lines 109-127)
  recommended_action: For a synchronous FIFO this is low risk since each cycle is
    independent. However, to strengthen temporal coverage, consider a driver variant
    that drives items on consecutive rising edges without the idle wall (using try_next_item
    or pre-fetching the next item). Document that the current driver tests one-operation-per-cycle
    with guaranteed idle gaps, not true back-to-back consecutive operations.
  confidence: high
- id: W-COVERAGE-MERGE-STALE
  severity: low
  category: coverage_infrastructure
  title: Cross-test coverage merge depends on filesystem state and may include stale
    per-test YAML files from prior runs
  affected_tests:
  - FifoRandomizedTest
  evidence:
  - coverage.py _merge_per_test_coverage (lines 438-577) reads all fifo_coverage_*.yml
    files from the current directory and filters by mtime >= self._run_start_time.
  - Each test runs as a separate Verilator process with the same SIM_BUILD directory,
    so per-test YAML files accumulate on disk.
  - The aggregate fifo_coverage.yml is overwritten by each test process, so only the
    last test's raw coverage is in that file. The merge function computes an aggregate,
    but its correctness depends on all per-test files being present and fresh.
  likely_cause: 'Inference: the merge was designed for a sequential single-process
    regression where all tests share a filesystem. In the current multi-process setup,
    each test''s report_phase reads files from prior tests that happen to be in the
    same directory. The mtime-based stale filter helps but cannot distinguish files
    from the current regression run versus a prior manual run if the time gap is small.'
  investigation_targets:
  - coverage.py _merge_per_test_coverage (lines 438-577)
  - coverage.py report_phase (lines 356-437)
  recommended_action: Add a run-specific marker (e.g., a unique run ID in the YAML
    filename or a top-level metadata field) so the merge can distinguish files from
    the current regression from stale files of prior runs. Alternatively, produce
    the aggregate merge in a dedicated post-regression step rather than in each test's
    report_phase.
  confidence: medium
- id: W-TC006-SEMANTIC-MISALIGNMENT
  severity: low
  category: spec_alignment
  title: TC006 (simultaneous read-write at full) test description says write is dropped
    but the spec rule about simultaneous operations does not apply at full
  affected_tests:
  - FifoTC006Test
  evidence:
  - 'verification_plan.yaml TC006 description (line 700): ''At full occupancy, a simultaneous
    read/write cycle: the write is dropped, the read is accepted, occupancy decreases.'''
  - 'specification.md (line 28): ''When both read and write are accepted in the same
    cycle, both operations occur and the occupancy remains unchanged.'' This rule
    applies only when BOTH are accepted, which does not happen at full (write is not
    accepted because full=1).'
  - 'reference_model.py step function: write_accepted = bool(wr_en and not full) returns
    False at full, so the write is correctly not accepted.'
  - The test correctly verifies the behavior (write dropped, read accepted, count
    decreases), but the plan description could be misread as contradicting the spec's
    simultaneous-operation rule.
  likely_cause: 'Inference: the plan description accurately describes the DUT behavior
    but uses the phrase ''simultaneous read/write cycle'' which could be confused
    with the spec''s ''both read and write are accepted'' clause. The key distinction
    is that at full, the write is NOT accepted, so the spec''s simultaneous-acceptance
    rule does not apply. DIS-2 in the plan correctly notes this subtlety.'
  investigation_targets:
  - verification_plan.yaml TC006 description (line 699-701)
  - scoreboard.py _advance_and_check acceptance logic (lines 161-167)
  recommended_action: Clarify the TC006 description to explicitly state that the write
    is not accepted (because full=1), so only the read is accepted, and the spec's
    simultaneous-acceptance rule does not apply. This prevents future misinterpretation
    by maintainers or automated tools.
  confidence: medium
