weaknesses:
- id: HW-SINGLE-ELABORATION
  severity: high
  category: false_confidence
  title: All tests run under a single elaboration (DATA_WIDTH=4, SECDED=0); inapplicable
    scenarios silently "pass" without exercising the DUT
  affected_tests:
  - HammingTC3Test
  - HammingTC5Test
  - HammingTC7Test
  evidence:
  - 'None of the 10 test command arrays in simulation_result.json sets DATA_WIDTH
    or SECDED, and every scoreboard build/config line in the logs shows (DATA_WIDTH=4,
    SECDED=0), e.g. "HammingScoreboard config (DATA_WIDTH=4, SECDED=0): 1000 checked,
    1000 passed" for the randomized test.'
  - test.py report_phase logs "TEST SKIPPED ... inapplicable to this elaboration (DATA_WIDTH=4,
    SECDED=0); passing without stimulus" for an inapplicable test; TC3 (SECDED=1 example),
    TC5 (DATA_WIDTH=8 sweep) and TC7 (widths 1/11/16) return False from elaboration_applies
    exactly under this elaboration.
  - Current-run coverage exports hamming_encoder_coverage_HammingTC3Test.yml, hamming_encoder_coverage_HammingTC5Test.yml
    and hamming_encoder_coverage_HammingTC7Test.yml each record 0/36 bins (cover_percentage
    0.0), and the TC3/TC5/TC7 monitor lines only ever reach "observed and published"
    with no scoreboard "items checked" line.
  - All 10 tests still report status "pass", so tests_passed=10 counts three no-stimulus
    runs as full passes.
  likely_cause: The regression runner selects UVM_TESTNAME per test without setting
    the DATA_WIDTH/SECDED elaboration env-var overrides that test_top.py supports;
    the deliberate log-and-skip (adaptive-skip) design converts every inapplicable
    scenario into a pass instead of a not-run result.
  investigation_targets:
  - tb/test.py (HammingTestBase.report_phase and elaboration_applies gates)
  - tb/test_top.py (DATA_WIDTH/SECDED env-var handling)
  - tb/sequences.py (_targets log-and-skip guard)
  recommended_action: Drive a real (DATA_WIDTH x SECDED) regression matrix so each
    directed scenario runs under an applicable elaboration, and make an inapplicable
    test fail or be explicitly reported as not_run (never a pass) so the summary cannot
    hide unexercised scenarios.
  confidence: high
- id: HW-SECDED-WIDTH-GAP
  severity: high
  category: coverage_gap
  title: SECDED=1 behavior and non-default DATA_WIDTH elaborations (1/8/11/16) are
    never exercised in this regression
  affected_tests:
  - HammingTC3Test
  - HammingTC5Test
  - HammingTC7Test
  - HammingCornerTest
  - HammingRandomizedTest
  evidence:
  - In every per-test coverage export (e.g. hamming_encoder_coverage_HammingRandomizedTest.yml),
    secded_cov bin secded_on = 0, width_cov bins width_8/width_11/width_16 = 0, and
    every (... , secded_on) cross bin hit count is 0.
  - "The randomized test checked 1000 vectors but only under \"HammingScoreboard config\
    \ (DATA_WIDTH=4, SECDED=0)\"; the plan's randomized injection \"configuration_toggle\"\
    \ (switch DATA_WIDTH/SECDED between vector blocks) has no implementation in sequences.py\
    \ \u2014 HammingRandomizedSequence only handles the active elaboration."
  - The SECDED-only corner sequences (SECDEDOrderingShiftSeq, SECDEDCodewordEvenWeightSeq)
    and the width-gated corners (MinimumDataWidthSeq, ParityBitCountTransitionSeq)
    log-and-skip under (4,0), so the SECDED bit-order shift and overall-even-parity
    invariants were never checked against the DUT.
  likely_cause: The single-elaboration-per-simulation design combined with a runner
    that only ever elaborates the default (DATA_WIDTH=4, SECDED=0); the plan's per-1000-vector
    configuration toggle was never realized in the generated environment.
  investigation_targets:
  - tb/sequences.py (HammingRandomizedSequence, elaboration guard)
  - tb/test.py (test-to-elaboration assignment)
  - tb/coverage.py (secded_cov / width_cov bins)
  recommended_action: Add matrix runs for SECDED=1 and DATA_WIDTH in {1,8,11,16} (or
    implement the in-run configuration switch), and gate completion on the plan's
    width_x_secded crosses and secded_on bins actually being hit.
  confidence: high
- id: HW-COVERAGE-NOT-ENFORCED
  severity: medium
  category: coverage_metrics
  title: Functional coverage is reported but never enforced as a pass criterion, and
    the cross-test merge never accumulates across tests
  affected_tests:
  - HammingTC1Test
  - HammingTC2Test
  - HammingTC3Test
  - HammingTC4Test
  - HammingTC5Test
  - HammingTC6Test
  - HammingTC7Test
  - HammingTC8Test
  - HammingCornerTest
  - HammingRandomizedTest
  evidence:
  - test.py report_phase enforces only "zero scoreboard mismatches" and "at least
    one scored item"; the plan's randomized pass criterion "functional coverage goals
    in functional_coverage are met" is never evaluated anywhere in the TB.
  - 'Every test log reports "HammingCoverage merge: excluded 9 stale per-test file(s)"
    followed by "aggregate merge from 1 per-test file(s)": the mtime-based staleness
    filter drops every per-test YAML written by the other simulations in this sequential
    layout, so the promised regression-level aggregate is never computed.'
  - Best per-test result is 15/36 bins (41.67%, TC4/Corner/Randomized); no report
    in the run contains the union of coverage across all tests.
  likely_cause: Per-test coverage exports are merged in-process with an mtime freshness
    filter, which is wrong for a sequential multi-process run layout; coverage thresholds
    were never wired into pass/fail logic.
  investigation_targets:
  - tb/coverage.py (_merge_per_test_coverage and report_phase)
  - tb/test.py (report_phase pass criteria)
  recommended_action: Persist and aggregate coverage out-of-band (single post-regression
    merge keyed by test/run-ID, without per-run mtime filtering), print a true regression-level
    percentage, and enforce the plan's coverage goals as pass/fail or at least surface
    them next to each test verdict.
  confidence: high
- id: HW-LINT-NOT-GATED
  severity: low
  category: flow
  title: Verilator compile lint and Python deprecation warnings are neither reported
    nor treated as failures
  affected_tests:
  - HammingTC1Test
  - HammingTC2Test
  - HammingTC3Test
  - HammingTC4Test
  - HammingTC5Test
  - HammingTC6Test
  - HammingTC7Test
  - HammingTC8Test
  - HammingCornerTest
  - HammingRandomizedTest
  evidence:
  - Workspace build-log evidence (iteration report, TC1 log) shows Verilator emitting
    %Warning-WIDTHTRUNC for the code_out assembly during compilation while the same
    run still ends "PASS"; the warning is not captured in simulation_result.json counts
    and does not affect pass/fail.
  - Every test log begins with multiple DeprecationWarnings (Timer 'units' renamed,
    logic_array.binstr, task.kill) that are ignored, adding noise that obscures real
    warnings.
  likely_cause: The build tolerates all warnings (no lint-as-error equivalent) and
    the results collector does not parse warning lines; deprecated cocotb APIs were
    carried over into the generated TB.
  investigation_targets:
  - tb/env.py (task.kill deprecation)
  - tb/assertions.py and tb/dut_helper.py (Timer units / binstr deprecations)
  - Makefile / build wrapper (lint gating and warning collection)
  recommended_action: Collect and surface Verilator lint warnings in the results,
    treat WIDTHTRUNC-class warnings as reportable (ideally failing) findings, and
    migrate the deprecated cocotb APIs so genuine warnings are not buried.
  confidence: medium
