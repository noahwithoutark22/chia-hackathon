weaknesses:
- id: W01
  severity: critical
  category: vacuous_pass
  title: HammingTC3/TC5/TC7 pass with zero transactions checked (scenario never executed)
  affected_tests:
  - HammingTC3Test
  - HammingTC5Test
  - HammingTC7Test
  evidence:
  - 'simulation_result.json: HammingTC3Test/TC5Test/TC7Test status=''pass'' while
    logs report ''monitor: observed and published 0 transaction(s)'', ''HammingScoreboard
    report: 0 items checked, 0 passed, 0 mismatches'', ''HammingCoverage report: 0
    items sampled'', ''HammingCoverage test coverage: ... 0/36 bins hit (0.00%)''
    and ''TEST SKIPPED -> SCENARIO TC<id> NOT EXECUTED''.'
  - 'tb/hamming_encoder_execution_aggregate.yml: TC3/TC5/TC7 records show applicable=false,
    executed=false, items_checked=0 with skip_reason ''inapplicable to (DATA_WIDTH=4,
    SECDED=0)''; aggregates 7 executed / 3 skipped yet each per-test status is ''pass''.'
  - 'tb/test.py report_phase: an inapplicable elaboration ''log-and-skip (still passes)'';
    the execution/skip ledger is documented as ''reporting only: it never changes
    a pass/fail verdict''.'
  - All 10 make command lines in simulation_result.json pass no DATA_WIDTH/SECDED/-G
    override, so every test elaborated the default (DATA_WIDTH=4, SECDED=0).
  likely_cause: The adaptive-skip design (tb/test.py HammingTestBase.report_phase
    + tb/sequences.py _targets) intentionally passes any test whose scenario targets
    a non-active elaboration; the regression runner only ever launched the default
    (4,0) elaboration, so TC3 (SECDED=1), TC5 (DATA_WIDTH=8) and TC7 (DATA_WIDTH in
    {1,11,16}) turned into zero-effort passes rather than executed scenarios.
  investigation_targets:
  - tb/test.py: HammingTestBase.report_phase (skip verdict path)
  - tb/test.py: HammingTC3Test/HammingTC5Test/HammingTC7Test.elaboration_applies
  - tb/sequences.py: HammingScenarioBase._targets
  - tb/Makefile: regression invocation with no per-scenario elaboration matrix
  recommended_action: 'Make scenario non-execution a hard failure: if the regression
    did not run the scenario''s required (DATA_WIDTH, SECDED) elaboration, report_phase
    (or the runner) must FAIL/flag the test instead of passing, and the execution
    ledger must be read as a verdict input by the run gate. Add an explicit elaboration
    matrix (e.g. (4,0), (4,1), (8,0), (8,1), (1,x), (11,x), (16,x)) that proves every
    planned scenario executed at least one scored item somewhere in the regression.'
  confidence: high
