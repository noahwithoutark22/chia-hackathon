# FIFO cocotb+pyuvm testbench — generation manifest (integration stage).
#
# This manifest is the authoritative runtime contract for the generated
# environment.  The top module, RTL file, compiled sources, python test
# module, and the exact pyuvm test class names selectable via UVM_TESTNAME
# are all listed here.  The `scenarios` list maps each directed
# verification-plan scenario ID to the generated sequence and test classes.

top_module: fifo
top_file: benchmarks/fifo/fifo.sv

# Only the DUT RTL is passed to the simulator.  There is no generated
# SystemVerilog source (everything else is Python).
compile_files:
  - benchmarks/fifo/fifo.sv

# Exact runtime pyuvm uvM test class names (selectable via UVM_TESTNAME).
test_classes:
  - FifoTC001Test
  - FifoTC002Test
  - FifoTC003Test
  - FifoTC004Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoTC010Test
  - FifoCornerTest
  - FifoRandomizedTest

# Top-level Python cocotb test module (without .py).
python_test_module: test_top

# Authoritative mapping between the accepted verification plan
# (directed_test_scenarios) and the generated directed environment.
scenarios:
  - id: TC001
    name: reset_check
    sequence: ResetCheckSeq
    test: FifoTC001Test
  - id: TC002
    name: write_read_basic
    sequence: WriteReadBasicSeq
    test: FifoTC002Test
  - id: TC003
    name: write_until_full
    sequence: WriteUntilFullSeq
    test: FifoTC003Test
  - id: TC004
    name: read_until_empty
    sequence: ReadUntilEmptySeq
    test: FifoTC004Test
  - id: TC005
    name: simultaneous_read_write
    sequence: SimultaneousReadWriteSeq
    test: FifoTC005Test
  - id: TC006
    name: simultaneous_read_write_at_full
    sequence: SimultaneousReadWriteFullSeq
    test: FifoTC006Test
  - id: TC007
    name: simultaneous_read_write_at_empty
    sequence: SimultaneousReadWriteEmptySeq
    test: FifoTC007Test
  - id: TC008
    name: pointer_wraparound_ordering
    sequence: PointerWrapOrderingSeq
    test: FifoTC008Test
  - id: TC009
    name: reset_during_operation
    sequence: ResetDuringOpSeq
    test: FifoTC009Test
  - id: TC010
    name: data_boundary_roundtrip
    sequence: BoundaryRoundtripSeq
    test: FifoTC010Test
