version: '1.0'
verdict: generation_bug
root_cause:
  category: reset
  summary: check_count_update_consistency is not reset-aware; it samples rst_n but
    still performs a delta comparison while reset is asserted, causing spurious mismatches.
  evidence: Simulation results show assertion failures during reset when check_count_update_consistency
    compares against prev without accounting for reset. The scoreboard already handles
    reset by re-arming prev=None, but this check does not mirror that logic.
changes:
- file: tb/assertions.py
  action: modify
  reason: Make check_count_update_consistency reset-aware so it does not produce spurious
    mismatches during reset.
  instructions:
  - Sample rst_n inside check_count_update_consistency. When rst_n is deasserted (reset
    active), set prev=None and return without performing the delta comparison. On
    non-reset cycles, perform the comparison as before and update prev, mirroring
    the scoreboard's existing reset handling.
validation:
  tests:
  - FifoTC009Test
  - FifoCornerTest
  - FifoRandomizedTest
  requirements:
  - build succeeds
  - no UVM_ERROR or UVM_FATAL
  - no reference-model mismatch
