- id: W-COVERAGE-MODEL-50PCT-CAP
  severity: low
  category: coverage_model
  title: op_against_flags cross structurally capped at 50% (8 of 16 bins impossible)
  affected_tests:
  - FifoRandomizedTest
  - FifoBackToBackTest
  - All directed tests
  evidence:
  - Every test shows op_against_flags coverage at exactly 50% (8/16 bins hit)
  - 'The 8 unreachable bins are: 4 bins with full=1 AND empty=1 (physically impossible),
    plus 4 bins where the operation changes the flag on the same edge (wr_active+not_full+is_empty,
    rd_active+is_full+not_empty, wr_active+rd_active+is_full+not_empty, wr_active+rd_active+not_full+is_empty)
    -- the post-edge flag sampling cannot capture the pre-edge state under which the
    operation was attempted'
  - The TB code in coverage.py (lines 186-220) correctly documents this structural
    limitation and provides a reachable-only metric
  - All 8 reachable bins ARE hit by FifoRandomizedTest (100% reachable coverage)
  likely_cause: 'Inferred: The coverage model samples full/empty flags POST-edge,
    but these flags change as a direct result of the operation on the same edge. A
    write-when-empty clears empty on the post-edge sample; a read-when-full clears
    full on the post-edge sample. This is a fundamental limitation of post-edge flag
    sampling for operation-triggered flag transitions.'
  investigation_targets:
  - tb/coverage.py (op_against_flags CoverCross, lines 185-228)
  recommended_action: The code already documents this limitation (W-COV-IMPOSSIBLE-BINS)
    and provides a reachable-only metric. No action required for correctness. However,
    if pre-edge flag sampling is desired for deeper verification, a separate coverpoint
    could sample full/empty one cycle earlier (e.g., from a delayed transaction or
    a dedicated pre-edge sampler) to capture the state under which operations are
    attempted. This is optional since the scoreboard already checks these scenarios.
  confidence: high
