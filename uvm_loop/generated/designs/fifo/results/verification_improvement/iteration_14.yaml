weaknesses:
- id: W-CORNER-TEST-CRASH
  severity: critical
  category: test_infrastructure
  title: FifoCornerTest crashes with RuntimeError, prevents all corner-case scenarios
    from completing
  affected_tests:
  - FifoCornerTest
  evidence:
  - FifoCornerTest status=runtime_error, returncode=2, clean_exit=false
  - 'RuntimeError: Attempting settings a value during the ReadOnly phase at sequences.py
    line 112 (_assert_reset), called from sequences.py line 793 (ResetAtFullSeq.body)'
  - Crash occurs at 2080.00ns during the 9th of 10 corner-case sequences (ResetAtFullSeq),
    meaning the first 8 sequences ran but the remaining 2 never executed
  - FifoCornerTest coverage_yml shows data_max_out=0 on read_data_bins, confirming
    data path coverage was not fully sampled before the crash
  likely_cause: 'Inferred from traceback: _assert_reset() calls dut.rst_n.setimmediatevalue(0)
    synchronously, which cocotb rejects when the scheduler is in the ReadOnly phase.
    The crash occurs at the start of ResetAtFullSeq.body(), immediately after the
    previous sequence (ResetMidStreamSeq) completed. The preceding _check_outputs()
    awaits ReadOnly(), and when the sequence completes and the next sequence begins,
    the cocotb scheduler has not fully transitioned out of the ReadOnly phase before
    the new sequence''s synchronous setimmediatevalue call executes.'
  investigation_targets:
  - tb/sequences.py (_assert_reset method, lines 110-120)
  - tb/sequences.py (ResetAtFullSeq.body, lines 782-809)
  - tb/test.py (FifoCornerTest._run_scenario, lines 312-320)
  recommended_action: 'Fix _assert_reset() to always drive rst_n from a phase-safe
    context. Two options: (a) replace setimmediatevalue(0) with an await-based drive
    that yields to a non-ReadOnly phase (e.g., await RisingEdge then set value, or
    await Timer(0) before setting), or (b) in FifoCornerTest._run_scenario(), add
    an explicit yield-to-scheduler (e.g., await cocotb.triggers.ReadOnly(); await
    cocotb.triggers.ReadWrite()) between sequences to guarantee the ReadOnly phase
    has fully completed before the next sequence starts.'
  confidence: high
- id: W-RESET-AT-FULL-UNTESTED
  severity: high
  category: scenario_coverage
  title: ResetAtFullSeq never executes, leaving reset-at-full-occupancy recovery unverified
  affected_tests:
  - FifoCornerTest
  evidence:
  - ResetAtFullSeq is the 9th corner sequence (index 8 in CORNER_SEQUENCES) and is
    where the FifoCornerTest crash occurs
  - The sequence fills FIFO to full occupancy, asserts asynchronous reset, and verifies
    clean recovery -- this specific scenario is unique and not duplicated by any directed
    test
  - TC009 (ResetDuringOpSeq) writes only 2 entries before reset, never reaching full
    occupancy; it does not exercise the stuck-full reset recovery path
  likely_cause: 'Inferred: ResetAtFullSeq is the sequence during which the crash (W-CORNER-TEST-CRASH)
    occurs, so it never runs. No directed test exercises reset at full occupancy.'
  investigation_targets:
  - tb/sequences.py (ResetAtFullSeq, lines 770-809)
  recommended_action: After fixing W-CORNER-TEST-CRASH, verify that ResetAtFullSeq
    passes. Additionally, consider extracting ResetAtFullSeq as a standalone directed
    test (e.g., FifoTC011Test) so it runs independently and is not lost if the aggregate
    corner test fails.
  confidence: high
