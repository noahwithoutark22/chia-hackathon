  - 'fifo_data_cg.read_data_bins: data_zero_out=12, data_max_out=0 (only 50% cover)'
  - 'fifo_data_cg.boundary_data_concurrent: only data_zero_out hit, 25% cover'
  - 'Overall fifo_data_cg: 37.5%'
  likely_cause: 'Inferred: BackToBackSeq uses hardcoded hex values (0xA0+i, 0xB0,
    0xB1, 0xC0+i, 0xD0, 0xD1) that for DATA_WIDTH=8 (max_data=0xFF) never produce
    the maximum value 0xFF. The sequence was designed for structural testing of consecutive
    operations, not data boundary testing.'
  investigation_targets:
  - tb/sequences.py (BackToBackSeq, lines 852-918)
  recommended_action: The data boundary coverage is fully achieved by FifoRandomizedTest
    (100% on all data bins) and by TC010 (BoundaryRoundtripSeq). No action required
    since the regression as a whole achieves full data coverage. If BackToBackTest
    data coverage is specifically desired, include at least one max_data value in
    the stimulus values.
  confidence: high
