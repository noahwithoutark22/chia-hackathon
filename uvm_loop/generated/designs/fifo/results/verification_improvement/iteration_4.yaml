    with hundreds of bin hits (e.g., wr_active=132, rd_active=117, empty_level=70)
  - All 13 tests crash with runtime_error before reaching report_phase, so coverage
    files cannot be exported from this simulation
  - Coverage export only happens in FifoCoverage.report_phase() (coverage.py lines
    409-433), which never executes when the test crashes with RuntimeError
  - The W-STALE-COVERAGE-MERGE mechanism in coverage.py (lines 486-505) is designed
