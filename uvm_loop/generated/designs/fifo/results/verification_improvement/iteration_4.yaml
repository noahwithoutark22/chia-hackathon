weaknesses:
- id: W-READONLY-PHASE-COLLISION
  severity: critical
  category: tb_infrastructure_timing
  title: All tests crash with cocotb ReadOnly phase collision in sequence inline checks
  affected_tests:
  - FifoTC001Test
  - FifoTC002Test
  - FifoTC003Test
  - FifoTC004Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoTC010Test
  - FifoCornerTest
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - Every one of 13 tests exits with status "runtime_error" and returncode 2 (clean_exit=false)
  - All logs show identical RuntimeError: 'Attempted illegal transition: awaiting
      ReadOnly in ReadOnly phase'
  - The crash traceback always routes through sequences.py line 168 (_read_signal
    -> await ReadOnly) called from line 186 (_check_outputs) called from the test-specific
    body()
  - TC001 crashes at 70ns (after _reset_init's final _wait(1) lands at RisingEdge/ReadOnly,
    then _check_outputs calls _read_signal -> await ReadOnly which fails)
  - TC002 crashes at 140ns (after _fill + _wait(1), same ReadOnly collision)
  - "TC007 crashes at 100ns, TC006 at 180ns, FifoRandomizedTest at 70ns (initial reset\
    \ check) \u2014 all the same root cause"
  likely_cause: '[INFERENCE] _read_signal() (sequences.py:157-174) unconditionally
    calls await ReadOnly() to ensure post-edge settled values. However, _check_outputs()
    is frequently called after _wait(1) which uses ClockCycles(clk, 1). ClockCycles
    completes at a RisingEdge, which in cocotb 2.x places the coroutine already in
    the ReadOnly phase. Calling await ReadOnly() again from within ReadOnly raises
    RuntimeError. The _read_signal method lacks a guard or alternative scheduling
    path for when the coroutine is already in ReadOnly.'
  investigation_targets:
  - tb/sequences.py (_read_signal method, lines 157-174)
  - tb/sequences.py (_check_outputs method, lines 176-193)
  - tb/sequences.py (_wait method, lines 101-104)
  recommended_action: Remove the unconditional await ReadOnly() from _read_signal()
    and instead read DUT pin values directly (the method is always called after either
    a FallingEdge from the driver or a RisingEdge from ClockCycles, both of which
    have settled post-edge values). Alternatively, guard the ReadOnly with a try/except
    or use cocotb's ReadWrite trigger to exit ReadOnly before re-entering it. The
    current _wait(1) + _check_outputs pattern is the primary trigger; ensuring _read_signal
    works in any cocotb scheduling phase resolves all 13 test crashes.
  confidence: high
- id: W-ZERO-FUNCTIONAL-VERIFICATION
  severity: critical
  category: verification_coverage_gap
  title: "Zero functional verification performed \u2014 all test results are meaningless"
  affected_tests:
  - FifoTC001Test
  - FifoTC002Test
  - FifoTC003Test
  - FifoTC004Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoTC010Test
  - FifoCornerTest
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - "All 13 tests report uvm_errors=0, uvm_fatals=0, uvm_warnings=0, scoreboard_mismatches=0,\
    \ assertion_failures=0 \u2014 but this is because the tests crashed before any\
    \ scoreboard comparison or assertion check could execute"
  - The scoreboard's run_phase never processes any monitor transaction (the crash
    propagates before the analysis_fifo receives items)
  - The assertions module's checkers are launched via cocotb.start_soon but the test
    crash terminates the simulation before they can detect anything
  - FifoRandomizedTest crashes at 70ns during the initial reset check, meaning zero
    of the planned 240 random cycles with reset injections were executed
  - The simulation_result.json top-level status is "functional_failure" confirming
    no tests completed
  likely_cause: "[INFERENCE] A direct consequence of W-READONLY-PHASE-COLLISION: since\
    \ every test crashes during the sequence body() before completing, no scoreboard\
    \ comparisons, no assertion checks, and no coverage collection can occur. The\
    \ 0 mismatch counts are false confidence \u2014 they reflect infrastructure failure,\
    \ not correct DUT behavior."
  investigation_targets:
  - simulation_result.json (test status fields)
  - tb/test.py (report_phase pass/fail logic)
  recommended_action: Fix W-READONLY-PHASE-COLLISION first. After fixing, verify that
    each test's report_phase reports non-zero items_checked, non-zero accepted_writes
    and accepted_reads (for data-path tests), confirming genuine functional stimulus
    was exercised.
  confidence: high
