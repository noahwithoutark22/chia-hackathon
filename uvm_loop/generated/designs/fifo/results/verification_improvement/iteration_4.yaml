  title: Randomized test crashes before generating any random traffic or reset injections
  affected_tests:
  - FifoRandomizedTest
  evidence:
  - FifoRandomizedTest log shows crash at 70ns, during the initial _check_outputs
    call in the reset prologue (after _assert_reset, _wait(2), _release_reset, _wait(1),
    _check_outputs)
  - The random traffic loop (sequences.py lines 985-1010, 240 cycles of wr_en/rd_en/din
    randomization) never begins executing
  - The periodic reset injection (every 60 cycles, sequences.py lines 986-991) never
    occurs
  - The mid-test random reset injection (at a random cycle between num_cycles/4 and
    3*num_cycles/4, sequences.py lines 992-995) never occurs
  - The verification_plan.yaml's randomized_testing_strategy specifies periodic and
    random reset injections that are completely unexercised
  likely_cause: '[INFERENCE] The randomized test''s FifoRandomizedSeq.body() calls
    _check_outputs() as part of its reset prologue (line 979), which triggers W-READONLY-PHASE-COLLISION
    before any random traffic is generated. Even if fixed, the randomized sequence''s
    _inject_reset() method (line 934-941) also ends with _check_outputs after _wait(1),
    so periodic and mid-test reset injections would also crash with the same bug.'
  investigation_targets:
  - tb/sequences.py (FifoRandomizedSeq.body, lines 943-1010)
  - tb/sequences.py (FifoRandomizedSeq._inject_reset, lines 934-941)
  recommended_action: After fixing W-READONLY-PHASE-COLLISION, verify that FifoRandomizedTest
    completes all 240 random cycles and executes both periodic and mid-test reset
