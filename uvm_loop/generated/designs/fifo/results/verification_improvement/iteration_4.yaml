    is never reached
  likely_cause: '[INFERENCE] The fifo_coverage*.yml and fifo_coverage*.xml files in
    tb/ were written by a prior (possibly different) simulation run. They do not reflect
    the results of the current simulation where all tests crashed at runtime. A reader
    of these files would incorrectly conclude that functional coverage was collected
    and partially/fully achieved.'
  investigation_targets:
  - tb/fifo_coverage.yml
  - tb/fifo_coverage_*.yml
  - tb/coverage.py (report_phase export logic, lines 356-433)
  recommended_action: Delete or ignore all pre-existing coverage YAML/XML files before
    running the simulation. After fixing the ReadOnly crash, re-run the simulation
    and collect fresh coverage data. Add a file-creation-time check or clear the coverage
    directory at the start of each test run.
  confidence: high
- id: W-RANDOMIZED-TEST-NO-TRAFFIC
