  evidence:
  - start_assertions() is called in test_top.py line 152, which launches seven checker
    coroutines via cocotb.start_soon
  - "However, the test crashes (RuntimeError propagates) before the checkers can meaningfully\
    \ verify anything \u2014 the crash terminates the simulation"
  - All seven checkers (check_reset_clean_state, check_no_overflow, check_no_underflow,
    check_occupancy_bounds, check_flags_mutually_exclusive, check_count_update_consistency,
    check_fifo_ordering) report assertion_failures=0 across all tests
  - The checkers internally use the correct RisingEdge + ReadOnly pattern (assertions.py
    lines 152-153, 192-193, etc.) so they would work correctly if the test didn't
    crash first, but they never get the chance
  likely_cause: "[INFERENCE] The assertion coroutines are launched before the test\
    \ crash, but the crash propagates through cocotb's task management and terminates\
    \ all tasks. The zero assertion failures are not evidence of correct DUT behavior\
    \ \u2014 they reflect the test infrastructure failure from W-READONLY-PHASE-COLLISION."
  investigation_targets:
  - tb/assertions.py (all checker coroutines)
  - tb/test_top.py (start_assertions call, line 152)
  recommended_action: Fix W-READONLY-PHASE-COLLISION so tests complete. After fixing,
    confirm that the always-on assertions actually fire on multiple cycles by checking
    that the assertion checker coroutines survive through the full test duration.
  confidence: high
- id: W-SCOREBOARD-NEVER-COMPARES
  severity: high
  category: checking_ineffectiveness
  title: Scoreboard predictor-comparator never processes any monitor transaction
  affected_tests:
  - FifoTC001Test
  - FifoTC002Test
  - FifoTC003Test
  - FifoTC004Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoTC010Test
  - FifoCornerTest
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - The scoreboard's run_phase (scoreboard.py lines 118-126) awaits analysis_fifo.get()
    which blocks until the monitor writes a transaction via the analysis port
  - The monitor IS running (monitor.py:113-132, started during env connect_phase)
    and would capture post-edge values, but the test's sequence crashes before the
    monitor can accumulate enough transactions for the scoreboard to process
  - All test results show scoreboard_mismatches=0 and items_checked=0 (implicit from
    the 0/0/0 counts pattern), confirming zero comparisons occurred
  - The report_phase pass criteria in test.py (lines 122-167) would catch a crash-only
    scenario via the items_checked==0 guard, but this only matters if report_phase
    actually runs
  likely_cause: '[INFERENCE] The scoreboard''s analysis_fifo receives monitor transactions,
    but the sequence crash from W-READONLY-PHASE-COLLISION propagates as a cocotb
    test failure before the scoreboard can dequeue and compare any items. The zero
    mismatches are meaningless.'
  investigation_targets:
  - tb/scoreboard.py (run_phase, _advance_and_check, _check methods)
  - tb/test.py (report_phase pass criteria)
  recommended_action: After fixing W-READONLY-PHASE-COLLISION, verify that scoreboard
    report_phase shows items_checked > 0, accepted_writes > 0, accepted_reads > 0,
    and mismatch_count == 0 for data-path tests.
  confidence: high
