weaknesses:
- id: W-DRIVER-IDLE-WALL
  severity: medium
  category: driver_limitation
  title: Driver inserts mandatory idle cycle between every consecutive item
  affected_tests:
  - FifoBackToBackTest
  - FifoRandomizedTest
  - FifoTC002Test
  - FifoTC003Test
  - FifoTC004Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoTC010Test
  - FifoCornerTest
  evidence:
  - 'driver.py lines 109-127: after every item_done() the driver calls self._drive_idle()
    and then loops back to get_next_item(). There is always at least one rising edge
    where idle (wr_en=0, rd_en=0) is sampled between any two consecutive items regardless
    of how quickly the sequence provides the next item.'
  - sequences.py BackToBackSeq (line 801-876) documents this as W-NO-BACK-TO-BACK
    and states the driver inserts the CONTRACT 9.3 idle wall between items.
  - The test named FifoBackToBackTest (test.py line 326) is intended to exercise consecutive
    operations but the driver makes truly back-to-back stimulus impossible.
  likely_cause: The driver was designed with a conservative idle-cycle wall (CONTRACT
    9.3) between items to avoid a pyuvm try_next_item() crash (W-DRIVER-TRY-NEXT-CRASH
    fix). The idle cycle is driven after item_done() before blocking on the next get_next_item(),
    so even when the sequencer has the next item ready, one idle cycle always elapses.
  investigation_targets:
  - tb/driver.py
  - tb/sequences.py (BackToBackSeq)
  recommended_action: Restructure the driver loop so that when get_next_item() returns
    an item immediately (sequencer already has it queued), the driver drives the next
    item at the same falling edge as item_done() rather than inserting an idle cycle.
    Alternatively, add a driver mode flag (e.g. back_to_back=True) that skips the
    idle cycle and drives the next item at the same falling edge, then use this mode
    in the BackToBackSeq test.
  confidence: high
- id: W-SINGLE-PARAM-CONFIG
  severity: high
  category: parameter_coverage
  title: Only default parameter configuration (DATA_WIDTH=8, DEPTH=4) was simulated
  affected_tests:
