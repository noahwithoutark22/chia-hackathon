  evidence:
  - 'simulation_result.json: all 13 test command arrays show no DATA_WIDTH or DEPTH
    environment variable overrides. Every test ran with the default DATA_WIDTH=8,
    DEPTH=4 configuration.'
  - verification_plan.yaml specifies test_values for DATA_WIDTH (4, 8, 16) and DEPTH
    (2, 4, 8), totaling 9 parameter combinations, but only 1 combination was exercised.
  - tb/test_top.py lines 112-113 reads DATA_WIDTH and DEPTH from environment variables,
    confirming the TB is parameterized, but the simulation harness did not override
    these from the defaults.
  likely_cause: The simulation harness or regression runner did not sweep the planned
    parameter combinations. The TB code is correctly parameterized (sequences scale
    with DEPTH, data masks scale with DATA_WIDTH), but each parameter combination
    requires a separate simulation invocation with overridden environment variables.
  investigation_targets:
  - tb/test_top.py (parameter resolution from env vars)
  - simulation harness / regression runner configuration
  recommended_action: 'Run the full test suite for each planned parameter combination:
    DATA_WIDTH in {4, 8, 16} and DEPTH in {2, 4, 8}, passing DATA_WIDTH and DEPTH
    as environment variables to each make invocation. This will exercise 9 configurations
    total and verify that boundary-value and occupancy logic scales correctly.'
  confidence: high
- id: W-DEASSERT-RESET-TIMING
  severity: medium
  category: reset_timing
  title: Reset deassertion uses Timer-based settle rather than clock-edge alignment
  affected_tests:
  - FifoTC001Test
  - FifoTC009Test
  - FifoRandomizedTest
  evidence:
  - 'sequences.py lines 122-133 (_release_reset): deassertion is aligned to FallingEdge
    then followed by await Timer(1, unit=''ns''). The Timer settle is a fixed 1ns
    delay independent of the clock period, which may be insufficient for slow clock
    configurations or leave excessive margin for fast ones.'
  - 'simulation_result.json: all tests used CLK_HALF_PERIOD_NS=5 (10ns period), so
    the 1ns settle after FallingEdge gives approximately 4ns before the next RisingEdge.
    This is adequate for the default clock but would be proportionally tighter at
    faster clocks.'
  likely_cause: The reset deassertion timing was designed for the default 10ns clock
    period. Using a fixed Timer(1, unit='ns') rather than a clock-aligned settle means
    the setup margin scales inversely with clock frequency.
  investigation_targets:
  - tb/sequences.py (_release_reset method, lines 122-133)
  recommended_action: Replace the fixed Timer(1, unit='ns') in _release_reset with
    a settle that is proportional to the clock period (e.g. await Timer(clk_half_period_ns,
    unit='ns') or wait for an additional FallingEdge after deassertion). This ensures
    the reset recovery timing margin is consistent across all clock configurations.
  confidence: medium
- id: W-ASSERTION-MISSING-FULL-EMPTY-COUNT-INVARIANT
  severity: low
  category: assertion_gap
  title: No dedicated assertion checks full/empty flags against internal count
  affected_tests:
  - FifoTC001Test
  - FifoTC002Test
  - FifoTC003Test
  - FifoTC004Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoTC010Test
  - FifoCornerTest
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - 'assertions.py: check_flags_mutually_exclusive (line 275) verifies full and empty
    are never both 1, but no assertion checks full==(count==DEPTH) and empty==(count==0)
    on every cycle.'
  - 'assertions.py: check_count_update_consistency (line 294) checks count transitions
    but does not verify that full/empty are derived correctly from count.'
  - scoreboard.py lines 190-112 does check full/empty against the reference model
    queue length, which is equivalent. However, if the scoreboard itself had a logic
    error (e.g. comparing against the wrong state), both the scoreboard and the reference
    model in check_fifo_ordering would share the same bug.
  likely_cause: The assertion set covers mutual exclusion of full/empty and count-update
    consistency but omits the direct invariant that the combinational flags full and
    empty are derived from the internal count. The scoreboard provides this check,
    but it uses the same reference model logic as check_fifo_ordering, so a shared-model
    bug would not be caught by the assertion layer.
  investigation_targets:
  - tb/assertions.py (check_flags_mutually_exclusive, check_count_update_consistency)
  recommended_action: 'Add a new always-on assertion (e.g. check_flags_count_consistency)
    that on every non-reset post-edge cycle asserts: full == (dut.count == DEPTH)
    and empty == (dut.count == 0), when the internal count signal is reachable from
    the testbench handle. This closes the gap between the scoreboard''s reference-model-based
    check and a direct pin-level invariant check.'
  confidence: high
