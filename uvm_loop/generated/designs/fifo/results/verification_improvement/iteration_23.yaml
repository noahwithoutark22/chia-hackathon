weaknesses:
- id: W-PARAM-NO-SWEEP
  severity: high
  category: parameter-coverage
  title: 'Verification plan parameter sweep not executed -- only default DATA_WIDTH=8,
    DEPTH=4 tested across all 13 regression tests

    '
  affected_tests:
  - FifoTC001Test
  - FifoTC002Test
  - FifoTC003Test
  - FifoTC004Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoTC010Test
  - FifoCornerTest
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - file: verification_plan.yaml
    line_range: 6-21
    detail: 'The parameters section defines DATA_WIDTH with default 8 and test_values
      [4, 8, 16], and DEPTH with default 4 and test_values [2, 4, 8].  This is an
      explicit declaration to sweep all 9 combinations.

      '
  - file: simulation_result.json
    line_range: 1-658
    detail: 'All 13 test entries (FifoTC001Test through FifoRandomizedTest) show identical
      make commands without any DATA_WIDTH= or DEPTH= environment variable overrides.  The
      test_top.py defaults (DATA_WIDTH=8, DEPTH=4 at lines 55-56) apply universally.
      No test entry references any non-default parameter combination.

      '
  - file: tb/test_top.py
    line_range: 111-113
    detail: 'Lines 112-113 read DATA_WIDTH and DEPTH from environment variables with
      fallback to defaults, proving the testbench infrastructure is parameterized
      and ready for sweep execution without any TB code changes.

      '
  - file: tb/sequences.py
    detail: 'Sequences use self.depth and self.data_width (resolved from ConfigDB
      in build_phase) for parameter-dependent stimulus generation, confirming the
      stimulus layer scales correctly when non-default parameters are supplied.

      '
  - file: verification_plan.yaml
    detail: 'Width-dependent logic (bit-level operations, data masking, boundary value
      scaling) and depth-dependent logic (pointer wrapping, full/empty boundary conditions,
      occupancy bin thresholds) at non-default parameter values remain entirely unverified.  A
      bug that manifests only at DATA_WIDTH=4 (narrower data path, different max data
      value 0x0F vs 0xFF) or DEPTH=2 (tighter pointer constraints, faster fill/drain,
      collapsed occupancy bins) would not be caught.  The parameterized test infrastructure
      is ready -- only the regression wrapper lacks sweep iteration.

      '
  likely_cause: 'Inference: The regression Makefile or wrapper script invokes tests
    without setting DATA_WIDTH and DEPTH environment variables, causing all tests
    to fall through to the default configuration (DATA_WIDTH=8, DEPTH=4).  The parameterized
    test infrastructure is ready -- only the regression wrapper lacks sweep iteration.

    '
  investigation_targets:
  - tb/test_top.py
  - Makefile
  recommended_action: 'Add a regression wrapper script or Makefile target that iterates
    over all 9 parameter combinations from the verification plan (DATA_WIDTH in {4,
    8, 16} x DEPTH in {2, 4, 8}), invoking each test class with the corresponding
    DATA_WIDTH and DEPTH environment variables set before launching the simulation.  For
    each new parameter configuration, re-run coverage collection and confirm all reachable
    op_against_flags bins are hit.  Bin reachability is parameter-independent (the
    8 unreachable bins are structural impossibilities for any DEPTH >= 2), but the
    occupancy count bins change with DEPTH (e.g., at DEPTH=2 the mid_level and one_entry
    bins both map to count == 1 and are deduplicated by _count_level_bins in coverage.py).  Verify
    that TC010 (data_boundary_roundtrip) stimulus values scale correctly with DATA_WIDTH:
    the verification plan states that "under alternate DATA_WIDTH the extremal stimulus
    values scale to (1 << DATA_WIDTH) - 1", but this has not been confirmed in simulation.

    '
  confidence: high
- id: W-COV-REACHABILITY-UNCHECKED-PER-PARAM
  severity: medium
  category: coverage-completeness
  title: 'Reachable-only coverage metric computed only for default parameters; bin
    reachability at non-default DEPTH values not verified

    '
  affected_tests:
  - FifoTC001Test
  - FifoTC002Test
  - FifoTC003Test
  - FifoTC004Test
  - FifoTC005Test
  - FifoTC006Test
  - FifoTC007Test
  - FifoTC008Test
  - FifoTC009Test
  - FifoTC010Test
  - FifoCornerTest
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - file: tb/coverage.py
    line_range: 91-118
    detail: '_count_level_bins() deduplicates bins by value, so at DEPTH=2 the five
      spec-defined levels collapse to three distinct values (0, 1, 2).  The merge
      logic in report_phase counts unique bin names, not values, so the deduplication
      correctly prevents double-counting.  But this path was never exercised at DEPTH=2
      in the current regression.

      '
  - file: simulation_result.json
    detail: 'All 13 tests show occupancy bins at DEPTH=4 levels: empty_level, one_entry,
      mid_level, near_full_level, full_level -- five distinct bins.  No test shows
      the collapsed three-bin configuration expected at DEPTH=2.

      '
  - file: tb/coverage.py
    detail: 'The coverage.py module correctly implements a reachable-only metric for
      the op_against_flags cross (8 structurally reachable bins out of 16 total) and
      deduplicates occupancy count bins when DEPTH causes label collisions (e.g.,
      DEPTH=2: mid_level == one_entry == count 1).  However, this metric was only
      exercised at DEPTH=4.  At DEPTH=2, the fifo_occupancy_cg collapses to 3 distinct
      bins (empty_level=0, one_entry=1, full_level=2) instead of 5, and the reachable
      bin count changes.  Without running the parameter sweep, we cannot confirm that
      the coverage collection infrastructure correctly handles these collapsed configurations
      for every planned DEPTH value.

      '
  likely_cause: 'Inference: Coverage collection was only exercised at the default
    DEPTH=4 configuration, so the bin deduplication logic for non-default DEPTH values
    (e.g., DEPTH=2 where occupancy bins collapse from 5 to 3 distinct bins) has never
    been validated in simulation.

    '
  investigation_targets:
  - tb/coverage.py
  - simulation_result.json
  recommended_action: 'When executing the parameter sweep (W-PARAM-NO-SWEEP), verify
    that the coverage report for DEPTH=2 shows 3 occupancy bins (empty_level, one_entry,
    full_level) and that the reachable-only metric correctly reflects the reduced
    bin count.  Confirm that the _count_level_bins deduplication produces the correct
    label for the collapsed bin (currently "one_entry" wins over "mid_level" at count
    == 1).

    '
  confidence: medium
