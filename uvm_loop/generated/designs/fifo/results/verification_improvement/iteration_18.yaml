    in the truncated log)
  - "The verification_plan.yaml randomized_testing_strategy specifies 240 cycles per\
    \ seed with periodic resets (every 60 cycles, duration 2-3) and one random mid-test\
    \ reset (duration 1-4) \u2014 none of this was executed"
  - "The pass_criteria for randomized testing requires zero scoreboard mismatches\
    \ across all randomized runs including reset injections \u2014 this criterion\
    \ was never satisfied because the runs never happened"
  likely_cause: 'Inference: the randomized test infrastructure (multi-seed loop, sequence
    restart, or reset injection logic) has a bug that causes a crash. The directed
    tests each run a single sequence and complete successfully, so the crash is specific
    to the randomized test''s execution pattern.'
  investigation_targets:
  - "tb/sequences.py (FifoRandomizedSeq._inject_reset \u2014 the reset injection primitive)"
  - "tb/sequences.py (FifoRandomizedSeq.body \u2014 the main random traffic loop with\
    \ reset scheduling)"
  - "tb/test.py (FifoRandomizedTest \u2014 the multi-seed iteration with ClockCycles\
    \ drain between seeds)"
  recommended_action: After fixing the crash, verify that all 10 seed iterations complete
    with zero scoreboard mismatches. Consider reducing RANDOM_SEED_COUNT to 1 for
    initial debugging, then scale back to 10.
  confidence: high
- id: W-ASSERTION-CRASH-UNDIAGNOSTIC
  severity: medium
  category: observability
  title: Simulation framework does not propagate cocotb assertion-checker failures
    to the test counts
  affected_tests:
  - FifoRandomizedTest
  evidence:
  - simulation_result.json FifoRandomizedTest counts show assertion_failures=0 despite
    the test crashing with runtime_error
  - The always-on assertion checkers (assertions.py) are started with cocotb.start_soon
    before the UVM test; an AssertionError from any checker would propagate to the
    cocotb framework as a test failure (returncode 1), not as a UVM count
  - The returncode=2 (Python exception, not assertion failure) suggests the crash
    is infrastructure-level, but without the full log we cannot definitively rule
    out an assertion-checker crash that manifests as returncode 2 on this cocotb/simulator
    combination
  likely_cause: 'Inference: the cocotb test framework''s exit-code mapping may conflate
    different failure modes under returncode 2. The assertion_failures=0 count is
    a UVM-level counter that only tracks failures detected within the UVM test/report
    phases, not cocotb-level AssertionError from start_soon tasks.'
  investigation_targets:
  - "tb/assertions.py (all checker coroutines \u2014 whether any could raise during\
    \ the randomized test's execution)"
  - The full cocotb log (to distinguish between an infrastructure crash and an assertion
    checker failure)
  recommended_action: Add explicit logging at the start of each assertion checker's
    loop iteration (at debug level) so that the last processed cycle is visible in
    the log even after a crash. This aids post-mortem diagnosis.
  confidence: medium
- id: W-IDLE-WALL-LIMITS-THROUGHPUT-STRESS
  severity: low
  category: stimulus_gap
  title: Driver inserts an idle cycle between every consecutive stimulus item, preventing
    back-to-back non-idle operation testing
  affected_tests:
  - FifoBackToBackTest
  - FifoRandomizedTest
  evidence:
  - 'driver.py FifoDriver.run_phase: after item_done(), _drive_idle() is called before
    looping back to get_next_item(). The driver aligns to the next FallingEdge before
    driving the next item, guaranteeing at least one idle cycle (wr_en=0, rd_en=0)
    between consecutive non-idle cycles'
  - FifoBackToBackSeq sends consecutive _drive_item calls, but the driver's idle wall
    means the DUT never sees two consecutive rising edges with non-idle inputs
  - For a synchronous FIFO with combinational full/empty flags, consecutive non-idle
    cycles produce the same state transitions as idle-separated cycles (each cycle's
    behavior depends only on pre-edge state and current inputs), so this is a semantic
    gap only for a specific RTL implementation pattern, not for general FIFO correctness
  likely_cause: Design choice in driver.py to insert an idle no-op between items.
    The CONTRACT.md section 9.3 documents this as a deliberate 'wall' that is a declared
    no-op for FIFO semantics.
  investigation_targets:
  - "tb/driver.py (FifoDriver.run_phase \u2014 the idle cycle insertion after item_done)"
  recommended_action: For FIFO verification this is acceptable since each cycle's
    behavior is state-dependent, not history-dependent. If later testing with non-standard
    FIFO implementations (e.g., show-ahead mode) is needed, modify the driver to support
    consecutive non-idle cycles.
  confidence: medium
