weaknesses:
- id: W-RANDOMIZED-TEST-CRASH
  severity: critical
  category: test_infrastructure
  title: FifoRandomizedTest crashes before completing any seed iteration
  affected_tests:
  - FifoRandomizedTest
  evidence:
  - 'simulation_result.json FifoRandomizedTest: status=runtime_error, returncode=2,
    clean_exit=false, timed_out=false, watchdog_expired=false'
  - "simulation_result.json FifoRandomizedTest counts: uvm_errors=0, scoreboard_mismatches=0,\
    \ assertion_failures=0 \u2014 all zero because the crash occurs before UVM-level\
    \ statistics are populated"
  - simulation_result.json overall status is functional_failure, driven entirely by
    the FifoRandomizedTest runtime_error
  - "The FifoRandomizedTest log shows normal initialization (UVM_TESTNAME resolved,\
    \ parameters logged) followed by a truncated py.warnings WARNING at 0.00ns, then\
    \ no further log output \u2014 the crash occurs very early, before any randomized\
    \ traffic or reset injection is exercised"
  likely_cause: 'Inference: the crash is a Python-level exception (returncode 2 on
    Verilator/cocotb, not returncode 1 which would indicate a test assertion failure).
    The randomized test is the only test that runs 10 seed iterations of FifoRandomizedSeq
    (240 cycles each with periodic and mid-test reset injections). The truncated py.warnings
    WARNING at 0.00ns suggests a compatibility or import issue that manifests only
    in the randomized test''s execution path. The crash prevents any randomized traffic
    from being checked.'
  investigation_targets:
  - "tb/test.py (FifoRandomizedTest._run_scenario \u2014 the multi-seed iteration\
    \ loop)"
  - "tb/sequences.py (FifoRandomizedSeq.body \u2014 the reset injection and random\
    \ drive loop)"
  - "tb/driver.py (FifoDriver.run_phase \u2014 the get_next_item/item_done loop across\
    \ seed boundaries)"
  - The full cocotb simulation log (truncated in simulation_result.json; the WARNING
    content and any subsequent traceback are needed)
  recommended_action: Retrieve the full untruncated cocotb log for FifoRandomizedTest
    to identify the exact Python exception and traceback. Common causes include pyuvm
    API incompatibilities during multi-seed sequencer restarts, cocotb event-loop
    conflicts between sequence reset injections and the driver coroutine, or coverage_db
    accumulation errors across iterations.
  confidence: high
- id: W-NO-RANDOMIZED-COVERAGE
  severity: high
  category: coverage_gap
  title: No randomized functional coverage data collected or exported
  affected_tests:
  - FifoRandomizedTest
  evidence:
  - FifoRandomizedTest crashed (W-RANDOMIZED-TEST-CRASH) before report_phase, so FifoCoverage.report_phase
    never executed and no per-test YAML/XML coverage files were exported for the randomized
    test
  - "The cross-test coverage merge (coverage.py _merge_per_test_coverage) therefore\
    \ cannot include the randomized test's contribution \u2014 the most statistically\
    \ comprehensive coverage data is missing"
  - All 12 passing tests are short directed/corner/back-to-back scenarios; their aggregate
    coverage hits all reachable op_against_flags bins and occupancy levels, but this
    is per-test-max merging, not true concurrent coverage under random traffic
  likely_cause: Direct consequence of W-RANDOMIZED-TEST-CRASH. The coverage report_phase
    (which exports files and runs the merge) is a UVM phase that only executes after
    the test body completes successfully. Since the test crashes mid-execution, report_phase
    never runs.
  investigation_targets:
  - "tb/coverage.py (FifoCoverage.report_phase \u2014 never invoked for the crashed\
    \ test)"
  - "tb/test.py (FifoRandomizedTest._run_scenario \u2014 the crash point)"
  recommended_action: Fix the randomized test crash (W-RANDOMIZED-TEST-CRASH) so that
    report_phase executes and coverage data is exported. Additionally, consider whether
    the cocotb-coverage coverage_db singleton accumulates state across seed iterations
    in a way that could cause issues.
  confidence: high
