weaknesses:
- id: W-CORNER-RST-READONLY-CRASH
  severity: high
  category: test_isolation_runtime
  title: FifoCornerTest crashes driving rst_n during ReadOnly; two corner scenarios
    never run
  affected_tests:
  - FifoCornerTest
  evidence:
  - 'simulation_result.json FifoCornerTest: status=''runtime_error'', returncode=2,
    clean_exit=false; counts all 0 (no scoreboard/assertion failures because the run
    aborted).'
  - 'FifoCornerTest.xml failure traceback: ''RuntimeError: Attempting settings a value
    during the ReadOnly phase.'' raised at tb/sequences.py:112 self.dut.rst_n.setimmediatevalue(0),
    called from sequences.py:797 in ResetAtFullSeq.body.'
  - ResetAtFullSeq.body (sequences.py ~788-808) calls _check_outputs(full=1, empty=0,
    count=d) which awaits ReadOnly(), and then immediately calls _assert_reset() with
    no intervening clock/driver transition to leave the ReadOnly phase.
  - CORNER_SEQUENCES lists ResetAtFullSeq (index 8) and DoutRetentionSeq (index 9);
    the crash at ResetAtFullSeq means both of these planned corner cases never execute.
  likely_cause: 'inference: FifoCornerTest chains all corner sequences back-to-back
    with only a 2-cycle drain between them. ResetAtFullSeq is structured to sample
    outputs (parking cocotb in the ReadOnly callback phase) and then drive rst_n in
    the very next statement, so setimmediatevalue is attempted while the simulator
    is still in the ReadOnly phase, which cocotb rejects. The defect is specific to
    the check-then-reset adjacency and is not exercised by the directed tests (their
    mid-stream resets follow driver-driven writes, not a ReadOnly sample).'
  investigation_targets:
  - tb/sequences.py: ResetAtFullSeq.body (check-then-reset adjacency)
  - tb/test.py: FifoCornerTest._run_scenario (sequence chaining / drain)
  - tb/sequences.py: FifoSeqBase._assert_reset (ReadOnly-unsafe drive)
  recommended_action: In the TB, make _assert_reset ReadOnly-safe by synchronizing
    out of the ReadOnly region before setimmediatevalue (e.g. await FallingEdge/Timer)
    or insert a driver/clock transition between any _check_outputs and a subsequent
    _assert_reset. As defensive hardening, add a non-ReadOnly synchronizer at the
    start of _assert_reset and/or isolate each corner sequence with a proper drain
    so a prior sequence's ReadOnly parking cannot crash the next reset.
  confidence: high
