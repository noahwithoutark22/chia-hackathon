dut:
  name: axi_handshake
  file: benchmarks/axi_handshake/axi_handshake.sv
  description: >
    One-entry AXI4-Stream elastic buffer. Intentionally contains
    handshake violations: s_ready is always asserted, m_valid is
    driven combinationally from rst_n, and data_reg updates whenever
    s_valid is high regardless of transfer eligibility.

parameters: []

clock_and_reset:
  clock:
    name: clk
    type: posedge
    description: Rising-edge system clock.
  reset:
    name: rst_n
    polarity: active-low
    type: synchronous
    description: >
      Synchronous active-low reset. When deasserted the buffer is empty,
      s_ready is asserted, and m_valid is deasserted.
    reset_value:
      data_reg: "8'h00"
      buffer_empty: true

ports:
  inputs:
    - name: clk
      width: 1
      description: System clock
    - name: rst_n
      width: 1
      description: Active-low synchronous reset
    - name: s_valid
      width: 1
      description: Source valid – asserted when s_data carries a valid payload
    - name: s_data
      width: 8
      type: logic [7:0]
      description: 8-bit input payload
    - name: m_ready
      width: 1
      description: Downstream ready – asserted when consumer can accept output
  outputs:
    - name: s_ready
      width: 1
      description: >
        DUT ready for input transfer. Should be high when buffer is empty
        or when the current output is being consumed on the same cycle.
    - name: m_valid
      width: 1
      description: >
        Output valid – asserted when the buffer holds a valid output item.
    - name: m_data
      width: 8
      type: logic [7:0]
      latency: 0
      description: 8-bit output payload
  inouts: []

functional_behavior:
  description: >
    The DUT is a one-entry elastic buffer implementing AXI4-Stream
    handshaking on both input and output interfaces. An input transfer
    occurs when s_valid && s_ready on a rising clock edge. An output
    transfer occurs when m_valid && m_ready on a rising clock edge.
    The buffer can accept a new input when empty or when the current
    output is being consumed simultaneously. When the output is stalled
    (m_valid && !m_ready) both m_valid and m_data must be held stable.
    After reset the buffer is empty with m_valid deasserted and s_ready
    asserted. Payload ordering is preserved; no item may be dropped or
    duplicated.
  reset_behavior: >
    On reset (rst_n = 0), the internal buffer is cleared. m_valid is
    deasserted, m_data is zero, and s_ready is asserted. The buffer
    remains empty until the first valid input transfer after reset.
  reference_model:
    language: python
    file: benchmarks/axi_handshake/ref_model.py
    function: step
    logic: >
      Maintains a single-entry deque. s_ready is high when the deque is
      empty or when the output side is consuming (m_ready && m_valid).
      On each clock edge, the output transfer (if any) is resolved first,
      then the input transfer (if any) is resolved, preserving the
      property that a simultaneous consume-and-load leaves exactly one
      valid entry.
    latency: 0

directed_test_scenarios:
  - id: smoke_after_reset
    name: Smoke test after reset
    priority: high
    description: >
      Verify that after reset, s_ready is high, m_valid is low, and a
      single input transfer is accepted and appears on the output.
    stimulus:
      sequence:
        - action: reset
          cycles: 5
          description: Apply reset for 5 cycles
        - action: drive
          signals:
            s_valid: 1
            s_data: "8'hA5"
            m_ready: 1
          description: Present first input item with output ready
          cycles: 1
        - action: check
          signals:
            s_ready: 1
            m_valid: 1
            m_data: "8'hA5"
          description: After the transfer, buffer holds A5 and m_valid is high
        - action: check
          signals:
            s_valid: 0
            m_ready: 1
          description: Release input; output is consumed when m_ready is high
        - action: check
          signals:
            m_valid: 0
          description: After consumption with no new input, m_valid deasserts

  - id: stall_hold
    name: Output stall must hold m_valid and m_data
    priority: high
    description: >
      When the buffer holds a valid item and the downstream is not ready,
      m_valid and m_data must remain stable. No new input may be accepted
      during a stall.
    stimulus:
      sequence:
        - action: reset
          cycles: 5
        - action: drive
          signals:
            s_valid: 1
            s_data: "8'h42"
            m_ready: 1
          description: Load first item
          cycles: 1
        - action: drive
          signals:
            s_valid: 0
            m_ready: 0
          description: Stall the output (m_ready deasserted)
          cycles: 1
        - action: check
          signals:
            m_valid: 1
            m_data: "8'h42"
            s_ready: 0
          description: m_valid and m_data must be held; s_ready must be 0 during stall
        - action: drive
          signals:
            s_valid: 1
            s_data: "8'hFF"
            m_ready: 0
          description: Attempt input while stalled – should not be accepted
          cycles: 1
        - action: check
          signals:
            m_valid: 1
            m_data: "8'h42"
            s_ready: 0
          description: Buffer still holds 42; input was not accepted
        - action: drive
          signals:
            s_valid: 0
            m_ready: 1
          description: Release the stall
          cycles: 1
        - action: check
          signals:
            m_valid: 0
            m_data: "8'h00"
          description: After consumption, m_valid deasserts and m_data returns to default

  - id: simultaneous_transfer
    name: Simultaneous input accept and output consume
    priority: high
    description: >
      When the buffer holds an item and the downstream consumes it on the
      same cycle that a new input arrives, the new input should replace
      the consumed item and m_valid must remain asserted.
    stimulus:
      sequence:
        - action: reset
          cycles: 5
        - action: drive
          signals:
            s_valid: 1
            s_data: "8'h11"
            m_ready: 1
          description: Load item 0x11
          cycles: 1
        - action: check
          signals:
            m_valid: 1
            m_data: "8'h11"
          description: Buffer now holds 0x11
        - action: drive
          signals:
            s_valid: 1
            s_data: "8'h22"
            m_ready: 1
          description: >
            Simultaneously consume 0x11 and load 0x22
          cycles: 1
        - action: check
          signals:
            m_valid: 1
            m_data: "8'h22"
          description: Buffer now holds 0x22; m_valid stayed high

  - id: sequential_loads
    name: Sequential loads with consumption between
    priority: medium
    description: >
      Load and consume several items in sequence to verify ordering and
      that the buffer properly alternates between valid and empty states.
    stimulus:
      sequence:
        - action: reset
          cycles: 5
        - action: drive
          signals:
            s_valid: 1
            s_data: "8'h01"
            m_ready: 1
          cycles: 1
        - action: check
          signals:
            m_valid: 1
            m_data: "8'h01"
        - action: drive
          signals:
            s_valid: 0
            m_ready: 1
          cycles: 1
        - action: check
          signals:
            m_valid: 0
        - action: drive
          signals:
            s_valid: 1
            s_data: "8'h02"
            m_ready: 1
          cycles: 1
        - action: check
          signals:
            m_valid: 1
            m_data: "8'h02"
        - action: drive
          signals:
            s_valid: 0
            m_ready: 1
          cycles: 1
        - action: check
          signals:
            m_valid: 0
        - action: drive
          signals:
            s_valid: 1
            s_data: "8'h03"
            m_ready: 1
          cycles: 1
        - action: check
          signals:
            m_valid: 1
            m_data: "8'h03"

  - id: no_input_when_stalled
    name: s_ready deasserted during output stall
    priority: high
    description: >
      Verify that when the buffer is full (m_valid=1) and the downstream
      is not ready (m_ready=0), s_ready is deasserted. The producer may
      hold s_valid high but the DUT must not accept the transfer.
    stimulus:
      sequence:
        - action: reset
          cycles: 5
        - action: drive
          signals:
            s_valid: 1
            s_data: "8'hBB"
            m_ready: 1
          cycles: 1
        - action: drive
          signals:
            s_valid: 1
            s_data: "8'hCC"
            m_ready: 0
          description: Keep s_valid high but stall the output
          cycles: 1
        - action: check
          signals:
            m_valid: 1
            m_data: "8'hBB"
            s_ready: 0
          description: >
            m_data must still be BB, s_ready must be 0 – input
            must not be accepted.
        - action: drive
          signals:
            s_valid: 0
            m_ready: 1
          cycles: 1
        - action: check
          signals:
            m_valid: 0
          description: Buffer drained

  - id: reset_during_transfer
    name: Reset mid-transfer clears buffer
    priority: medium
    description: >
      Load an item, then assert reset. After reset, verify that the
      buffer is empty and s_ready is asserted while m_valid is deasserted.
    stimulus:
      sequence:
        - action: reset
          cycles: 5
        - action: drive
          signals:
            s_valid: 1
            s_data: "8'hDD"
            m_ready: 1
          cycles: 1
        - action: check
          signals:
            m_valid: 1
            m_data: "8'hDD"
        - action: reset
          cycles: 3
        - action: check
          signals:
            m_valid: 0
            s_ready: 1
          description: Buffer cleared by reset

corner_cases:
  - name: Back-to-back full-rate transfers
    description: >
      Keep both s_valid and m_ready asserted continuously. Each cycle the
      output consumes the current item and the input loads a new one.
      m_valid must remain high the entire time after the first item is loaded.
    expected:
      m_valid: 1
      s_ready: 1

  - name: All-zero payload
    description: >
      Transfer 8'h00 and verify it appears correctly on m_data.
    expected:
      m_data: "8'h00"

  - name: All-one payload
    description: >
      Transfer 8'hFF and verify it appears correctly on m_data.
    expected:
      m_data: "8'hFF"

  - name: Producer holds s_valid high forever while consumer never reads
    description: >
      After loading the buffer, the producer keeps s_valid=1 with
      different data values while m_ready=0. The DUT must never accept
      a new item. On release (m_ready=1), the original item must emerge.
    expected:
      m_data: "original_value"
      s_ready: 0

randomized_testing_strategy:
  description: >
    Randomize s_valid, s_data, and m_ready each cycle. The reference
    model predicts s_ready, m_valid, and m_data. The scoreboard compares
    DUT outputs against the reference model each cycle.
  constraints:
    - variable: s_data
      range: [0, 255]
    - variable: s_valid
      range: [0, 1]
    - variable: m_ready
      range: [0, 1]
  injection:
    - type: reset
      frequency: every 100 cycles on average
      duration_cycles: [3, 5]
      description: >
        Periodically assert reset for 3-5 cycles to exercise reset
        recovery and clearing of the buffer.
  pass_criteria: >
    Every cycle, DUT s_ready, m_valid, and m_data must match the reference
    model predictions. Any mismatch is a test failure.

functional_coverage:
  covergroups:
    - name: handshake_cg
      description: Coverage of input and output handshaking combinations
      clk: clk
      sample_on: posedge clk
      bins:
        - name: input_transfer_bin
          variable: input_transfer
          bins:
            - name: input_accepted
              expression: "s_valid && s_ready"
            - name: input_not_accepted
              expression: "s_valid && !s_ready"
        - name: output_transfer_bin
          variable: output_transfer
          bins:
            - name: output_accepted
              expression: "m_valid && m_ready"
            - name: output_stalled
              expression: "m_valid && !m_ready"
      crosses:
        - name: xfer_cross
          variables: [input_transfer, output_transfer]
          description: >
            Cross of input and output transfer events to ensure all
            four combinations (none, input-only, output-only, both)
            are exercised.

    - name: stall_cg
      description: Coverage of stall duration
      clk: clk
      sample_on: "!m_ready && m_valid"
      bins:
        - name: stall_cycles_bin
          variable: stall_cycle_count
          bins:
            - name: stall_1_cycle
              range: [1, 1]
            - name: stall_2_to_5_cycles
              range: [2, 5]
            - name: stall_6_plus_cycles
              range: [6, 100]

    - name: payload_cg
      description: Coverage of payload values
      clk: clk
      sample_on: "s_valid && s_ready"
      bins:
        - name: payload_value_bin
          variable: s_data
          bins:
            - name: all_zeros
              range: [0, 0]
            - name: all_ones
              range: [255, 255]
            - name: mid_range
              range: [128, 254]
            - name: low_range
              range: [1, 127]

scoreboard_reference_model_strategy:
  type: reference_model
  description: >
    Cycle-accurate reference model comparison. The Python reference model
    (ref_model.py) is instantiated as a cocotb helper. Each cycle the
    testbench feeds s_valid, s_data, and m_ready to the reference model
    and compares its returned (s_ready, m_valid, m_data) against the DUT
    outputs sampled on the same clock edge.
  architecture:
    - type: inline_reference_model
      description: >
        The ref_model.py step() function is called each cycle with the
        current input stimuli. Its outputs are compared against the DUT
        outputs.
    - type: reset_synchronization
      description: >
        The reference model reset() is called when rst_n deasserts so both
        DUT and model start from the same empty state.
  pass_criteria: >
    s_ready, m_valid, and m_data from the DUT must exactly match the
    reference model return values every cycle. Any mismatch is flagged
    as a scoreboard error.
  error_reporting: >
    On mismatch, report the cycle number, the stimulus inputs
    (s_valid, s_data, m_ready), the expected values from the reference
    model, and the actual DUT values.

useful_assertions:
  - name: valid_only_with_ready
    description: >
      A transfer must only occur when both VALID and READY are asserted.
    assertion: "!(s_valid && s_ready) || (data changes appropriately)"
    severity: error

  - name: m_valid_held_during_stall
    description: >
      When m_valid is asserted and m_ready is deasserted, m_valid must
      remain asserted and m_data must not change.
    assertion: >
      If m_valid == 1 and m_ready == 0 at cycle N, then m_valid == 1 and
      m_data == m_data_prev at cycle N+1.
    severity: error

  - name: s_ready_only_when_can_accept
    description: >
      s_ready must only be asserted when the buffer is empty or when
      the output is being consumed on the same cycle.
    assertion: >
      s_ready == 1 implies (buffer_empty OR (m_valid && m_ready))
    severity: error

  - name: m_valid_reflects_buffer
    description: >
      m_valid must be high if and only if the internal buffer holds a
      valid entry. It must not be driven combinationally from reset or
      any other non-state signal.
    assertion: >
      After reset, m_valid == 1 iff the buffer is non-empty
    severity: error

  - name: no_data_drop
    description: >
      Every accepted input (s_valid && s_ready) must eventually produce
      exactly one output (m_valid && m_ready) with the same data.
    assertion: >
      Count of accepted inputs must equal count of completed outputs,
      and output ordering matches input ordering.
    severity: error

discrepancies:
  - id: DISC-001
    severity: major
    title: s_ready always asserted in RTL
    rtl: >
      s_ready is assigned 1'b1 unconditionally (line 22 of RTL).
    spec: >
      s_ready should be high only when the buffer is empty or when the
      output is being consumed on the same cycle (spec rule 2, ref_model
      line 31: s_ready = (len(_QUEUE) == 0) or m_ready).
    impact: >
      The DUT accepts input transfers even when the buffer is full and the
      output is stalled, causing data corruption/overwrite. This is the
      primary handshake violation the benchmark is designed to expose.
    recommendation: >
      Drive s_ready from internal state: s_ready = (!m_valid) || m_ready.

  - id: DISC-002
    severity: major
    title: m_valid driven combinationally from rst_n
    rtl: >
      m_valid is assigned as `assign m_valid = rst_n` (line 24 of RTL),
      meaning m_valid is high as soon as reset is deasserted regardless
      of buffer state.
    spec: >
      m_valid should reflect whether the internal buffer holds a valid
      entry. After reset with no input accepted, m_valid must be low.
    impact: >
      m_valid is asserted spuriously when the buffer is empty, causing
      downstream consumers to accept invalid/garbage data.
    recommendation: >
      Drive m_valid from a registered buffer-empty/full indicator.

  - id: DISC-003
    severity: major
    title: data_reg updates unconditionally on s_valid
    rtl: >
      data_reg is updated whenever s_valid is high, regardless of whether
      s_ready permits a transfer (lines 33-34 of RTL).
    spec: >
      The data register should only be updated when an input transfer
      actually occurs (s_valid && s_ready), and s_ready must itself be
      gated by buffer state.
    impact: >
      Even if s_ready were correctly gated, the unconditional data_reg
      update means the stored value can be overwritten while the output
      is stalled, violating the hold requirement during stalls.
    recommendation: >
      Gate the data register update with `if (s_valid && s_ready)` and
      ensure s_ready is correctly derived from buffer state.