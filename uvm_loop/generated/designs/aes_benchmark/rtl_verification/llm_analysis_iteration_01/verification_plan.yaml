        start: 1
        key: '0xffffffffffffffffffffffffffffffff'
        plaintext: '0x00000000000000000000000000000000'
      cycles: 3
      description: Re-assert start while busy
    - action: wait_done
randomized_testing_strategy:
  description: 'Generate 1000 random 128-bit key/plaintext pairs and verify each completed
    transaction against the Python reference model encrypt_block() function. Randomly
    injects resets both during idle and mid-transaction to verify robustness.

    '
  constraints:
  - variable: key
    range:
    - '0x00000000000000000000000000000000'
    - '0xffffffffffffffffffffffffffffffff'
  - variable: plaintext
    range:
    - '0x00000000000000000000000000000000'
    - '0xffffffffffffffffffffffffffffffff'
  injection:
  - type: reset_during_idle
    frequency: 10%
    duration_cycles:
    - 2
    - 5
    description: 'Randomly assert reset while the DUT is idle between transactions.

      '
  - type: reset_during_operation
    frequency: 5%
    duration_cycles:
    - 2
    - 5
    description: 'Randomly assert reset while the DUT is mid-encryption (busy=1).

      '
  pass_criteria: 'Each completed transaction (not aborted by reset) must produce a
    ciphertext that exactly matches the Python reference model output encrypt_block(key,
    plaintext). Any mismatch constitutes a verification failure. After reset, the
    DUT must return to a clean idle state with busy=0, done=0, and ciphertext=0.

    '
functional_coverage:
  covergroups:
  - name: cg_input_patterns
    description: Coverage of key and plaintext input value ranges.
    clk: null
    sample_on: null
    bins:
    - name: bv_key_value
      variable: key
      bins:
      - name: all_zeros
        range: null
        expression: key == 0x00000000000000000000000000000000
      - name: all_ones
        range: null
        expression: key == 0xffffffffffffffffffffffffffffffff
      - name: alternating_a
        range: null
        expression: key == 0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - name: single_bit_lsb
        range: null
        expression: key == 0x00000000000000000000000000000001
    - name: bv_plaintext_value
      variable: plaintext
      bins:
      - name: all_zeros
        range: null
        expression: plaintext == 0x00000000000000000000000000000000
      - name: all_ones
        range: null
        expression: plaintext == 0xffffffffffffffffffffffffffffffff
      - name: alternating_5
        range: null
        expression: plaintext == 0x55555555555555555555555555555555
      - name: nist_vector
        range: null
        expression: plaintext == 0x00112233445566778899aabbccddeeff
    crosses:
    - name: cross_key_plaintext
      variables:
      - key
      - plaintext
      description: 'Cross key value patterns with plaintext value patterns to exercise
        diverse combinations of S-box inputs.

        '
  - name: cg_fsm_transitions
    description: Coverage of FSM state transitions and busy behavior.
    clk: null
    sample_on: null
    bins:
    - name: bv_state
      variable: state
      bins:
      - name: idle
        range: null
        expression: state == IDLE
      - name: round_run
        range: null
        expression: state == ROUND_RUN
      - name: finish
        range: null
        expression: state == FINISH
    crosses:
    - name: cross_state_busy
      variables:
      - state
      - busy
      description: 'Verify busy is low in IDLE and FINISH, high in ROUND_RUN.

        '
  - name: cg_reset_scenarios
    description: Coverage of reset under different DUT states.
    clk: null
    sample_on: null
    bins:
    - name: bv_reset_during_idle
      variable: rst_n
      bins:
      - name: reset_idle
        range: null
        expression: rst_n == 0 && state == IDLE
    - name: bv_reset_during_operation
      variable: rst_n
      bins:
      - name: reset_busy
        range: null
        expression: rst_n == 0 && busy == 1
    crosses: []
  - name: cg_done_behavior
    description: Coverage of done pulse generation.
    clk: null
    sample_on: null
    bins:
    - name: bv_done_high
      variable: done
      bins:
      - name: done_pulse
        range: null
        expression: done == 1
    crosses: []
scoreboard_reference_model_strategy:
  description: 'The scoreboard captures key and plaintext when start is accepted (busy
    transitions from 0 to 1), calls the Python reference model encrypt_block(key,
    plaintext), and holds the expected ciphertext until done pulses. On done, the
    DUT ciphertext is compared byte-by-byte against the expected result.

    '
  architecture:
  - type: parallel_reference_model
    description: 'Python encrypt_block() runs in parallel with the DUT. Inputs are
      sampled at start acceptance, the reference result is computed immediately and
      stored, and comparison occurs at done time.

      '
  - type: transaction_scorer
    description: 'Each transaction is scored independently. The scoreboard tracks
      the total number of transactions, matches, and mismatches.

      '
  pass_criteria: 'DUT ciphertext must exactly match the Python reference model output
    for every completed (non-reset-aborted) transaction. Any single-byte mismatch
    constitutes a verification failure.

    '
  error_reporting: 'On mismatch, report the transaction number, DUT ciphertext, expected
    ciphertext, key, and plaintext in hexadecimal format.

    '
useful_assertions:
- name: done_single_pulse
  description: done must deassert on the clock cycle after it pulses.
  severity: error
  assertion: done === 1 |=> done === 0
  note: ''
- name: busy_deasserts_with_done
  description: busy must be low when done pulses.
  severity: error
  assertion: done === 1 |-> busy === 0
  note: ''
- name: busy_high_during_operation
  description: 'busy must remain high continuously from the clock after start acceptance
    until done pulses.

    '
  severity: error
  assertion: $rose(busy) |=> busy throughout [*1:10]
  note: ''
- name: no_start_ignored_while_busy
  description: 'When busy is high, a new start must not interrupt the ongoing operation;
    busy must remain asserted.

    '
  severity: warning
  assertion: busy === 1 && $rose(start) |=> busy === 1
  note: ''
- name: reset_clears_outputs
  description: 'Within one clock of reset assertion, all outputs must be zero.

    '
  severity: error
  assertion: '$fell(rst_n) |-> ##1 busy === 0 && done === 0 && ciphertext === 0'
  note: ''
- name: ciphertext_valid_when_done
  description: ciphertext must contain no unknown bits when done pulses.
  severity: error
  assertion: done === 1 |-> !$isunknown(ciphertext)
  note: ''
- name: operation_latency
  description: 'The done pulse must occur exactly 12 clock cycles after start is sampled
    in the IDLE state.

    '
  severity: error
  assertion: '$rose(start && !busy) |-> ##12 done === 1'
  note: ''
- name: busy_low_when_idle
  description: busy must be 0 when the FSM is in IDLE state.
  severity: error
  assertion: state == IDLE |-> busy === 0
  note: ''
discrepancies:
- id: DISC-001
  severity: high
  title: MixColumns incorrectly applied in the final AES round
  rtl: 'The combinational block guards MixColumns skip with ''if (round == 4''d10)'',
    but the FSM transitions from ROUND_RUN to FINISH when round equals 9. Since round
    never reaches 10 during ROUND_RUN, the guard is dead code and MixColumns is applied
    in all 10 ROUND_RUN iterations, including the last one which corresponds to AES
    round 10.

    '
  spec: 'AES-128 standard (and the specification in aes_spec.md) states that round
    10 performs SubBytes, ShiftRows, and AddRoundKey only, with no MixColumns. The
    Python reference model encrypt_block() correctly skips MixColumns when rnd ==
    10.

    '
  impact: 'The DUT produces incorrect ciphertext for all inputs. For the NIST KAT
    vector, the DUT outputs 0xd961a18ca92dd978fb987b3ae7a8d9cd instead of the correct
    0x69c4e0d86a7b0430d8cdb78070b4c55a.

    '
  recommendation: Keep the ROUND_RUN-to-FINISH transition at round == 4'd9 so that
    ROUND_RUN processes 10 iterations (round 0 through 9). In the combinational block,
    change the MixColumns-skip guard from 'if (round == 4'd10)' to 'if (round == 4'd9)'
    so that the last ROUND_RUN iteration (round 9, corresponding to AES round 10)
    performs SubBytes, ShiftRows, and AddRoundKey only, correctly skipping MixColumns.
    This produces the correct NIST ciphertext 0x69c4e0d86a7b0430d8cdb78070b4c55a.
