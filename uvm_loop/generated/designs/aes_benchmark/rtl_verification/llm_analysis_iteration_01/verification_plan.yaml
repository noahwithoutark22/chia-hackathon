- name: Start Ignored When Busy
  description: 'Asserts start while the DUT is busy and verifies the second start
    is ignored and the first transaction completes correctly.

    '
  expected:
    ciphertext: '0x69c4e0d86a7b0430d8cdb78070b4c55a'
    note: Only the first transaction should complete; second start is ignored.
  stimulus:
    sequence:
    - action: reset
