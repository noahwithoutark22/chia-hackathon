dut:
  name: aes128
  file: benchmarks/aes_benchmark/aes128.sv
  description: 'Transaction-level, iterative AES-128 single-block encryption core.
    10-round implementation using SubBytes, ShiftRows, MixColumns, and AddRoundKey
    operations with a 3-state FSM (IDLE, ROUND_RUN, FINISH).

    '
parameters: []
clock_and_reset:
  clock:
    name: clk
    type: posedge
    description: ''
  reset:
    name: rst_n
    polarity: active-low
    type: asynchronous
    description: ''
    reset_value:
      state_reg: '0'
      round_key: '0'
      round: 0
      ciphertext: '0'
      busy: 0
      done: 0
      state: IDLE
ports:
  inputs:
  - name: clk
    width: 1
    description: ''
    type: logic
    latency: null
  - name: rst_n
    width: 1
    description: ''
    type: logic
    latency: null
  - name: start
    width: 1
    description: Start signal accepted only while idle
    type: logic
    latency: null
  - name: key
    width: 128
    description: 128-bit AES key
    type: logic
    latency: null
  - name: plaintext
    width: 128
    description: 128-bit plaintext block
    type: logic
    latency: null
  outputs:
  - name: ciphertext
    width: 128
    description: 128-bit encrypted output, valid when done pulses
    type: logic
    latency: 12
  - name: busy
    width: 1
    description: High while an encryption transaction is active
    type: logic
    latency: null
  - name: done
    width: 1
    description: One-clock completion pulse when ciphertext is valid
    type: logic
    latency: null
  inouts: []
functional_behavior:
  description: 'When start is accepted while the DUT is idle (busy=0), key and plaintext
    are captured. The DUT performs AES-128 encryption: initial AddRoundKey with round
    key 0, then 10 rounds each consisting of SubBytes, ShiftRows, MixColumns (rounds
    1 through 9 only), and AddRoundKey. The final round (round 10) omits MixColumns.
    After exactly 12 clock cycles from start acceptance, done pulses high for exactly
    one clock and ciphertext holds the valid encrypted result. Any changes to key
    or plaintext after start acceptance are ignored.

    '
  reset_behavior: 'Asynchronous active-low reset (rst_n) clears all internal state:
    state_reg, round_key, and round are zeroed; ciphertext, busy, and done are driven
    to zero; the FSM returns to IDLE.

    '
  reference_model:
    language: python
    file: benchmarks/aes_benchmark/aes_reference_model.py
    function: encrypt_block
    logic: ''
    latency: 12
directed_test_scenarios:
- id: nist_kat
  name: NIST Known-Answer Test
  description: 'Verifies against the standard NIST AES-128 known-answer test vector.
    Primary correctness validation.

    '
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 5
      description: ''
    - action: drive
      signals:
        start: 1
        key: '0x000102030405060708090a0b0c0d0e0f'
        plaintext: '0x00112233445566778899aabbccddeeff'
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
      cycles: null
      description: ''
  expected:
    ciphertext: '0x69c4e0d86a7b0430d8cdb78070b4c55a'
  note: ''
- id: all_zeros
  name: All-Zero Key and Plaintext
  description: 'Encrypts all-zero key and plaintext to exercise zero-valued S-box
    inputs and key schedule paths.

    '
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 5
      description: ''
    - action: drive
      signals:
        start: 1
        key: '0x00000000000000000000000000000000'
        plaintext: '0x00000000000000000000000000000000'
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
      cycles: null
      description: ''
  expected:
    ciphertext: '0x66e94bd4ef8a2c3b884cfa59ca342b2e'
  note: ''
- id: all_ones
  name: All-One Key and Plaintext
  description: 'Encrypts all-one key and plaintext to exercise maximal-valued S-box
    inputs and key schedule paths.

    '
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 5
      description: ''
    - action: drive
      signals:
        start: 1
        key: '0xffffffffffffffffffffffffffffffff'
        plaintext: '0xffffffffffffffffffffffffffffffff'
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
      cycles: null
      description: ''
  expected:
    ciphertext: '0xbcbf217cb280cf30b2517052193ab979'
  note: ''
- id: alternating
  name: Alternating Bit Patterns
  description: 'Encrypts key of 0xAA.. and plaintext of 0x55.. to exercise diverse
    S-box, ShiftRows, and MixColumns paths.

    '
  priority: medium
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 5
      description: ''
    - action: drive
      signals:
        start: 1
        key: '0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
        plaintext: '0x55555555555555555555555555555555'
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
      cycles: null
      description: ''
  expected:
    ciphertext: '0x5a7efe3965060f8f531935f9efb7bfc5'
  note: ''
- id: zero_key_nonzero_pt
  name: Zero Key, Non-Zero Plaintext
  description: 'Tests with a zero key and the NIST plaintext vector. Exercises zero-key
    key schedule generation.

    '
  priority: medium
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 5
      description: ''
    - action: drive
      signals:
        start: 1
        key: '0x00000000000000000000000000000000'
        plaintext: '0x00112233445566778899aabbccddeeff'
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
      cycles: null
      description: ''
  expected:
    ciphertext: '0xc8a331ff8edd3db175e1545dbefb760b'
  note: ''
- id: nonzero_key_zero_pt
  name: Non-Zero Key, Zero Plaintext
  description: 'Tests with the NIST key and zero plaintext.

    '
  priority: medium
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 5
      description: ''
    - action: drive
      signals:
        start: 1
        key: '0x000102030405060708090a0b0c0d0e0f'
        plaintext: '0x00000000000000000000000000000000'
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
      cycles: null
      description: ''
  expected:
    ciphertext: '0xc6a13b37878f5b826f4f8162a1c8d879'
  note: ''
- id: input_change_while_busy
  name: Input Changes While Busy
  description: 'Verifies that changes to key and plaintext after start acceptance
    do not affect the ciphertext. Drives the NIST vector, then changes inputs to different
    values while busy, and checks the ciphertext matches only the original inputs.

    '
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 5
      description: ''
    - action: drive
      signals:
        start: 1
        key: '0x000102030405060708090a0b0c0d0e0f'
        plaintext: '0x00112233445566778899aabbccddeeff'
      cycles: null
      description: ''
    - action: drive
      signals:
        start: 0
        key: '0xffffffffffffffffffffffffffffffff'
        plaintext: '0x00000000000000000000000000000000'
      cycles: 5
      description: Change inputs while DUT is busy
    - action: wait_done
      signals: {}
      cycles: null
      description: ''
  expected:
    ciphertext: '0x69c4e0d86a7b0430d8cdb78070b4c55a'
  note: ''
- id: repeated_transactions
  name: Repeated Sequential Transactions
  description: 'Runs two back-to-back transactions with different key/plaintext pairs
    and verifies each produces the correct ciphertext independently.

    '
  priority: medium
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 5
      description: ''
    - action: drive
      signals:
        start: 1
        key: '0x000102030405060708090a0b0c0d0e0f'
        plaintext: '0x00112233445566778899aabbccddeeff'
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
      cycles: null
      description: ''
    - action: drive
      signals:
        start: 1
        key: '0xffffffffffffffffffffffffffffffff'
        plaintext: '0x00000000000000000000000000000000'
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
      cycles: null
      description: ''
  expected:
    first_ciphertext: '0x69c4e0d86a7b0430d8cdb78070b4c55a'
    second_ciphertext: '0xa1f6258c877d5fcd8964484538bfc92c'
  note: ''
- id: done_pulse_width
  name: Done Pulse Width Verification
  description: 'Verifies that done pulses for exactly one clock cycle and that busy
    deasserts on the same clock as done.

    '
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 5
      description: ''
    - action: drive
      signals:
        start: 1
        key: '0x000102030405060708090a0b0c0d0e0f'
        plaintext: '0x00112233445566778899aabbccddeeff'
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
      cycles: null
      description: ''
  expected:
    done_pulse_width_cycles: 1
    busy_deasserts_with_done: true
  note: ''
- id: reset_during_idle
  name: Reset During Idle
  description: 'Applies reset while the DUT is idle, then verifies the DUT recovers
    and performs a correct encryption afterward.

    '
  priority: medium
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 10
      description: ''
    - action: wait
      signals: {}
      cycles: 5
      description: ''
    - action: drive
      signals:
        start: 1
        key: '0x000102030405060708090a0b0c0d0e0f'
        plaintext: '0x00112233445566778899aabbccddeeff'
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
      cycles: null
      description: ''
  expected:
    ciphertext: '0x69c4e0d86a7b0430d8cdb78070b4c55a'
  note: ''
- id: reset_mid_transaction
  name: Reset During Encryption
  description: 'Asserts reset while the DUT is mid-encryption (busy=1) and verifies
    that the DUT aborts the operation and returns to a clean idle state with busy=0,
    done=0, and ciphertext=0.

    '
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 5
      description: ''
    - action: drive
      signals:
        start: 1
        key: '0x000102030405060708090a0b0c0d0e0f'
        plaintext: '0x00112233445566778899aabbccddeeff'
      cycles: null
      description: ''
    - action: wait
      signals: {}
      cycles: 5
      description: Wait 5 cycles into encryption
    - action: reset
      signals: {}
      cycles: 3
      description: ''
    - action: wait
      signals: {}
      cycles: 3
      description: Wait for reset to fully take effect
  expected:
    busy: 0
    done: 0
    ciphertext: '0x00000000000000000000000000000000'
  note: ''
corner_cases:
- name: Single-Bit Key
  description: 'Tests with only the least significant bit of the key set, exercising
    sparse key schedule generation.

    '
  expected:
    ciphertext: '0x0545aad56da2a97c3663d1432a3d1c84'
  stimulus:
    sequence:
    - action: reset
      cycles: 5
    - action: drive
      signals:
        start: 1
        key: '0x00000000000000000000000000000001'
        plaintext: '0x00000000000000000000000000000000'
    - action: wait_done
- name: Fast Re-Trigger After Done
  description: 'Asserts start on the very next cycle after done pulses to verify the
    FSM properly returns to IDLE and can immediately begin a new transaction.

    '
  expected:
    first_ciphertext: '0x69c4e0d86a7b0430d8cdb78070b4c55a'
    second_ciphertext: '0xa1f6258c877d5fcd8964484538bfc92c'
  stimulus:
    sequence:
    - action: reset
      cycles: 5
    - action: drive
      signals:
        start: 1
        key: '0x000102030405060708090a0b0c0d0e0f'
        plaintext: '0x00112233445566778899aabbccddeeff'
    - action: wait_done
    - action: drive
      signals:
        start: 1
        key: '0xffffffffffffffffffffffffffffffff'
        plaintext: '0x00000000000000000000000000000000'
    - action: wait_done
- name: All Ones Key, Zero Plaintext
  description: Tests all-one key with zero plaintext to exercise asymmetric paths.
  expected:
    ciphertext: '0xa1f6258c877d5fcd8964484538bfc92c'
  stimulus:
    sequence:
    - action: reset
      cycles: 5
    - action: drive
      signals:
        start: 1
        key: '0xffffffffffffffffffffffffffffffff'
        plaintext: '0x00000000000000000000000000000000'
    - action: wait_done
- name: Zero Key, All Ones Plaintext
  description: Tests zero key with all-one plaintext.
  expected:
    ciphertext: '0x3f5b8cc9ea855a0afa7347d23e8d664e'
  stimulus:
    sequence:
    - action: reset
      cycles: 5
    - action: drive
