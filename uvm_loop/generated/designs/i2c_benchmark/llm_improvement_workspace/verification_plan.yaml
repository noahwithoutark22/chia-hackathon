dut:
  name: i2c_master
  file: benchmarks/i2c_benchmark/i2c_master.sv
  description: Transaction-level I2C master controller. Accepts a start request and
    one register-oriented transaction (7-bit slave address, 8-bit register address,
    8-bit data), executes an abstracted START/transfer/STOP sequence, and reports
    completion via a single-cycle done pulse. A built-in 256-byte memory array models
    an EEPROM-like slave at address 0x50.
parameters: []
clock_and_reset:
  clock:
    name: clk
    type: posedge
    description: System clock. All synchronous state advances on the rising edge.
  reset:
    name: rst_n
    polarity: active-low
    type: asynchronous
    description: 'Asynchronous active-low reset. While asserted, the controller shall
      be idle: busy=0, done=0, ack_error=0, read_data=0x00, and the I2C SCL/SDA lines
      released (high-impedance, pulled up by the environment).'
    reset_value:
      state: IDLE
      busy: 0
      done: 0
      ack_error: 0
      read_data: 0
      scl: released
      sda: released
ports:
  inputs:
  - name: clk
    width: 1
    description: System clock.
    type: logic
    latency: null
  - name: rst_n
    width: 1
    description: Active-low asynchronous reset.
    type: logic
    latency: null
  - name: start
    width: 1
    description: Transaction request. Sampled only while idle (busy=0); started requests
      begin a transaction.
    type: logic
    latency: null
  - name: rw
    width: 1
    description: Transaction direction latched at start. 0 = write write_data to reg_addr;
      1 = read from reg_addr into read_data.
    type: logic
    latency: null
  - name: slave_addr
    width: 7
    description: 7-bit I2C slave address. Only 0x50 is supported; any other address
      completes with ack_error=1.
    type: logic
    latency: null
  - name: reg_addr
    width: 8
    description: 8-bit register (memory byte) address within the slave.
    type: logic
    latency: null
  - name: write_data
    width: 8
    description: 8-bit data byte written for a write transaction (rw=0).
    type: logic
    latency: null
  outputs:
  - name: read_data
    width: 8
    description: Data byte returned by a read transaction from the supported slave.
      Expected to be 0x00 for transactions to unsupported slave addresses and for
      reads of never-written registers.
    type: logic
    latency: null
  - name: busy
    width: 1
    description: High while a transaction is active; deasserted in the completion
      state along with the done pulse.
    type: logic
    latency: null
  - name: done
    width: 1
    description: One-clock-cycle completion pulse per transaction.
    type: logic
    latency: null
  - name: ack_error
    width: 1
    description: Set at the end of a transaction whose slave address is not the supported
      0x50; cleared when returning to idle for the next transaction.
    type: logic
    latency: null
  inouts:
  - name: scl
    width: 1
    description: Open-drain I2C clock line. Driven low during the transfer phase and
      released (high-impedance) otherwise; environment provides pull-ups.
    type: null
    latency: null
  - name: sda
    width: 1
    description: Open-drain I2C data line. Driven low during START-like phase and
      released (high-impedance) otherwise; environment provides pull-ups.
    type: null
    latency: null
functional_behavior:
  description: 'The controller operates as a transaction-level I2C master with one
    supported EEPROM-like slave at 7-bit address 0x50 and a 256-byte byte-addressed
    memory. A request is accepted when start is asserted while idle; rw, slave_addr,
    reg_addr, and write_data are latched and busy goes high. The transaction advances
    through a START-like phase (SDA driven low, SCL released), a transfer/access phase
    (for slave 0x50: write memory[reg_addr]=write_data for rw=0, or present memory[reg_addr]
    on read_data for rw=1; for any other address ack_error is set), a STOP-like phase
    (both lines released), and a completion state in which busy drops and done pulses
    for one clock. After that the controller returns to idle and may accept the next
    transaction. A read from a register that has never been written returns 0x00.
    Back-to-back transactions are permitted once idle.'
  reset_behavior: Asserting rst_n (active-low, asynchronous) clears the FSM to IDLE
    and drives busy=0, done=0, ack_error=0, read_data=0x00, and releases SCL and SDA
    (SDA/SCL high-impedance). The specification and reference model treat the internal
    memory as cleared on reset; the RTL does not explicitly clear its memory on reset
    (see discrepancies).
  reference_model:
    language: python
    file: benchmarks/i2c_benchmark/i2c_reference_model.py
    function: transact
    logic: I2CReferenceModel.transact(rw, slave_addr, reg_addr, write_data) validates
      input widths, then returns done=1, busy_after=0 for every transaction. For slave_addr
      != 0x50 it returns ack_error=1 and read_data=0. For the supported slave, rw=0
      stores write_data at reg_addr in memory and returns ack_error=0, read_data=0;
      rw=1 returns ack_error=0 and read_data=memory.get(reg_addr, 0). Model memory
      is cleared by reset().
    latency: transaction-level (results compared when DUT done pulses)
directed_test_scenarios:
- id: I2C_01
  name: Reset Behavior
  description: 'Verify all outputs after reset: busy=0, done=0, ack_error=0, read_data=0x00,
    and SCL/SDA lines released (pulled up to 1).'
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 8
      description: Assert and release rst_n with start deasserted.
    - action: check
      signals:
        busy: 0
        done: 0
        ack_error: 0
        read_data: 0
      cycles: null
      description: Sample outputs after reset; all must be cleared.
    - action: check_bus_idle
      signals: {}
      cycles: null
      description: Verify scl and sda are not driven low (released).
  expected:
    busy: 0
    done: 0
    ack_error: 0
    read_data: 0
  note: ''
- id: I2C_02
  name: Write Then Read Back
  description: Write 0xAA to register 0x10 on supported slave 0x50, then read it back
    and verify read_data.
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 8
      description: Idle the controller.
    - action: transaction
      signals:
        rw: 0
        slave_addr: 80
        reg_addr: 16
        write_data: 170
      cycles: null
      description: Start a write of 0xAA to reg 0x10.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for the done pulse.
    - action: check
      signals:
        ack_error: 0
        busy: 0
      cycles: null
      description: Write must complete with no NACK and idle state.
    - action: transaction
      signals:
        rw: 1
        slave_addr: 80
        reg_addr: 16
        write_data: 0
      cycles: null
      description: Start a read of reg 0x10.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for the done pulse.
    - action: check
      signals:
        ack_error: 0
        read_data: 170
      cycles: null
      description: Read data must equal the previously written value.
  expected:
    ack_error: 0
    read_data: 170
  note: ''
- id: I2C_03
  name: Read Before Write Returns Zero
  description: Read a register that has never been written; the reference result is
    0x00.
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 8
      description: Idle the controller.
    - action: transaction
      signals:
        rw: 1
        slave_addr: 80
        reg_addr: 66
        write_data: 0
      cycles: null
      description: Read never-written reg 0x42.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for the done pulse.
    - action: check
      signals:
        ack_error: 0
        read_data: 0
      cycles: null
      description: Unwritten register must return 0x00.
  expected:
    ack_error: 0
    read_data: 0
  note: ''
- id: I2C_04
  name: Repeated Writes to Same Register
  description: Write 0x55 then 0xAA to the same register; last write must win on a
    subsequent read.
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 8
      description: Idle the controller.
    - action: transaction
      signals:
        rw: 0
        slave_addr: 80
        reg_addr: 8
        write_data: 85
      cycles: null
      description: First write to reg 0x08.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for the done pulse.
    - action: transaction
      signals:
        rw: 0
        slave_addr: 80
        reg_addr: 8
        write_data: 170
      cycles: null
      description: Overwrite reg 0x08.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for the done pulse.
    - action: transaction
      signals:
        rw: 1
        slave_addr: 80
        reg_addr: 8
        write_data: 0
      cycles: null
      description: Read back reg 0x08.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for the done pulse.
    - action: check
      signals:
        read_data: 170
        ack_error: 0
      cycles: null
      description: Must read the last written value.
  expected:
    ack_error: 0
    read_data: 170
  note: ''
- id: I2C_05
  name: Boundary Register Address 0x00
  description: Write 0xFF to register 0x00 (lowest address) and read it back.
  priority: medium
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 8
      description: Idle the controller.
    - action: transaction
      signals:
        rw: 0
        slave_addr: 80
        reg_addr: 0
        write_data: 255
      cycles: null
      description: Write to boundary reg 0x00.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for done.
    - action: transaction
      signals:
        rw: 1
        slave_addr: 80
        reg_addr: 0
        write_data: 0
      cycles: null
      description: Read boundary reg 0x00.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for done.
    - action: check
      signals:
        read_data: 255
        ack_error: 0
      cycles: null
      description: Read back 0xFF.
  expected:
    read_data: 255
    ack_error: 0
  note: ''
- id: I2C_06
  name: Boundary Register Address 0xFF
  description: Write 0x55 to register 0xFF (highest address) and read it back.
  priority: medium
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 8
      description: Idle the controller.
    - action: transaction
      signals:
        rw: 0
        slave_addr: 80
        reg_addr: 255
        write_data: 85
      cycles: null
      description: Write to boundary reg 0xFF.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for done.
    - action: transaction
      signals:
        rw: 1
        slave_addr: 80
        reg_addr: 255
        write_data: 0
      cycles: null
      description: Read boundary reg 0xFF.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for done.
    - action: check
      signals:
        read_data: 85
        ack_error: 0
      cycles: null
      description: Read back 0x55.
  expected:
    read_data: 85
    ack_error: 0
  note: ''
- id: I2C_07
  name: Unsupported Slave Address 0x00
  description: Write transaction to unsupported slave 0x00 must complete with ack_error=1
    and read_data=0x00 (per spec/reference model).
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 8
      description: Idle the controller.
    - action: transaction
      signals:
        rw: 0
        slave_addr: 0
        reg_addr: 0
        write_data: 85
      cycles: null
      description: Start transaction to unsupported slave 0x00.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for done.
    - action: check
      signals:
        ack_error: 1
        busy: 0
        read_data: 0
      cycles: null
      description: ack_error must be 1, busy back to 0, and read_data must be 0x00
        for the transaction result.
  expected:
    ack_error: 1
    busy: 0
    read_data: 0
  note: ''
- id: I2C_08
  name: Unsupported Slave Address 0x01
  description: Read transaction to unsupported slave 0x01 must complete with ack_error=1
    and read_data=0x00.
  priority: medium
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 8
      description: Idle the controller.
    - action: transaction
      signals:
        rw: 1
        slave_addr: 1
        reg_addr: 16
        write_data: 0
      cycles: null
      description: Start read from unsupported slave 0x01.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for done.
    - action: check
      signals:
        ack_error: 1
        read_data: 0
      cycles: null
      description: ack_error=1 and read_data=0x00.
  expected:
    ack_error: 1
    read_data: 0
  note: ''
- id: I2C_09
  name: Unsupported Slave Address 0x7F
  description: Transaction to the maximum 7-bit address 0x7F must complete with ack_error=1
    and read_data=0x00.
  priority: medium
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 8
      description: Idle the controller.
    - action: transaction
      signals:
        rw: 0
        slave_addr: 127
        reg_addr: 255
        write_data: 170
      cycles: null
      description: Start write to unsupported slave 0x7F.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for done.
    - action: check
      signals:
        ack_error: 1
        read_data: 0
      cycles: null
      description: ack_error=1 and read_data=0x00.
  expected:
    ack_error: 1
    read_data: 0
  note: ''
- id: I2C_10
  name: Start While Busy Is Ignored
  description: Assert start while a transaction is in progress; the extra request
    must be ignored and the in-flight transaction must complete normally with a single
    done pulse.
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 8
      description: Idle the controller.
    - action: transaction
      signals:
        rw: 0
        slave_addr: 80
        reg_addr: 16
        write_data: 17
      cycles: null
      description: Start primary write of 0x11 to reg 0x10.
    - action: transaction
      signals:
        rw: 0
        slave_addr: 80
        reg_addr: 32
        write_data: 34
      cycles: null
      description: Assert start again while busy (controller not idle); this request
        must be ignored.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for the single expected done pulse.
    - action: check
      signals:
        ack_error: 0
      cycles: null
      description: Primary transaction completes without error.
    - action: transaction
      signals:
        rw: 1
        slave_addr: 80
        reg_addr: 32
        write_data: 0
      cycles: null
      description: Read reg 0x20 to confirm the busy-time start was ignored.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for done.
    - action: check
      signals:
        read_data: 0
      cycles: null
      description: reg 0x20 was never written, so 0x00 confirms the second start was
        ignored.
    - action: transaction
      signals:
        rw: 1
        slave_addr: 80
        reg_addr: 16
        write_data: 0
      cycles: null
      description: Read reg 0x10 to confirm the primary write landed.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for done.
    - action: check
      signals:
        read_data: 17
      cycles: null
      description: Primary write data must be intact.
  expected:
    ack_error: 0
    done_pulses: 1
  note: ''
- id: I2C_11
  name: Done Pulse Width
  description: Verify done pulses for exactly one clock cycle and busy returns low
    together with the pulse.
  priority: medium
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 8
      description: Idle the controller.
    - action: transaction
      signals:
        rw: 0
        slave_addr: 80
        reg_addr: 5
        write_data: 90
      cycles: null
      description: Start a write transaction.
    - action: wait_done
      signals: {}
      cycles: null
      description: Capture the cycle window around done.
    - action: check_done_pulse_width
      signals: {}
      cycles: null
      description: done must be sampled high for exactly one cycle and low on the
        following cycle; busy must be observed low while done is high.
  expected:
    done_high_cycles: 1
    busy_while_done: 0
  note: ''
- id: I2C_12
  name: Open-Drain Bus Release
  description: 'Verify SCL/SDA open-drain behavior: both released (pulled up) in idle
    and after reset, SDA driven low during the START-like phase, SCL driven low during
    the access phase, and both released after completion.'
  priority: medium
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 8
      description: Reset with environment pull-ups applied.
    - action: check_bus_idle
      signals: {}
      cycles: null
      description: scl=1 and sda=1 (released, pulled up).
    - action: transaction
      signals:
        rw: 0
        slave_addr: 80
        reg_addr: 0
        write_data: 0
      cycles: null
      description: Start a write transaction.
    - action: check_bus_start_phase
      signals: {}
      cycles: null
      description: During the START-like phase sda is driven low while scl remains
        released.
    - action: check_bus_access_phase
      signals: {}
      cycles: null
      description: During the access phase scl is driven low while sda is released.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for completion.
    - action: check_bus_idle
      signals: {}
      cycles: null
      description: Both lines released again after the transaction.
  expected:
    scl_idle: released
    sda_idle: released
  note: ''
- id: I2C_13
  name: Multi-Register Independence
  description: Write distinct values to several registers and read them back to confirm
    each register address maps to independent storage.
  priority: low
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 8
      description: Idle the controller.
    - action: transaction
      signals:
        rw: 0
        slave_addr: 80
        reg_addr: 1
        write_data: 17
      cycles: null
      description: Write 0x11 to reg 0x01.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for done.
    - action: transaction
      signals:
        rw: 0
        slave_addr: 80
        reg_addr: 2
        write_data: 34
      cycles: null
      description: Write 0x22 to reg 0x02.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for done.
    - action: transaction
      signals:
        rw: 0
        slave_addr: 80
        reg_addr: 3
        write_data: 51
      cycles: null
      description: Write 0x33 to reg 0x03.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for done.
    - action: transaction
      signals:
        rw: 1
        slave_addr: 80
        reg_addr: 2
        write_data: 0
      cycles: null
      description: Read reg 0x02.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for done.
    - action: check
      signals:
        read_data: 34
      cycles: null
      description: Each register holds its own value.
    - action: transaction
      signals:
        rw: 1
        slave_addr: 80
        reg_addr: 1
        write_data: 0
      cycles: null
      description: Read reg 0x01.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for done.
    - action: check
      signals:
        read_data: 17
      cycles: null
      description: Each register holds its own value.
  expected:
    ack_error: 0
  note: ''
- id: I2C_14
  name: Back-to-Back Transactions
  description: Start a new transaction in the cycle immediately after done; the controller
    must accept it cleanly.
  priority: low
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 8
      description: Idle the controller.
    - action: transaction
      signals:
        rw: 0
        slave_addr: 80
        reg_addr: 10
        write_data: 18
      cycles: null
      description: First transaction.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for done.
    - action: transaction
      signals:
        rw: 1
        slave_addr: 80
        reg_addr: 10
        write_data: 0
      cycles: null
      description: Start immediately following completion (controller idle again).
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait for the second done pulse.
    - action: check
      signals:
        read_data: 18
        ack_error: 0
      cycles: null
      description: Second transaction reads the value written by the first.
  expected:
    ack_error: 0
    read_data: 18
  note: ''
corner_cases:
- name: Read of Never-Written Register
  description: Read any register before any write to it; result must be 0x00.
  expected:
    read_data: 0
    ack_error: 0
- name: Register Address 0x00 Boundary
  description: Write and read at the lowest register address.
  expected:
    read_data: 0
    ack_error: 0
- name: Register Address 0xFF Boundary
  description: Write and read at the highest register address.
  expected:
    read_data: 255
    ack_error: 0
- name: Data Value 0x00
  description: Write 0x00 and read it back.
  expected:
    read_data: 0
    ack_error: 0
- name: Data Value 0xFF
  description: Write 0xFF and read it back.
  expected:
    read_data: 255
    ack_error: 0
- name: Data Value 0x55
  description: Write pattern 0x55 and read it back.
  expected:
    read_data: 85
    ack_error: 0
- name: Data Value 0xAA
  description: Write pattern 0xAA and read it back.
  expected:
    read_data: 170
    ack_error: 0
- name: Unsupported Address 0x00
  description: Transaction to slave address 0x00 (also the address boundary).
  expected:
    ack_error: 1
    read_data: 0
- name: Unsupported Address 0x7F
  description: Transaction to the maximum 7-bit slave address 0x7F.
  expected:
    ack_error: 1
    read_data: 0
- name: Unsupported Address 0x01
  description: Transaction to slave address 0x01.
  expected:
    ack_error: 1
    read_data: 0
- name: Start While Busy
  description: Assert start during an active transaction; request must be ignored.
  expected:
    done_pulses: 1
    ack_error: 0
randomized_testing_strategy:
  description: Constrained-random stimulus drives back-to-back write and read transactions
    with randomized slave addresses, register addresses, and data. slave_addr is restricted
    to the 7-bit range with the supported address 0x50 covered as a frequent legal
    value alongside unsupported addresses; rw alternates between reads and writes.
    After each random transaction the environment waits for done and scores outputs
    against the reference model.
  constraints:
  - variable: slave_addr
    range:
    - 0
    - 127
  - variable: reg_addr
    range:
    - 0
    - 255
  - variable: write_data
    range:
    - 0
    - 255
  - variable: rw
    range:
    - 0
    - 1
  injection:
  - type: reset_during_transaction
    frequency: rare
    duration_cycles:
    - 2
    - 4
    description: Occasionally assert rst_n while a transaction is in progress to verify
      the controller recovers to the reset/idle state and that a subsequent transaction
      still matches the (reset) reference model.
  pass_criteria: 'Every randomized transaction must match the reference model: done
    pulses exactly once per started transaction, busy returns to 0, ack_error=1 if
    and only if slave_addr != 0x50, and read_data matches the reference model result
    (memory value for supported reads, 0x00 for unsupported addresses). No mismatches
    allowed; all generated stimulus must remain within 7-bit slave addresses and 8-bit
    register/data values.'
functional_coverage:
  covergroups:
  - name: transaction_cg
    description: 'Sampled on each done pulse to cover the transaction space: direction,
      slave-address class, register-address class, write-data patterns, and acknowledgment
      outcome.'
    clk: clk
    sample_on: done
    bins:
    - name: rw_cp
      variable: rw
      bins:
      - name: write
        range:
        - 0
        - 0
        expression: null
      - name: read
        range:
        - 1
        - 1
        expression: null
    - name: slave_addr_cp
      variable: slave_addr
      bins:
