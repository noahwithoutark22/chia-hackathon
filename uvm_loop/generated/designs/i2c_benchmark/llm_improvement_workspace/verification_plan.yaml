scoreboard_reference_model_strategy:
  description: A Python scoreboard mirrors the DUT's byte-addressed memory using I2CReferenceModel
    from the reference model file. The scoreboard tracks every accepted transaction
    (sampled on start while idle), replays the same (rw, slave_addr, reg_addr, write_data)
    stimulus through the model, and compares the model result against DUT outputs
    sampled on the done pulse. The reference model is reset in lockstep with the DUT.
  architecture:
  - type: reference_model_mirror
    description: I2CReferenceModel instance maintains expected memory state and produces
      expected done, busy_after, ack_error, and read_data for each transaction. reset()
      is invoked whenever the DUT is reset so both memories start from the same state.
  - type: transaction_scoreboard
    description: 'A FIFO of in-flight transactions keyed by issue order. When start
      is accepted (busy transitions 0->1), the transaction parameters are recorded
      and the reference result is enqueued. When done pulses, the DUT outputs are
      sampled and compared against the dequeued reference result: ack_error always;
      read_data for supported-address reads; done and busy state for every transaction.
      write_data is compared through later reads of the affected register (memory
      consistency check).'
  pass_criteria: For every transaction, ack_error and completion behavior must match
    the reference model exactly. For reads of supported addresses, read_data must
    equal the reference model's memory value (0x00 if never written). For transactions
    to unsupported addresses, read_data must be 0x00 per specification. Any mismatch
    is a failure. No transaction may be left uncompleted in the FIFO at end of test.
  error_reporting: On mismatch, report the transaction index, the issued stimulus
    (rw, slave_addr, reg_addr, write_data), the reference-model expected values (ack_error,
    read_data), the observed DUT values, and the cycle time of the done pulse. Memory-state
    mismatches are reported with the affected register address.
useful_assertions:
- name: reset_clears_outputs
  description: Immediately after reset release, busy, done, ack_error must be 0 and
    read_data must be 0x00.
  severity: error
  assertion: 'At the first clock edge after deasserting rst_n: busy == 0 && done ==
    0 && ack_error == 0 && read_data == 0x00'
  note: Enforces the specification reset contract on the DUT outputs.
- name: busy_deasserted_after_done
  description: busy must be deasserted in the same cycle the done pulse is observed.
  severity: error
  assertion: done == 1 implies busy == 0
  note: The completion state drives busy low and done high together, matching the
    reference model's busy_after=0 behavior.
- name: done_pulses_exactly_one_cycle
  description: done must never be high for more than one consecutive clock cycle.
  severity: error
  assertion: (done == 1) at cycle N implies (done == 0) at cycle N+1
  note: Guards the completion-pulse behavior required by the specification.
- name: ack_error_implies_unsupported_address
  description: A transaction that completes with ack_error=1 must have been addressed
    to a slave other than 0x50.
  severity: error
  assertion: 'On done with ack_error == 1: slave_addr != 0x50'
  note: The supported address 0x50 must never produce a NACK.
- name: no_simultaneous_start_done
  description: done and start must not be asserted simultaneously; transactions are
    defined by a done pulse distinct from request cycles.
  severity: warning
  assertion: never (done == 1 && start == 1)
  note: Keeps transactions well separated in the scoreboard's FIFO ordering.
- name: scl_sda_released_in_idle
  description: SCL and SDA must not be actively driven low while the controller is
    idle.
  severity: warning
  assertion: 'When busy == 0 (and not during an active transaction): scl != 0 and
    sda != 0, where 0 indicates an actively driven low line; released lines read 1
    under pull-up.'
  note: Verifies the open-drain release behavior for both bus lines between transactions.
discrepancies:
- id: I2C_DISC_001
  severity: major
  title: RTL does not drive read_data to 0x00 for unsupported-address transactions
  rtl: In the ACCESS state, for active_addr != 0x50 the RTL only asserts ack_error;
    read_data is left unchanged and retains its previous value for the duration of
    the transaction.
  spec: Specification section 4 states that a transaction addressed to any address
    other than 0x50 shall complete with read_data = 0x00 for the transaction result.
    The Python reference model likewise returns read_data=0 for unsupported slave
    addresses.
  impact: If a previous supported read left a non-zero read_data, an unsupported transaction
    will leave that stale value on read_data instead of 0x00. The reference-model
    check (read_data expected 0x00) will flag this behavior as a DUT defect.
  recommendation: The verification environment must keep the specification/reference
    model expectation (read_data == 0x00 after unsupported-address transactions) as
    the oracle. Do not weaken the check to match the RTL.
- id: I2C_DISC_002
  severity: minor
  title: RTL does not clear the internal memory on reset; reference model does
  rtl: The RTL memory array [0:255] is not written during reset; previously stored
    bytes persist across a reset event.
  spec: The specification's reset section lists busy/done/ack_error/read_data and
    bus release but does not state whether the byte memory is cleared. The reference
    model's reset() clears all memory.
  impact: When the scoreboard resets the reference model in lockstep with the DUT,
    a read of a previously written register after reset will return 0x00 from the
    reference model but a stale value from the RTL, producing a mismatch.
  recommendation: The specification does not explicitly resolve memory reset behavior,
    so the ambiguity is recorded here. The environment resets the reference model
    in lockstep with the DUT (treating memory as cleared on reset) and reports any
    read-after-reset stale-value behavior as a DUT defect rather than silently accepting
    it.
