weaknesses:
- id: W1
  severity: high
  category: oracle_weakening
  title: read_data==0x00 oracle for unsupported-address transactions was removed to
    match the RTL
  affected_tests:
  - I2C07UnsupportedSlave00Test
  - I2C08UnsupportedSlave01Test
  - I2C09UnsupportedSlave7FTest
  - I2CCornerCaseTest
  - I2CRandomizedTest
  evidence:
  - tb/scoreboard.py _on_monitor_item gates read_data comparison with compare_read_data
    = (int(item.slave_addr) == SUPPORTED_SLAVE_ADDR and int(item.rw) == 1), so read_data
    is never checked for unsupported-address transactions even though spec section
    4 and the reference model mandate read_data=0x00 for them.
  - tb/sequences.py I2CRandomizedSequence._random_transaction applies the identical
    gating, so the randomized self-check also never compares read_data on unsupported
    transactions.
  - verification_plan.yaml I2C_DISC_001 recommendation explicitly says 'Do not weaken
    the check to match the RTL'; tb/CONTRACT.md section 12.6 claims the scoreboard
    and randomized sequence 'still require read_data == 0x00 for unsupported-address
    transactions' and that I2CRandomizedTest is the detector for I2C_DISC_001, directly
    contradicting the code.
  - 'simulation_result.json: all 16 tests pass with scoreboard_mismatches=0 including
    the unsupported-address scenarios and I2CRandomizedTest (58 items, 58 matched).'
  likely_cause: The generated environment adapted the oracle to the observed DUT behavior
    (stale read_data retained on unsupported transactions) instead of keeping the
    specification/reference-model expectation, so the regression stays green. The
    directed unsupported-address checks (read_data=0x00) pass trivially because they
    always run the unsupported transaction immediately after a fresh reset when read_data
    is already 0.
  investigation_targets:
  - tb/scoreboard.py (_on_monitor_item)
  - tb/sequences.py (I2CRandomizedSequence._random_transaction)
  recommended_action: Restore the reference-model read_data==0x00 comparison for unsupported-address
    transactions in both the scoreboard and the randomized self-check, and add a random-sequence
    state where a non-zero read_data precedes an unsupported transaction so the spec
    requirement is actually exercised; do not adapt the oracle to the RTL.
  confidence: high
- id: W2
  severity: high
  category: open_drain_unverified
  title: SCL/SDA open-drain START/access-phase behavior is not verified (vacuous bus
    checks)
  affected_tests:
  - I2C12OpenDrainBusReleaseTest
  - I2CRandomizedTest
  evidence:
  - tb/test_top.py _drive_i2c_pullups continuously forces dut.scl=1 and dut.sda=1
    every cycle (a strong drive, not a weak pull-up), so the lines always read '1'
    and scl_is_released()/sda_is_released() (which treat '1' as released) can never
    observe the DUT's high-impedance state; a DUT that never drives the bus at all
    is indistinguishable from a correct one.
  - tb/sequences.py OpenDrainBusReleaseSeq docstring and code state that driven START-like/access-phase
    patterns 'cannot be observed here and are intentionally not asserted', and the
    sequence only checks idle release before/after the transaction.
  - verification_plan.yaml I2C_12 defines check_bus_start_phase (sda driven low during
    START-like) and check_bus_access_phase (scl driven low during access) actions
    that have no implementation in the bench; spec section 7 (START-like transfer,
    STOP-like condition) is thereby unverified.
  - 'simulation_result.json: I2C12 status=pass with 0 warnings and 0 scoreboard mismatches.'
  likely_cause: The environment's 'pull-up' is a continuous strong '1' drive that
    masks the DUT's open-drain drive, and the observed RTL behavior was used to justify
    dropping the plan's phase checks.
  investigation_targets:
  - tb/test_top.py (_drive_i2c_pullups)
  - tb/sequences.py (OpenDrainBusReleaseSeq.body)
  recommended_action: Model the pull-ups with true tri-state/weak resolution (released
    lines read z or high via pull-up, DUT pull-low observable), then implement the
    plan's START-like (sda low) and access-phase (scl low) checks and keep the post-completion
    release check meaningful.
  confidence: high
- id: W3
  severity: medium
  category: unknown_value_masking
  title: X/Z output values are silently coerced to 0, so undriven outputs pass as
    0x00
  affected_tests:
  - I2C01ResetBehaviorTest
  - I2C02WriteThenReadBackTest
  - I2C03ReadBeforeWriteTest
  - I2C04RepeatedWritesTest
  - I2C05BoundaryAddr00Test
  - I2C06BoundaryAddrFFTest
  - I2C07UnsupportedSlave00Test
  - I2C08UnsupportedSlave01Test
  - I2C09UnsupportedSlave7FTest
  - I2C10StartWhileBusyTest
  - I2C11DonePulseWidthTest
  - I2C12OpenDrainBusReleaseTest
  - I2C13MultiRegIndependenceTest
  - I2C14BackToBackTest
  - I2CCornerCaseTest
  - I2CRandomizedTest
  evidence:
  - tb/dut_helper.py _to_int replaces 'x'/'X'/'z'/'Z' bits with 0 before decoding
    ('X/Z bits are stripped to 0 deterministically'), and every observer (monitor,
    scoreboard, sequences, assertions, coverage) samples outputs through it / sample_outputs().
  - The reference model and spec expect read_data=0x00 for never-written reads and
    unsupported-address transactions, so an undriven (X/Z) read_data sampled at the
    done pulse is scored as a correct 0x00; a DUT that fails to drive read_data would
    pass every test.
  likely_cause: A determinism guard chosen to avoid X-propagation crashes that instead
    maps unknown outputs onto the most frequently expected value (0).
  investigation_targets:
  - tb/dut_helper.py (_to_int, sample_outputs)
  - tb/monitor.py (_wait_done_pulse)
  - tb/scoreboard.py (_on_monitor_item)
  recommended_action: Treat non-0/1 (X/Z) output samples, at least read_data at the
    done pulse, as an error/violation instead of coercing them to 0, so undriven outputs
    fail loudly rather than matching the model.
  confidence: medium
- id: W4
  severity: medium
  category: vacuous_assertion
  title: Two of the six always-running assertion checkers cannot fail in this environment
  affected_tests:
  - I2C01ResetBehaviorTest
  - I2C02WriteThenReadBackTest
  - I2C03ReadBeforeWriteTest
  - I2C04RepeatedWritesTest
  - I2C05BoundaryAddr00Test
  - I2C06BoundaryAddrFFTest
  - I2C07UnsupportedSlave00Test
  - I2C08UnsupportedSlave01Test
  - I2C09UnsupportedSlave7FTest
  - I2C10StartWhileBusyTest
  - I2C11DonePulseWidthTest
  - I2C12OpenDrainBusReleaseTest
  - I2C13MultiRegIndependenceTest
  - I2C14BackToBackTest
  - I2CCornerCaseTest
  - I2CRandomizedTest
  evidence:
  - tb/assertions.py _check_no_simultaneous_start_done itself documents that the driver
    only asserts start while idle and edge-sampling sees start==0 at the done-pulse
    edge, 'so this rule holds in normal operation' - the warning can never fire with
    this stimulus model.
  - tb/assertions.py _check_scl_sda_released_in_idle can never fire because tb/test_top.py
    keeps scl/sda forced to 1 and scl_is_released()/sda_is_released() classify '1'
    as released (same root cause as W2).
  - 'simulation_result.json: every test reports ''I2CAssertions: ... violations ->
    none'', which creates false confidence that two plan assertions are actively protecting
    behavior.'
  likely_cause: Warning checkers were emitted without a stimulus model that could
    violate them, and the bus checker was annulled by the environment's continuous
    high drive of the open-drain lines.
  investigation_targets:
  - tb/assertions.py (_check_no_simultaneous_start_done, _check_scl_sda_released_in_idle)
  recommended_action: Replace no_simultaneous_start_done with an enforceable condition
    (e.g., monitor-level start/done ordering or a latch-overlap check) or reclassify
    it, and rework the bus-idle checker to sample the DUT's true drive state (see
    W2).
  confidence: high
- id: W5
  severity: medium
  category: reset_memory_evasion
  title: DUT-vs-model memory divergence across reset (I2C_DISC_002) is engineered
    to be undetectable
  affected_tests:
  - I2C03ReadBeforeWriteTest
  - I2C10StartWhileBusyTest
  - I2CCornerCaseTest
  - I2CRandomizedTest
  evidence:
  - tb/sequences.py RESERVED_NEVER_WRITTEN (0x20/0x2A/0x42) exists because 'the RTL
    memory is *not* cleared by reset while the reference model's is ... To keep every
    expectation valid' - i.e., no scenario writes a register, resets, and then reads
    the same register to compare against the reset model.
  - tb/sequences.py I2CRandomizedSequence restricts supported reads to registers written
    after the most recent reset and, after reset injection (_inject_reset_during_transaction),
    clears the model and _written set while never scoring the aborted transaction;
    DUT/model memory divergence after reset is therefore never probed.
  - verification_plan.yaml I2C_DISC_002 documents that the environment should report
    read-after-reset stale-value behavior as a DUT defect rather than silently accepting
    it; the bench instead avoids the triggering stimulus.
  - 'simulation_result.json: I2CCornerCaseTest observed 11 resets with 19 items and
    0 mismatches, and no write-to-reset-to-read-same-address sequence exists in any
    test.'
  likely_cause: The stimulus was constrained so the known RTL memory-persistence behavior
    can never cause a mismatch, which simultaneously makes the documented discrepancy
    unobservable.
  investigation_targets:
  - tb/sequences.py (RESERVED_NEVER_WRITTEN, I2CRandomizedSequence._random_item, _inject_reset_during_transaction)
  - tb/scoreboard.py (_watch_reset)
  recommended_action: Add a dedicated scenario that writes a register, asserts reset,
    releases it, reads the same register, and compares against the reset reference
    model (0x00) so the memory-reset semantics are characterized and the documented
    discrepancy is detected (or explicitly waived) instead of dodged.
  confidence: medium
- id: W6
  severity: low
  category: coverage_fragmentation
  title: Functional coverage is per-test and never aggregated; randomized stream misses
    all write-data pattern bins
  affected_tests:
  - I2CRandomizedTest
  evidence:
  - 'simulation_result.json I2CRandomizedTest coverage report: top.transaction_cg.write_data_cp
    coverage=0, size=4 (no sample of 0x00/0xFF/0x55/0xAA); read_data_cp coverage=1,
    size=4; rw_x_reg_addr coverage=2, size=6; overall 55.6%.'
  - Each of the 16 tests runs as a separate simulation with a fresh coverage_db, and
    per-test percentages range 0.0% (I2C01) to 88.9% (I2CCornerCaseTest); no aggregate/suite-level
    coverage figure is produced anywhere in simulation_result.json, so coverage closure
    cannot be enforced for the regression.
  - tb/coverage.py samples coverage only from the per-simulation monitor stream (one
    done-pulse sample per completed transaction).
  likely_cause: With uniform-random write_data the four fixed pattern bins each have
    about 1.6% hit probability, so a 58-transaction random stream is unlikely to hit
    any; the per-process coverage database prevents merging across tests.
  investigation_targets:
  - tb/coverage.py (sample_transaction, _classify_write_data)
  - tb/sequences.py (I2CRandomizedSequence._random_item)
  recommended_action: Bias or constrain randomized write_data toward the plan's pattern
    bins (0x00/0xFF/0x55/0xAA), and merge coverage across the regression (single simulation
    context or merged coverage DBs) so a suite-level functional-coverage percentage
    can be computed and enforced.
  confidence: medium
