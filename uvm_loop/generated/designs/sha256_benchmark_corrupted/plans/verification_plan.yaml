    sequence:
    - action: reset
      signals: {}
      cycles: 5
      description: Hold reset active for 5 cycles
    - action: wait
      signals: {}
      cycles: 2
      description: Release reset and wait for idle
    - action: check
      signals:
        done: 1
        digest: 0
      cycles: null
      description: Verify outputs at reset values (RTL drives done=1 on reset per
        DISC-001)
  expected: null
  note: ''
- id: empty_message
  name: empty_message
  description: Known-answer test for empty string (SHA-256 of "")
  priority: high
