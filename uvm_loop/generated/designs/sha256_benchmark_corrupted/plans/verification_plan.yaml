dut:
  name: sha256
  file: sha256.sv
  description: SHA-256 single-block compression function implementing FIPS 180-4 for
    one 512-bit padded message block
parameters: []
clock_and_reset:
  clock:
    name: clk
    type: posedge
    description: Rising-edge clock for all sequential logic
  reset:
    name: rst_n
    polarity: active-low
    type: asynchronous
    description: Active-low asynchronous reset initializes internal hash state, message
      schedule, round counter, and control signals
    reset_value:
      done: 1
      digest: 0
      busy: 0
      round: 0
      H0: 32'h6a09e667
      H1: 32'hbb67ae85
      H2: 32'h3c6ef372
      H3: 32'ha54ff53a
      H4: 32'h510e527f
      H5: 32'h9b05688c
      H6: 32'h1f83d9ab
      H7: 32'h5be0cd19
ports:
  inputs:
  - name: clk
    width: 1
    description: Rising-edge clock
    type: null
    latency: null
  - name: rst_n
    width: 1
    description: Active-low asynchronous reset
    type: null
    latency: null
  - name: start
    width: 1
    description: Pulse to begin a new SHA-256 compression; captures block on same
      cycle
    type: null
    latency: null
  - name: block
    width: 512
    description: 512-bit pre-padded message block in big-endian word order (block[511:480]
      = first 32-bit word)
    type: null
    latency: null
  outputs:
  - name: done
    width: 1
    description: Asserted when digest is valid; RTL drives done=1 continuously after
      reset (DISC-001), not a one-cycle pulse
    type: null
    latency: null
  - name: digest
    width: 256
    description: 256-bit SHA-256 digest = H0||H1||H2||H3||H4||H5||H6||H7 (each word
      big-endian)
    type: null
    latency: null
  inouts: []
functional_behavior:
  description: 'The RTL has multiple fatal bugs (documented in discrepancies) and
    does not implement a correct SHA-256 compression function. On reset: internal
    state (H0-H7, message schedule W, round counter, busy, digest) initializes to
    SHA-256 initial hash values; done is set to 1 (DISC-001). On start pulse: captures
    512-bit block, reinitializes working variables a-h to initial hash values, loads
    first 16 words of message schedule with byte-swapped endianness conversion AND
    word-order reversal (W[0] gets block[31:0] i.e. last word), sets busy=1, round=1.
    While busy: each cycle computes a round using message schedule W, round constants
    K, and SHA-256 functions (Ch, Maj, BigSigma0, BigSigma1, SmallSigma0, SmallSigma1)
    but all functions have incorrect constants/implementations (DISC-002 through DISC-007,
    DISC-010, DISC-011). Round counter starts at 1 and increments by 2 (DISC-008,
    DISC-014), so it sequences 1, 3, 5...63, 65... The completion check `if (round
    == 62)` (line 199) is never true, so the digest assignment (lines 200-209) never
    executes, busy stays 1 forever (DISC-013), and done remains 1 continuously. Start
    is NOT gated by busy (new discrepancy); a new start while busy restarts the transaction.'
  reset_behavior: Active-low asynchronous reset sets done=1, clears digest=0, busy=0,
    round=0; initializes H0-H7 to SHA-256 IVs; zeros working variables a-h and message
    schedule W. RTL drives done=1 on reset and on every non-reset cycle (line 126);
    done never pulses. Verification must use fixed-cycle latency (64 rounds + margin)
    to determine transaction completion, not wait for done.
  reference_model:
    language: python
    file: sha256_reference_model.py
    function: block_to_digest
    logic: Uses Python hashlib.sha256 as golden reference. Accepts 64-byte padded
      block, validates canonical SHA-256 padding structure, extracts original message,
      returns hashlib.sha256(message).digest().
    latency: 64
