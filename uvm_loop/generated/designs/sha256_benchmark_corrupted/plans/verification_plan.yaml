corner_cases:
- name: maximum_message_length
  description: Message of exactly 55 bytes (maximum that fits in one block)
  expected: Digest computed correctly per reference model
- name: block_with_all_ones
  description: Input block of all 1s (not a valid padded message but exercises all
    datapaths)
  expected: Deterministic digest per reference model
- name: block_with_alternating_pattern
  description: Input block with alternating 0xAA/0x55 pattern
  expected: Deterministic digest per reference model
- name: reset_during_processing
  description: Assert reset while busy processing a block
  expected: DUT returns to idle state, done=1 (RTL behavior), digest=0
- name: start_deasserted_same_cycle
  description: Start pulse lasts only one cycle (minimum pulse width)
  expected: Transaction accepted and completes normally
- name: block_changes_during_processing
  description: Block input changes after start while busy
  expected: No effect on current transaction (block captured at start)
randomized_testing_strategy:
  description: Generate random messages < 56 bytes, pad per SHA-256, drive to DUT,
    compare digest to hashlib
  constraints:
  - variable: message_length
    range:
    - 0
    - 55
  - variable: message_bytes
    range:
    - 0
    - 255
  injection:
  - type: reset_during_processing
    frequency: '0.1'
    duration_cycles:
    - 1
    - 3
    description: Randomly inject reset during computation
  - type: back_to_back
    frequency: '0.2'
    duration_cycles: null
    description: Randomly start new transaction immediately after done
  pass_criteria: All directed and randomized tests produce digests matching reference
    model; done asserts after each transaction (RTL holds done=1 continuously); reset
    sets done=1, digest=0
functional_coverage:
  covergroups:
  - name: message_length_cg
    description: Coverage of input message lengths in bits (derived from block[63:0]
      length field at start)
    clk: clk
    sample_on: start
    bins:
    - name: msg_len_bits
      variable: block[63:0]
      bins:
      - name: zero_len
        range:
        - 0
        - 0
        expression: null
      - name: short_len
        range:
        - 1
        - 128
        expression: null
      - name: medium_len
        range:
        - 129
        - 256
        expression: null
      - name: long_len
        range:
        - 257
        - 384
        expression: null
      - name: max_len
        range:
        - 385
        - 440
        expression: null
    crosses: []
  - name: control_signals_cg
    description: Coverage of control signal transitions
    clk: clk
    sample_on: clk
    bins:
    - name: start_pulse
      variable: start
      bins:
      - name: asserted
        range:
        - 1
        - 1
        expression: null
      - name: deasserted
        range:
        - 0
        - 0
        expression: null
    - name: done_pulse
      variable: done
      bins:
      - name: asserted
        range:
        - 1
        - 1
        expression: null
      - name: deasserted
        range:
        - 0
        - 0
        expression: null
    crosses:
    - name: start_done_cross
      variables:
      - start
      - done
      description: Cross coverage of start and done timing
scoreboard_reference_model_strategy:
  description: Scoreboard compares DUT digest against Python hashlib reference for
    each transaction
  architecture:
  - type: in_order
    description: Transactions complete in order; scoreboard matches each transaction
      (start pulse) to corresponding reference digest; done is always 1 after reset
      (RTL behavior)
  pass_criteria: Every start pulse followed by digest matching reference model after
    expected latency; no extra/missing transactions
  error_reporting: Report transaction ID, input block, expected digest, actual digest,
    and cycle of mismatch
useful_assertions:
- name: digest_holds_until_next
  description: Digest remains stable between transactions
  severity: error
  assertion: (!start && $past(start, 1, 70)) |=> (digest == $past(digest))
  note: Digest should hold value until next transaction completes; qualified with
    past start to avoid reset
- name: transaction_completes_within_latency
  description: After valid start, digest becomes valid within expected latency (checked
    via cycle count, not done)
  severity: error
  assertion: 'start & !$past(start) |-> ##[64:70] (digest != 0)'
  note: DUT should produce non-zero digest within 64-70 cycles after start; qualified
    to avoid reset
- name: reset_sets_done_high
  description: Reset asserts done=1 (RTL behavior per DISC-001)
  severity: error
  assertion: '!rst_n |-> (done == 1)'
  note: RTL drives done=1 on reset; this assertion documents actual RTL behavior
discrepancies:
- id: DISC-001
  severity: high
  title: Reset behavior mismatch - done initializes to 1 instead of 0
  rtl: On reset, done <= 1'b1 (line 100)
  spec: Reset shall clear done to 0 (Section 5, spec.md)
  impact: Scoreboard may see spurious done pulse at time zero; verification must wait
    for first real done pulse after start
  recommendation: Fix RTL to set done <= 1'b0 on reset
- id: DISC-002
  severity: critical
  title: Ch function implementation incorrect
  rtl: Ch = (x & y) ^ (x & z) (line 56)
  spec: Ch(x,y,z) = (x & y) ^ (~x & z) per FIPS 180-4
  impact: All round computations produce incorrect results; no test vector will pass
  recommendation: Fix Ch function to (x & y) ^ (~x & z)
- id: DISC-003
  severity: critical
  title: Maj function implementation incorrect
  rtl: Maj = (x & y) ^ (x & z) (line 64)
  spec: Maj(x,y,z) = (x & y) ^ (x & z) ^ (y & z) per FIPS 180-4
  impact: All round computations produce incorrect results
  recommendation: Fix Maj function to (x & y) ^ (x & z) ^ (y & z)
- id: DISC-004
  severity: critical
  title: BigSigma0 (Sigma0) rotation constants wrong
  rtl: rotr(x,3) ^ rotr(x,12) ^ rotr(x,21) (line 70)
  spec: ROTR2(x) ^ ROTR13(x) ^ ROTR22(x) (Section 3, spec.md)
  impact: Incorrect Sigma0 values in all rounds
  recommendation: Fix to rotr(x,2) ^ rotr(x,13) ^ rotr(x,22)
- id: DISC-005
  severity: critical
  title: BigSigma1 (Sigma1) rotation constants wrong
  rtl: rotr(x,7) ^ rotr(x,12) ^ rotr(x,24) (line 76)
  spec: ROTR6(x) ^ ROTR11(x) ^ ROTR25(x) (Section 3, spec.md)
  impact: Incorrect Sigma1 values in all rounds
  recommendation: Fix to rotr(x,6) ^ rotr(x,11) ^ rotr(x,25)
- id: DISC-006
  severity: critical
  title: SmallSigma0 (sigma0) rotation/shift constants wrong
  rtl: rotr(x,8) ^ rotr(x,17) ^ (x >> 2) (line 82)
  spec: ROTR7(x) ^ ROTR18(x) ^ SHR3(x) (Section 3, spec.md)
  impact: Incorrect message schedule expansion for rounds 16-63
  recommendation: Fix to rotr(x,7) ^ rotr(x,18) ^ (x >> 3)
- id: DISC-007
  severity: critical
  title: SmallSigma1 (sigma1) rotation/shift constants wrong
  rtl: rotr(x,16) ^ rotr(x,20) ^ (x >> 9) (line 88)
  spec: ROTR17(x) ^ ROTR19(x) ^ SHR10(x) (Section 3, spec.md)
  impact: Incorrect message schedule expansion for rounds 16-63
  recommendation: Fix to rotr(x,17) ^ rotr(x,19) ^ (x >> 10)
- id: DISC-008
  severity: critical
  title: Round counter increments by 2 instead of 1
  rtl: round <= round + 2'd2 (line 214)
  spec: One SHA-256 round per clock cycle (Section 5, spec.md)
  impact: Only 32 rounds executed instead of 64; K indexing also wrong
  recommendation: Change to round <= round + 1; start round at 0, run 64 cycles
- id: DISC-009
  severity: critical
  title: Round constant K indexing incorrect
  rtl: K[(round+1) & 7'd63] (line 176)
  spec: K[round] for round 0..63
  impact: Wrong round constants used; with round increment of 2, accesses K[1], K[3],
    K[5]...
  recommendation: Use K[round] with round 0..63
- id: DISC-010
  severity: critical
  title: t2 computation uses BigSigma1 instead of BigSigma0 and wrong Maj arguments
  rtl: next_t2 = BigSigma1(a) - Maj(a,c,b) (line 179)
  spec: t2 = Sigma0(a) + Maj(a,b,c)
  impact: Incorrect state update for a,b registers
  recommendation: Fix to BigSigma0(a) + Maj(a,b,c)
- id: DISC-011
  severity: critical
  title: Working variable state updates completely wrong
  rtl: na = next_t1 ^ next_t2; nb=b; nc=c; nd=b; ne=d+next_t2; nf=f; ng=g; nh=h (lines
    181-188)
  spec: a=t1+t2; b=a; c=b; d=c; e=d+t1; f=e; g=f; h=g
  impact: No correct SHA-256 state evolution; digest will be wrong
  recommendation: Implement correct state rotation per FIPS 180-4
- id: DISC-012
  severity: critical
  title: Digest computation uses wrong initial values and working variables
  rtl: digest = {IV0+nb, IV1+nb, IV2+nb, IV3+nc, IV4+nf, IV5+nf, IV6+ng, IV7+ng} (lines
    200-209)
  spec: digest = H0+H0_initial || ... || H7+H7_initial where H are final working vars
    (Section 6, spec.md)
  impact: Final digest bears no relation to correct SHA-256 output
  recommendation: 'Feed forward final a-h into H0-H7: digest = {H0+a, H1+b, H2+c,
    H3+d, H4+e, H5+f, H6+g, H7+h}'
- id: DISC-013
  severity: medium
  title: Busy remains asserted after done
  rtl: busy <= 1'b1 at completion (line 211)
  spec: DUT should return to idle (busy=0) after done (Section 5, spec.md)
  impact: DUT appears permanently busy; cannot accept new transactions
  recommendation: Set busy <= 1'b0 when done asserts
- id: DISC-014
  severity: medium
  title: Round initialization starts at 1 instead of 0
  rtl: round <= 7'd1 on start (line 157)
  spec: 64 rounds numbered 0..63
  impact: Off-by-one in round counting; combined with +2 increment executes rounds
    1,3,5...63
  recommendation: Initialize round to 0; increment by 1; run while round < 64
- id: DISC-015
  severity: low
  title: Message schedule loading uses byte-swapped endianness conversion AND reverses
    word order
  rtl: 'W[i] <= {message_word[7:0], message_word[15:8], message_word[23:16], message_word[31:24]}
    with message_word = block[i*32 +: 32] (lines 129-137)'
  spec: Input block already in big-endian word order (block[511:480] = first word)
    (Section 2, spec.md)
  impact: Loop index i=0..15 loads block[31:0] (word 15) into W[0], block[63:32] (word
    14) into W[1], ... block[511:480] (word 0) into W[15] -- reversing word order
    -- then byte-swaps each word. If testbench provides correctly formatted block,
    this corrupts message schedule.
  recommendation: 'Remove byte swap and word-order reversal; load W[i] = block[511-i*32
    -: 32] directly'
- id: DISC-016
  severity: low
  title: Localparam K array defined but not configurable
  rtl: K defined as localparam logic [31:0] K [0:63]
  spec: Constants per FIPS 180-4 (fixed)
  impact: None for verification; values match FIPS 180-4
  recommendation: No change needed; values are correct
- id: DISC-017
  severity: medium
  title: Start signal not gated by busy
  rtl: if (start) executes regardless of busy state (line 128); else if (busy) is
    separate branch (line 160)
