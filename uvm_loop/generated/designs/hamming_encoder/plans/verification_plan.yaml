dut:
  name: hamming_encoder
  file: benchmarks/hamming_encoder/hamming_encoder.sv
  description: Parameterized Hamming(N,K) encoder with optional SECDED overall-parity
    bit. Given DATA_WIDTH data bits it automatically derives the minimum required
    parity bits and builds the Hamming codeword using the classic power-of-two-position
    construction; with SECDED=1 an extra overall even-parity bit is added for double-error
    detection. The DUT is purely combinational and has no clock or reset inputs.
parameters:
- name: DATA_WIDTH
  default: '4'
  description: Number of input data bits (K). Must be > 0. PARITY_BITS (smallest R
    such that 2**R >= DATA_WIDTH + R + 1), BASE_WIDTH (DATA_WIDTH + PARITY_BITS) and
    CODE_WIDTH (BASE_WIDTH + 1 if SECDED else BASE_WIDTH) are derived at elaboration
    time and are not directly settable.
  test_values:
  - 1
  - 4
  - 8
  - 11
  - 16
- name: SECDED
  default: '0'
  description: When 1, an extra overall even-parity bit (XOR of the whole base Hamming
    codeword) is placed at code_out[0] and the base codeword is shifted up by one
    bit, turning the code into a SECDED Hamming(N+1,K) code.
  test_values:
  - 0
  - 1
clock_and_reset:
  clock:
    name: clk
    type: posedge
    description: Testbench reference clock used only to sequence stimulus application
      and output sampling. The DUT itself is purely combinational and has no clock
      input; code_out settles combinationally after data_in changes.
  reset:
    name: tb_reset
    polarity: active-low
    type: asynchronous
    description: Testbench-only reset used to initialize the verification environment
      (predictor, scoreboard, functional coverage). The DUT has no reset port; code_out
      is never affected by reset.
    reset_value: {}
ports:
  inputs:
  - name: data_in
    width: DATA_WIDTH
    description: Data word to encode. Any bit pattern within the declared width is
      valid; the DUT performs no input validation beyond its width.
    type: logic
    latency: null
  outputs:
  - name: code_out
    width: CODE_WIDTH
    description: Encoded Hamming codeword (SECDED=0) or SECDED Hamming codeword (SECDED=1).
      Driven combinationally; code_out[0] is Hamming position 1 for SECDED=0 and the
      overall parity bit for SECDED=1.
    type: logic
    latency: 0
  inouts: []
functional_behavior:
  description: 'Purely combinational Hamming encoder. Codeword positions are numbered
    1..BASE_WIDTH (1-indexed). Positions that are exact powers of two (1, 2, 4, 8,
    ...) hold parity bits; every other position holds a data bit taken in order from
    data_in[0] upward. Each parity bit at position 2**p is the XOR of every position
    pos (excluding 2**p itself) for which (pos & 2**p) != 0. With SECDED=1 an additional
    overall even-parity bit (XOR of all base codeword bits) is placed at code_out[0]
    and the base codeword is shifted up by one bit. Bit mapping: non-SECDED, Hamming
    position pos maps to code_out[pos-1]; SECDED, position pos maps to code_out[pos].'
  reset_behavior: The DUT is purely combinational and has no reset input; code_out
    is always a pure function of the current data_in. tb_reset in this plan only reinitializes
    the verification environment and must never be used as an oracle for clearing
    outputs.
  reference_model:
    language: python
    file: benchmarks/hamming_encoder/ref_model.py
    function: 'hamming_encode(data_in: int, data_width: int, secded: bool = False)
      -> (code_out: int, HammingParams)'
    logic: 'Bit-exact implementation of the spec algorithm: (1) scatter data_in bits
      into non-power-of-two positions 1..BASE_WIDTH in order; (2) fill each parity
      position 2**p with the XOR of all positions pos != 2**p where (pos & 2**p) !=
      0; (3) if secded, overall parity = XOR of all base codeword bits becomes bit
      0 and the base codeword shifts up by one, otherwise position pos maps to code
      bit pos-1. HammingParams.compute(data_width, secded) returns parity_bits, base_width,
      code_width.'
    latency: 0
directed_test_scenarios:
- id: TC1
  name: reset_and_zero_initial_state
  description: DATA_WIDTH=4, SECDED=0 (Hamming(7,4)). Assert the testbench reset to
    clear the verification environment, then drive the all-zero data word and confirm
    the all-zero combinational codeword. The DUT has no reset port, so this scenario
    only validates environment initialization plus zero-data encoding.
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 2
      description: Assert tb_reset (active-low) for 2 clock cycles to clear the predictor,
        scoreboard and coverage state.
    - action: deassert_reset
      signals: {}
      cycles: 1
      description: Release tb_reset.
    - action: drive
      signals:
        data_in: 4'b0000
      cycles: null
      description: Drive the all-zero data word.
    - action: wait
      signals: {}
      cycles: 1
      description: Wait one testbench clock for combinational settle before sampling.
    - action: check
      signals:
        code_out: 7'b0000000
      cycles: null
      description: Confirm the all-zero Hamming(7,4) codeword.
  expected: 'SECDED=0, DATA_WIDTH=4: data_in=0 -> code_out == 7''b0000000.'
  note: tb_reset is environment-only; code_out is not reset-dependent.
- id: TC2
  name: spec_example_hamming_74
  description: Reproduce the spec section 4.1 worked example for DATA_WIDTH=4, SECDED=0.
  priority: high
  stimulus:
    sequence:
    - action: drive
      signals:
        data_in: 4'b0101
      cycles: null
      description: Spec section 4.1 input (data_in = 0b0101).
    - action: wait
      signals: {}
      cycles: 1
      description: Allow combinational settle.
    - action: check
      signals:
        code_out: 7'b0101101
      cycles: null
      description: Spec section 4.1 expected codeword.
  expected: code_out == 7'b0101101 (0x2D); p1=1, p2=1, p4=1 for data_in=0b0101 (d1=1,
    d2=0, d3=1, d4=0).
  note: Verifies data-bit placement (data_in[0] at Hamming position 3, data_in[1]
    at position 5, ...) and parity cover sets for a non-trivial vector.
- id: TC3
  name: spec_example_hamming_84_secded
  description: Reproduce the spec section 4.2 worked example for DATA_WIDTH=4, SECDED=1.
  priority: high
  stimulus:
    sequence:
    - action: drive
      signals:
        data_in: 4'b0101
      cycles: null
      description: Same input as TC2, SECDED mode on.
    - action: wait
      signals: {}
      cycles: 1
      description: Allow combinational settle.
    - action: check
      signals:
        code_out: 8'b01011010
      cycles: null
      description: Spec section 4.2 expected SECDED codeword.
  expected: code_out == 8'b01011010 (0x5A); code_out[0] is the overall even-parity
    bit (0 here) and the base Hamming(7,4) codeword occupies code_out[7:1].
  note: Verifies the SECDED bit-order shift of spec section 3.1 relative to the SECDED=0
    case.
- id: TC4
  name: exhaustive_sweep_hamming_74
  description: Exhaustively drive all 16 data words for SECDED=0 and SECDED=1 at DATA_WIDTH=4,
    comparing every codeword bit-exactly against the Python reference model (spec
    section 6 recommended approach).
  priority: high
  stimulus:
    sequence:
    - action: sweep
      signals:
        variable: data_in
        from: 0
        to: 15
        secded:
        - 0
        - 1
      cycles: null
      description: Sweep data_in from 0 to 15; for each value and each SECDED mode
        check code_out against hamming_encode(data_in, 4, secded).
  expected: Bit-exact match with the reference model for all 32 (data_in, SECDED)
    combinations.
  note: Covers the ref_model self-check table (all 16 Hamming(7,4) codewords) plus
    all SECDED variants.
- id: TC5
  name: exhaustive_sweep_hamming_128
  description: Exhaustively drive all 256 data words at DATA_WIDTH=8, SECDED=0 (Hamming(12,8)),
    comparing against the reference model. Spec section 6 reports these 256 vectors
    were bit-exact cross-checked.
  priority: medium
  stimulus:
    sequence:
    - action: sweep
      signals:
        variable: data_in
        from: 0
        to: 255
        secded:
        - 0
      cycles: null
      description: Sweep data_in from 0 to 255 with SECDED=0; check the 12-bit code_out
        against hamming_encode(data_in, 8, False).
  expected: Bit-exact match with the reference model for all 256 vectors; CODE_WIDTH
    == 12, PARITY_BITS == 4.
  note: Exercises a wider data path and a 4-parity-bit geometry.
- id: TC6
  name: single_bit_walk
  description: Walk a single high bit across every data_in position for both SECDED
    modes to exercise each data-bit placement position independently and stress the
    parity XOR trees with minimal-weight inputs.
  priority: medium
  stimulus:
    sequence:
    - action: loop_walk
      signals:
        variable: data_in
        mode: single_bit
        secded:
        - 0
        - 1
      cycles: null
      description: For i in 0..DATA_WIDTH-1, drive data_in = 1<<i and check code_out
        against hamming_encode(1<<i, DATA_WIDTH, secded).
  expected: For every i, code_out matches the reference model in both SECDED modes.
  note: Complements exhaustive sweeps by isolating the effect of each data bit on
    the codeword.
- id: TC7
  name: parameterized_width_configurations
  description: Smoke-test additional elaborations DATA_WIDTH in {1, 11, 16} with SECDED
    in {0, 1} using representative vectors (0, max, alternating pattern), compared
    against the reference model; verify the derived geometry matches the spec section
    4.3 table.
  priority: low
  stimulus:
    sequence:
    - action: sweep
      signals:
        data_widths:
        - 1
        - 11
        - 16
        secded:
        - 0
        - 1
        patterns:
        - zero
        - max
        - alternating
      cycles: null
      description: For each (DATA_WIDTH, SECDED) configuration drive data_in in {0,
        2**DATA_WIDTH - 1, alternating 0b1010... pattern} and check code_out against
        hamming_encode.
  expected: All representative vectors match hamming_encode for the configured data_width/secded;
    PARITY_BITS/CODE_WIDTH agree with spec section 2.2 formulas and section 4.3 table
    (DATA_WIDTH=1 -> R=2, CODE_WIDTH=3/4; DATA_WIDTH=11 -> R=4, CODE_WIDTH=15/16;
    DATA_WIDTH=16 -> R=5, CODE_WIDTH=21/22).
  note: Covers the R=2..5 elaboration boundaries and both SECDED modes.
- id: TC8
  name: alternating_and_boundary_patterns
  description: Drive targeted non-trivial 4-bit patterns (0b0011, 0b1001, 0b0110,
    0b1010, 0b0101) under both SECDED modes, checked against the reference model.
  priority: low
  stimulus:
    sequence:
    - action: sweep
      signals:
        variable: data_in
        values:
        - 3
        - 9
        - 6
        - 10
        - 5
        width: 4
        secded:
        - 0
        - 1
      cycles: null
      description: Drive each listed 4-bit pattern under both SECDED modes and check
        code_out against hamming_encode(value, 4, secded).
  expected: Bit-exact match with hamming_encode for every listed pattern and mode.
  note: Adds targeted patterns that toggle multiple parity cover sets simultaneously.
corner_cases:
- name: zero_data_word
  description: data_in = 0. Every data bit and parity bit is 0, so the codeword is
    all zeros in both SECDED modes.
  expected: code_out == 0 (width CODE_WIDTH) for both SECDED values.
- name: all_ones_data_word
  description: data_in = 2**DATA_WIDTH - 1, producing the maximum-density codeword.
  expected: 'code_out matches hamming_encode(max, DATA_WIDTH, SECDED); e.g. DATA_WIDTH=4:
    SECDED=0 -> 7''b1111111, SECDED=1 -> 8''b11111111 (overall parity of a 7-bit all-ones
    base codeword is 1).'
- name: single_bit_data_walk
  description: Drive data_in = 1<<i for each i in 0..DATA_WIDTH-1 to visit every data-bit
    placement position individually.
  expected: Each codeword matches hamming_encode(1<<i, DATA_WIDTH, SECDED); codeword
    weight is the minimum for any non-zero input, stressing parity XOR chains.
- name: minimum_data_width
  description: DATA_WIDTH = 1, the smallest legal elaboration (Hamming(3,1) / Hamming(4,1)
    SECDED).
  expected: PARITY_BITS = 2, BASE_WIDTH = 3, CODE_WIDTH = 3 (SECDED=0) or 4 (SECDED=1);
    both data_in values match hamming_encode with data_width=1.
- name: parity_bit_count_transition
  description: DATA_WIDTH = 5 (first width requiring R = 4) and DATA_WIDTH = 16 (Hamming(21,16),
    R = 5), exercising the derived-localparam boundaries around the spec section 4.3
    table.
  expected: PARITY_BITS and CODE_WIDTH follow the spec section 2.2 formulas; every
    driven vector matches hamming_encode.
- name: secded_ordering_shift
  description: Drive identical data_in under SECDED=0 and SECDED=1 and check the bit-order
    relationship between the two codewords per spec section 3.1.
  expected: code_out(SECDED=1) == {base_codeword, overall_parity} produced by hamming_encode,
    i.e. the base codeword is shifted up exactly one bit with the overall parity at
    bit 0.
- name: secded_codeword_even_weight
  description: For SECDED=1 the complete CODE_WIDTH codeword (including the overall
    parity bit) always has even Hamming weight.
  expected: Reduction-XOR over all CODE_WIDTH bits of code_out == 0 for every data_in.
- name: hamming_weight_symmetry
  description: data_in values that are bit-reverses or complements of each other produce
    codewords whose weight and parity relationships follow from the linear Hamming
    construction.
  expected: Each such vector still satisfies the reference model bit-exactly; used
    as a structural consistency probe, not as a separate oracle.
randomized_testing_strategy:
  description: Beyond the directed exhaustive sweeps, drive randomized data_in across
    the full data space for a selected set of (DATA_WIDTH, SECDED) configurations
    to broaden statistical coverage of the XOR logic. Use uniform random sampling
    merged with boundary-concentrated values (0, max, single-bit patterns) to reach
    rare codewords. Every driven vector is checked bit-exactly against the reference
    model in the scoreboard.
  constraints:
  - variable: data_in
    range:
    - 0
    - (1 << DATA_WIDTH) - 1
  - variable: secded
    range:
    - 0
    - 1
  - variable: data_width
    range:
    - 4
    - 8
  injection:
  - type: environment_reset
    frequency: per configuration
    duration_cycles:
    - 2
    description: Assert tb_reset for 2 clock cycles at the start of each randomized
      configuration to clear the predictor, scoreboard and coverage state. tb_reset
      does not affect the combinational DUT outputs.
  - type: configuration_toggle
    frequency: per 1000 vectors
    duration_cycles: null
    description: Re-elaborate or switch DATA_WIDTH/SECDED between blocks of random
      vectors so multiple configurations accumulate coverage in a single run.
  pass_criteria: 100% of randomized vectors produce bit-exact code_out matches against
    hamming_encode for the active configuration; zero mismatches; no X/Z values on
    code_out after settle; functional coverage goals in functional_coverage are met.
functional_coverage:
  covergroups:
  - name: cg_hamming_encoding
    description: 'Functional coverage for the Hamming encoder, sampled on the testbench
      clock after combinational settle: data-in space, SECDED mode, elaboration width,
      and resulting codeword parity properties.'
    clk: clk
    sample_on: posedge
    bins:
    - name: data_in_cov
      variable: data_in
      bins:
      - name: zero
        range:
        - 0
        - 0
        expression: null
      - name: single_bit_set
        range: null
        expression: data_in != 0 && (data_in & (data_in - 1)) == 0
      - name: low_space
        range: null
        expression: data_in < (1 << (DATA_WIDTH - 1))
      - name: high_space
        range: null
        expression: data_in >= (1 << (DATA_WIDTH - 1))
      - name: max_value
        range: null
        expression: data_in == (1 << DATA_WIDTH) - 1
    - name: secded_cov
      variable: secded
      bins:
      - name: secded_off
        range:
        - 0
        - 0
        expression: null
      - name: secded_on
        range:
        - 1
        - 1
        expression: null
    - name: width_cov
      variable: data_width
      bins:
      - name: width_1
        range:
        - 1
        - 1
        expression: null
      - name: width_4
        range:
        - 4
        - 4
        expression: null
      - name: width_8
        range:
        - 8
        - 8
        expression: null
      - name: width_11
        range:
        - 11
        - 11
        expression: null
      - name: width_16
        range:
        - 16
        - 16
        expression: null
    - name: codeword_cov
      variable: code_out
      bins:
      - name: even_weight
        range: null
        expression: popcount(code_out) % 2 == 0
      - name: odd_weight
        range: null
        expression: popcount(code_out) % 2 == 1
      - name: secded_parity_zero
        range: null
        expression: SECDED && code_out[0] == 0
      - name: secded_parity_one
        range: null
        expression: SECDED && code_out[0] == 1
    crosses:
    - name: data_x_secded
      variables:
      - data_in_cov
      - secded_cov
      description: Cross of the data-in space bins (zero / single-bit / low / high
        / max) with SECDED mode.
    - name: width_x_secded
      variables:
      - width_cov
      - secded_cov
      description: Cross of the elaboration DATA_WIDTH bins with SECDED mode.
scoreboard_reference_model_strategy:
  description: Predictor-style scoreboard. For every driven vector the Python golden
    model hamming_encode() computes the expected codeword (and the expected geometry
    via HammingParams) for the active DATA_WIDTH/SECDED configuration; the DUT code_out
    is sampled after combinational settle and compared bit-for-bit.
  architecture:
  - type: python_golden_predictor
    description: Call hamming_encode(data_in, data_width, secded) from benchmarks/hamming_encoder/ref_model.py
      to obtain the predicted code_out and HammingParams; use params.code_width to
      width-check and mask the sampled code_out.
  - type: sample_compare
    description: On each testbench clock edge following a drive, capture code_out
      and compare it with the predictor output in the same simulation timestamp (combinational
      latency 0); flag any bit difference immediately.
  pass_criteria: Bit-exact match between DUT code_out and hamming_encode for 100%
    of directed, exhaustive and randomized vectors across every exercised (DATA_WIDTH,
    SECDED) configuration.
  error_reporting: On mismatch, report data_in, DATA_WIDTH, SECDED, expected code_out,
    actual code_out and the differing bit indices; count the error, fail the current
    test, and emit a per-configuration summary at the end of the regression.
useful_assertions:
- name: data_width_positive
  description: DATA_WIDTH must be greater than zero at elaboration. The RTL issues
    $fatal and the reference model raises ValueError for non-positive widths.
  severity: error
  assertion: DATA_WIDTH > 0
  note: Asserted once per DUT elaboration in the generated testbench.
- name: output_matches_reference_model
  description: After each data_in drive and combinational settle, code_out must equal
    hamming_encode(data_in, DATA_WIDTH, SECDED).
  severity: error
  assertion: code_out == expected_code_out (predictor output)
  note: Primary DUT-versus-oracle check; a failure here indicates a DUT defect and
    must not cause the reference model to be adapted.
- name: secded_overall_even_parity
  description: With SECDED=1 the full CODE_WIDTH codeword has even parity (XOR-reduction
    equals 0).
  severity: error
  assertion: (SECDED == 1) implies (^code_out == 0)
  note: Validates the overall-parity placement at code_out[0] independently of the
    exact codeword value.
- name: data_bits_preserved_in_codeword
  description: Extracting the non-power-of-two positions of the base codeword from
    code_out reproduces data_in exactly.
  severity: error
  assertion: deinterleave(code_out, DATA_WIDTH) == data_in
  note: Checks the data-bit placement mapping of spec section 3 independently of the
    parity computation.
- name: parity_cover_set_definition
  description: Each parity bit at position 2**p equals the XOR of every position pos
    (excluding 2**p) for which (pos & 2**p) != 0.
  severity: error
  assertion: ham[2**p] == ^(ham[pos] for pos in 1..BASE_WIDTH where pos != 2**p and
    (pos & 2**p) != 0)
  note: Structural check of the Hamming covering sets from spec section 3 step 4.
discrepancies:
- id: DISC-1
  severity: low
  title: rtl_info.json parameter-default extraction does not reflect the RTL declarations
  rtl: hamming_encoder.sv declares parameter SECDED = 1'b0 (default 0) and derives
    localparams PARITY_BITS, BASE_WIDTH and CODE_WIDTH from DATA_WIDTH and SECDED
    (e.g. DATA_WIDTH=4, SECDED=1 gives CODE_WIDTH=8).
  spec: spec.md section 2.1 lists SECDED default 0; section 2.2 gives the derived
    localparam formulas and section 4.3 the concrete width table.
  impact: rtl_info.json reports SECDED default as '1' and CODE_WIDTH default as '1'.
    If those metadata values were used verbatim, the testbench would elaborate the
    SECDED variant by default and size code_out incorrectly, masking the non-SECDED
    default behavior.
  recommendation: Treat hamming_encoder.sv and spec.md as authoritative for parameter
    defaults and formulas; always set SECDED explicitly per test; regenerate rtl_info.json
    with a proper expression evaluator for parameter defaults.
- id: DISC-2
  severity: low
  title: No functional discrepancy between RTL and spec/reference model was found
  rtl: RTL implements the power-of-two-position Hamming construction with optional
    overall-parity SECDED bit, matching spec section 3 algorithm and section 3.1 bit
    ordering (verified against the section 4.1/4.2 worked examples).
  spec: spec.md section 3 algorithm and section 3.1 mapping; ref_model.py hamming_encode()
    agrees bit-exactly for the section 6 cross-check vectors.
  impact: None. Recorded so downstream generators know the RTL is a conforming implementation
    to be verified against the reference model, not an oracle to be reverse-engineered.
  recommendation: Verify exclusively against the reference model and the spec worked
    examples; do not use RTL simulation results to redefine expected behavior.
