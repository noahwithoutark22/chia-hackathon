# hamming_encoder cocotb+pyuvm testbench — generation manifest (integration
# stage).
#
# This manifest is the authoritative runtime contract for the generated
# environment.  The top module, RTL file, compiled sources, python test
# module, and the exact pyuvm test class names selectable via UVM_TESTNAME
# are all listed here.  The `scenarios` list maps each directed
# verification-plan scenario ID (TC1..TC8) to the generated sequence and
# test classes, exactly matching the plan scenario names.
#
# The Corner / Randomized tests intentionally carry no scenario id: their
# stimulus aggregates sequences that have no single plan id, matching the
# plan's corner_cases and randomized_testing_strategy sections.

top_module: hamming_encoder
top_file: benchmarks/hamming_encoder/hamming_encoder.sv

# Only the DUT RTL is passed to the simulator.  There is no generated
# SystemVerilog source (everything else is Python).
compile_files:
  - benchmarks/hamming_encoder/hamming_encoder.sv

# Exact runtime pyuvm uvM test class names (selectable via UVM_TESTNAME).
test_classes:
  - HammingTC1Test
  - HammingTC2Test
  - HammingTC3Test
  - HammingTC4Test
  - HammingTC5Test
  - HammingTC6Test
  - HammingTC7Test
  - HammingTC8Test
  - HammingCornerTest
  - HammingRandomizedTest

# Top-level Python cocotb test module (without .py).
python_test_module: test_top

# Authoritative mapping between the accepted verification plan
# (directed_test_scenarios) and the generated directed environment.
scenarios:
  - id: TC1
    name: reset_and_zero_initial_state
    sequence: ResetAndZeroInitialStateSeq
    test: HammingTC1Test
  - id: TC2
    name: spec_example_hamming_74
    sequence: SpecExampleHamming74Seq
    test: HammingTC2Test
  - id: TC3
    name: spec_example_hamming_84_secded
    sequence: SpecExampleHamming84SECDEDSeq
    test: HammingTC3Test
  - id: TC4
    name: exhaustive_sweep_hamming_74
    sequence: ExhaustiveSweepHamming74Seq
    test: HammingTC4Test
  - id: TC5
    name: exhaustive_sweep_hamming_128
    sequence: ExhaustiveSweepHamming128Seq
    test: HammingTC5Test
  - id: TC6
    name: single_bit_walk
    sequence: SingleBitWalkSeq
    test: HammingTC6Test
  - id: TC7
    name: parameterized_width_configurations
    sequence: ParameterizedWidthConfigurationsSeq
    test: HammingTC7Test
  - id: TC8
    name: alternating_and_boundary_patterns
    sequence: AlternatingAndBoundaryPatternsSeq
    test: HammingTC8Test