schema_version: "1.0"

purpose:
  description: >
    Advisory first-principles guidance for reasoning about weaknesses in a
    cocotb + pyuvm verification environment.
  role: >
    This guidance is a search-space accelerator, not a rule engine. It is
    intentionally non-exhaustive. The reasoning model must use engineering
    judgment and may identify mechanisms, interactions, or interventions that
    are not listed here.

principles:

  stimulus:
    question: >
      Can the verification environment activate the important behaviors,
      states, transitions, boundaries, and temporal situations in which the
      DUT could fail?
    mechanisms:
      - missing_functional_scenarios
      - missing_boundary_values
      - missing_corner_cases
      - missing_negative_testing
      - missing_state_transitions
      - missing_temporal_sequences
      - ineffective_randomization
      - constrained_stimulus_hides_cases
      - scenario_not_executed
      - insufficient_parameter_exploration
      - insufficient_sequence_diversity

  observation:
    question: >
      Can the verification environment reliably observe and reconstruct the
      behavior produced by the DUT?
    mechanisms:
      - incomplete_signal_observation
      - incorrect_sampling
      - incorrect_sampling_phase
      - incorrect_transaction_reconstruction
      - lost_transactions
      - duplicated_transactions
      - incorrect_temporal_alignment
      - incorrect_reset_observation
      - incomplete_response_observation
      - incorrect_handshake_observation

  checking:
    question: >
      Can the verification environment reliably distinguish correct DUT
      behavior from incorrect DUT behavior?
    mechanisms:
      - missing_check
      - incomplete_check
      - weak_comparison
      - incorrect_reference_model
      - incorrect_transaction_matching
      - missing_order_check
      - missing_latency_check
      - missing_state_check
      - missing_protocol_check
      - masked_failure
      - false_positive_check
      - false_negative_check
      - checker_not_executed

  coverage:
    question: >
      Can the verification environment demonstrate that important behavior
      has actually been exercised, and can coverage expose meaningful holes?
    mechanisms:
      - missing_coverage
      - meaningless_coverage
      - missing_cross_coverage
      - misleading_bins
      - overly_broad_bins
      - overly_narrow_bins
      - missing_boundary_bins
      - important_coverage_holes
      - coverage_not_connected_to_plan
      - coverage_not_connected_to_stimulus
      - coverage_not_connected_to_observation
      - coverage_metric_not_exported

  robustness:
    question: >
      Can the verification result itself be trusted, including under reset,
      timing, concurrency, failure, and repeated execution?
    mechanisms:
      - reset_race
      - clocking_race
      - sampling_race
      - nondeterminism
      - swallowed_exception
      - timeout_masking
      - false_pass
      - false_fail
      - state_leakage
      - poor_test_isolation
      - stale_shared_state
      - incomplete_cleanup
      - insufficient_watchdog
      - premature_test_completion

  architecture:
    question: >
      Is the verification environment structured so that stimulus,
      observation, checking, coverage, and reuse can work correctly and be
      extended without unnecessary coupling?
    mechanisms:
      - excessive_coupling
      - unclear_transaction_contract
      - duplicated_logic
      - poor_component_separation
      - implementation_coupling
      - difficult_extensibility
      - unclear_data_flow
      - inappropriate_shared_state
      - monitor_scoreboard_coupling
      - stimulus_checker_coupling

reasoning_rules:

  evidence_first:
    description: >
      Base the diagnosis on the supplied weakness report, specification,
      reference model, verification plan, current TB, simulation evidence,
      and improvement history.

  guidance_is_non_exhaustive:
    description: >
      Do not force an observed weakness into one of the mechanisms above.
      Mechanisms outside this list are valid when supported by evidence.

  multiple_mechanisms_allowed:
    description: >
      A weakness may result from multiple interacting mechanisms. Do not
      assume that exactly one mechanism explains every weakness.

  independent_analysis_allowed:
    description: >
      The reasoning model may disagree with the weakness report or guidance
      when the available evidence supports a different interpretation.

  no_change_allowed:
    description: >
      If the evidence does not justify a safe and meaningful intervention,
      choose no_change or defer rather than making an arbitrary modification.

  smallest_effective_change:
    description: >
      Prefer the smallest TB-only intervention that addresses the diagnosed
      cause while preserving existing useful verification behavior.

  avoid_repetition:
    description: >
      Consider previous accepted and rejected experiments. Avoid repeating an
      ineffective intervention unless new evidence provides a clear reason.

  protect_verification_integrity:
    description: >
      Never weaken, remove, bypass, or mask existing checks merely to improve
      a metric or obtain a passing simulation.

  preserve_authority:
    description: >
      The specification, reference model, verification plan, and frozen
      verification contract remain authoritative. Do not modify them.

  rtl_blind:
    description: >
      The improvement reasoning process must remain RTL-blind. Do not infer,
      request, search for, or use hidden RTL implementation details.

  validate_change:
    description: >
      Every proposed intervention should have a concrete expected effect and
      a validation strategy that can be evaluated after simulation.

decision_guidance:

  improve:
    use_when: >
      Evidence supports a specific TB weakness and a plausible intervention
      that can improve verification quality without weakening existing checks.

  no_change:
    use_when: >
      The environment is already adequate for the reported issue, the evidence
      does not support a useful change, or modification would be speculative.

  defer:
    use_when: >
      The issue may be real but cannot currently be addressed safely or
      confidently with the available specification, reference model, plan,
      TB, and simulation evidence.
