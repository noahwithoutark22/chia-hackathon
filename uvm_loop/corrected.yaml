dut:
  name: adder
  file: examples/adder/adder.sv
  description: >
    Parameterized WIDTH-bit registered adder with carry-in and carry-out.
    Outputs are registered on the rising edge of clk.

parameters:
  - name: WIDTH
    default: 8
    description: Bit-width of inputs a, b and output sum. Sum output is WIDTH bits; carry-out is always 1 bit.
    test_values: [4, 8, 16]

clock_and_reset:
  clock:
    name: clk
    type: posedge
    description: Single positive-edge-triggered clock.
  reset:
    name: rst_n
    polarity: active-low
    type: asynchronous
    description: >
      Asynchronous active-low reset. Cleared when rst_n falls; does not wait
      for a clock edge. IMPORTANT: the spec describes this as a synchronous
      reset, but the RTL sensitivity list (posedge clk or negedge rst_n)
      implements an asynchronous reset. See 'discrepancies' section.
    reset_value:
      sum: 0
      cout: 0

ports:
  inputs:
    - name: clk
      width: 1
      description: System clock
    - name: rst_n
      width: 1
      description: Active-low asynchronous reset
    - name: a
      width: WIDTH
      description: First unsigned addend
    - name: b
      width: WIDTH
      description: Second unsigned addend
    - name: cin
      width: 1
      description: Carry-in
  outputs:
    - name: sum
      width: WIDTH
      type: reg
      latency: 1 clock cycle
      description: WIDTH-bit sum portion of (a + b + cin)
    - name: cout
      width: 1
      type: reg
      latency: 1 clock cycle
      description: Carry-out (overflow bit) of (a + b + cin)

functional_behavior:
  description: >
    On every positive clock edge, when rst_n is high, the DUT computes
    the (WIDTH+1)-bit sum {cout, sum} = a + b + cin and registers the
    result. Outputs appear one clock cycle after inputs are presented.
  reset_behavior: >
    When rst_n goes low (asynchronous), sum and cout are immediately
    cleared to zero regardless of clock. They remain zero until rst_n
    returns high and a subsequent clock edge occurs.
  reference_model:
    language: python
    file: examples/adder/ref_model.py
    function: adder_ref(a, b, cin, width)
    logic: >
      total = (a & mask) + (b & mask) + (cin & 1) where mask = (1 << WIDTH) - 1.
      sum_out = total & mask; cout = (total >> WIDTH) & 1.
    latency: 1 cycle (registered output)

directed_test_scenarios:
  - name: reset_clears_outputs
    description: Verify reset forces sum and cout to 0.
    stimulus:
      sequence:
        - cycle: 0
          a: 0xFF
          b: 0xFF
          cin: 1
          rst_n: 0
        - cycle: 1
          rst_n: 0
        - cycle: 2
          rst_n: 1
    expected:
      - cycle: 1
        sum: 0
        cout: 0
      - cycle: 2
        sum: 0
        cout: 0
    note: Output is registered, so after reset release the outputs stay 0 until next active edge with valid inputs.

  - name: zero_inputs_no_carry
    description: "Basic no-carry addition: 0 + 0 + 0."
    stimulus:
      sequence:
        - rst_n: 1
          a: 0
          b: 0
          cin: 0
    expected:
      sum: 0
      cout: 0

  - name: simple_addition_no_overflow
    description: Simple addition that does not overflow.
    stimulus:
      sequence:
        - rst_n: 1
          a: 10
          b: 20
          cin: 0
    expected:
      sum: 30
      cout: 0

  - name: addition_with_carry_in
    description: Addition with carry-in set.
    stimulus:
      sequence:
        - rst_n: 1
          a: 50
          b: 50
          cin: 1
    expected:
      sum: 101
      cout: 0

  - name: overflow_cout_set
    description: Addition that produces carry-out.
    stimulus:
      sequence:
        - rst_n: 1
          a: 255
          b: 1
          cin: 0
    expected:
      sum: 0
      cout: 1

  - name: max_inputs_with_cin
    description: Maximum inputs with carry-in causes double overflow wrapping.
    stimulus:
      sequence:
        - rst_n: 1
          a: 255
          b: 255
          cin: 1
    expected:
      sum: 255
      cout: 1

  - name: cin_only
    description: Only carry-in contributes (a and b are zero).
    stimulus:
      sequence:
        - rst_n: 1
          a: 0
          b: 0
          cin: 1
    expected:
      sum: 1
      cout: 0

  - name: carry_chain_across_all_bits
    description: >
      Stimulus that produces a carry chain propagating through every bit
      position. For WIDTH=8: a=0xFF, b=0x00, cin=1 yields sum=0, cout=1.
      Also: a=0x55, b=0xAA, cin=0 yields sum=0xFF, cout=0.
    stimulus:
      sequence:
        - rst_n: 1
          a: 255
          b: 0
          cin: 1
        - rst_n: 1
          a: 85
          b: 170
          cin: 0
    expected:
      - sum: 0
        cout: 1
      - sum: 255
        cout: 0

  - name: back_to_back_operations
    description: Verify consecutive additions without reset.
    stimulus:
      sequence:
        - rst_n: 1
          a: 10
          b: 20
          cin: 0
        - rst_n: 1
          a: 30
          b: 40
          cin: 1
    expected:
      - sum: 30
        cout: 0
      - sum: 71
        cout: 0

  - name: async_reset_during_operation
    description: >
      Assert reset asynchronously while an addition is in progress.
      Verify outputs go to zero immediately (same cycle).
    stimulus:
      sequence:
        - rst_n: 1
          a: 200
          b: 200
          cin: 0
        - rst_n: 0
    expected:
      sum: 0
      cout: 0
    note: Due to async reset, outputs clear on the same posedge as rst_n fall.

corner_cases:
  - name: all_ones_inputs
    description: a = b = all ones, cin = 0. Sum wraps to all-ones, cout = 1 (for WIDTH >= 1).
    a: MAX_VAL
    b: MAX_VAL
    cin: 0
    expected:
      sum: MAX_VAL
      cout: 1

  - name: all_ones_with_cin
    description: a = b = all ones, cin = 1. Sum = all ones, cout = 1.
    a: MAX_VAL
    b: MAX_VAL
    cin: 1
    expected:
      sum: MAX_VAL
      cout: 1

  - name: one_plus_one_with_cin
    description: "Minimal interesting case with carry chain: 1 + 1 + 1 = 3."
    a: 1
    b: 1
    cin: 1
    expected:
      sum: 3
      cout: 0

  - name: threshold_overflow
    description: a + b + cin just barely overflows.
    a: MAX_VAL
    b: 0
    cin: 1
    expected:
      sum: 0
      cout: 1

  - name: just_below_overflow
    description: Maximum sum that does not overflow.
    a: MAX_VAL
    b: 0
    cin: 0
    expected:
      sum: MAX_VAL
      cout: 0

  - name: reset_mid_back_to_back
    description: >
      Apply two additions, assert reset between them, then release and
      apply a third. The third addition should produce correct results.
    stimulus:
      sequence:
        - rst_n: 1
          a: 100
          b: 50
          cin: 0
        - rst_n: 0
        - rst_n: 1
          a: 10
          b: 20
          cin: 0
    expected:
      - sum: 150
        cout: 0
      - sum: 0
        cout: 0
      - sum: 30
        cout: 0

randomized_testing_strategy:
  description: >
    Constrained random stimulus exercising the full input space.
    Run for at least 1000 transactions per WIDTH configuration.
  constraints:
    - variable: a
      range: [0, (1 << WIDTH) - 1]
    - variable: b
      range: [0, (1 << WIDTH) - 1]
    - variable: cin
      range: [0, 1]
  injection:
    - type: async_reset
      frequency: every 50-200 transactions
      description: Randomly assert rst_n mid-operation to exercise reset recovery.
    - type: reset_hold
      duration_cycles: [1, 5]
      description: Hold reset for a random number of cycles.
  pass_criteria: >
    Every sampled transaction's output must match the reference model
    (adder_ref) result from the previous cycle.

functional_coverage:
  covergroups:
    - name: cg_inputs
      description: Cover all input combinations for basic completeness.
      clk: clk
      sample_on: posedge clk
      bins:
        - name: b_a
          variable: a
          bins:
            - name: zeros
              range: [0, 0]
            - name: low_quarter
              range: [1, MAX_VAL_QUARTER]
            - name: mid
              range: [MAX_VAL_HALF - 1, MAX_VAL_HALF]
            - name: high_quarter
              range: [MAX_VAL_THREE_Q, MAX_VAL - 1]
            - name: max
              range: [MAX_VAL, MAX_VAL]
        - name: b_b
          variable: b
          bins:
            - name: zeros
              range: [0, 0]
            - name: low_quarter
              range: [1, MAX_VAL_QUARTER]
            - name: mid
              range: [MAX_VAL_HALF - 1, MAX_VAL_HALF]
            - name: high_quarter
              range: [MAX_VAL_THREE_Q, MAX_VAL - 1]
            - name: max
              range: [MAX_VAL, MAX_VAL]
        - name: b_cin
          variable: cin
          bins:
            - name: zero
              range: [0, 0]
            - name: one
              range: [1, 1]
      crosses:
        - name: cross_a_b_cin
          variables: [b_a, b_b, b_cin]
          description: Cross of a bins, b bins, and cin.

    - name: cg_overflow
      description: Cover carry-out generation and propagation.
      clk: clk
      sample_on: posedge clk
      bins:
        - name: b_cout
          variable: cout
          bins:
            - name: no_overflow
              range: [0, 0]
            - name: overflow
              range: [1, 1]

    - name: cg_sum_values
      description: Cover interesting sum output values.
      clk: clk
      sample_on: posedge clk
      bins:
        - name: b_sum
          variable: sum
          bins:
            - name: zeros
              range: [0, 0]
            - name: ones
              range: [1, 1]
            - name: mid
              range: [MAX_VAL_HALF - 1, MAX_VAL_HALF]
            - name: max
              range: [MAX_VAL, MAX_VAL]

    - name: cg_carry_scenarios
      description: >
        Cover each carry-in bit position using specific input patterns
        that create a carry chain at position i.
      clk: clk
      sample_on: posedge clk
      crosses:
        - name: cross_carry_positions
          variables: [b_a, b_b, b_cin, b_cout]
          description: >
            Ensure transitions where cout toggles from 0->1 and 1->0
            are both observed.

scoreboard_reference_model_strategy:
  description: >
    The scoreboard compares DUT outputs against the Python reference
    model (adder_ref from ref_model.py) with a 1-cycle latency model.
  architecture:
    - type: transaction_based
      description: >
        Sample inputs (a, b, cin) every clock cycle when rst_n is high.
        Compute expected (sum, cout) using the reference model. On the
        next clock edge, compare DUT outputs against expected values.
    - type: dpi_import
      description: >
        Alternatively, import adder_ref via DPI-C for direct in-SystemVerilog
        scoreboard comparison.
  pass_criteria: >
    DUT sum and cout must exactly match reference model output on every
    clock cycle after the 1-cycle registered latency.
  error_reporting: >
    On mismatch, report: cycle count, actual DUT outputs, expected
    reference outputs, and input stimulus.

useful_assertions:
  - name: reset_value_check
    description: During reset, outputs must be zero.
    severity: error
    assertion: >
      (!rst_n) |-> (sum == 0 && cout == 0)
    note: This is an immediate assertion on the combinational reset state.

  - name: no_overflow_beyond_one_bit
    description: cout must be exactly 1 bit.
    severity: error
    assertion: >
      $countones(cout) <= 1

  - name: sum_stable_after_reset
    description: >
      After reset deassertion, sum should not change until the next
      clock edge.
    severity: error
    assertion: >
      $fell(rst_n) |=> $stable(sum) throughout (rst_n [*1:$])
    note: Somewhat complex; simpler to verify via scoreboard.

  - name: output_valid_after_reset
    description: >
      Two cycles after reset release, output should reflect the input
      presented on the first non-reset cycle.
    severity: info
    assertion: >
      @(posedge clk) disable iff (!rst_n)
      $past(rst_n) && !$past($past(rst_n)) |->
        $past(sum) == expected_from_past_inputs
    note: Practical as a sequence property with helper logic.

discrepancies:
  - id: DISC-001
    severity: high
    title: Reset type mismatch between RTL and specification
    rtl: >
      The RTL uses always @(posedge clk or negedge rst_n), which implements
      an asynchronous active-low reset. The reset clears outputs on the
      negedge of rst_n without waiting for a clock edge.
    spec: >
      The specification (spec.md) describes an \"active-low, synchronous
      reset\" and states that outputs are cleared on the rising edge of clk
      when rst_n is low.
    impact: >
      Verification must use the RTL (asynchronous reset) as truth.
      Test sequences must account for immediate output clearing on rst_n
      fall, not waiting for a clock edge. This also affects assertion
      timing and reset-related coverage sampling.
    recommendation: >
      Confirm with design whether async or sync reset is intended. If
      sync reset is intended, the RTL sensitivity list is incorrect and
      needs a fix. If async reset is intended, the spec needs correction.

  - id: DISC-002
    severity: low
    title: ref_model.py file extension mismatch
    rtl: >
      The RTL file is adder.sv (SystemVerilog).
    ref_model: >
      The reference model comment refers to adder.v (Verilog), not adder.sv.
    impact: Minimal — does not affect correctness.
    recommendation: Update the ref_model.py docstring to reference adder.sv.
