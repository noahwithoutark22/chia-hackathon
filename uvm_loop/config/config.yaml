llm:
  # Model IDs use OpenCode's provider/model format.
  # Default: direct Google Gemini provider through OpenCode.
  provider: google
  model_env_var: LLM_MODEL
  api_key_env_var: GOOGLE_GENERATIVE_AI_API_KEY
  default_model: google/gemini-2.5-flash
  max_tokens: 4096
  temperature: 0.2

paths:
  output_parent: generated/designs
  templates_dir: templates
