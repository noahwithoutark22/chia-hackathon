dut:
  name: adder
  file: examples/adder/adder.sv
  description: >-
    Registered, parameterized WIDTH-bit adder with carry-in and carry-out.
    On every rising edge of clk (and on asynchronous reset assertion), the
    (WIDTH+1)-bit result of a + b + cin is registered into {cout, sum}.

parameters:
  - name: WIDTH
    default: 8
    description: >-
      Bit width of the unsigned operand and sum vectors a, b, sum. The full
      result is WIDTH+1 bits wide with cout holding the overflow bit.
    test_values:
      - 4
      - 8
      - 16

clock_and_reset:
  clock:
    name: clk
    type: posedge
    description: System clock. All registered state updates on the rising edge.
  reset:
    name: rst_n
    polarity: active-low
    type: asynchronous_assert_synchronous_deassert
    description: >-
      Active-low reset. Clears sum and cout to 0 on assertion (asynchronously,
      since negedge rst_n is in the sensitivity list). Deassertion is
      synchronous to clk.
    reset_value:
      sum: 0
      cout: 0

ports:
  inputs:
    - name: a
      width: WIDTH
      type: unsigned
      description: Unsigned WIDTH-bit operand added to b and cin.
      latency: 1
    - name: b
      width: WIDTH
      type: unsigned
      description: Unsigned WIDTH-bit operand added to a and cin.
      latency: 1
    - name: cin
      width: 1
      type: unsigned
      description: Single-bit carry-in.
      latency: 1
  outputs:
    - name: sum
      width: WIDTH
      type: reg
      description: Registered low WIDTH bits of a + b + cin.
      latency: 1
    - name: cout
      width: 1
      type: reg
      description: Registered overflow/carry-out bit of a + b + cin.
      latency: 1
  inouts: []

functional_behavior:
  description: >-
    On the rising edge of clk, when rst_n is high, the DUT computes
    {cout, sum} <= a + b + cin. a and b are unsigned WIDTH-bit operands and
    cin is a single carry-in bit. sum captures the low WIDTH bits of the sum
    and cout captures the overflow (carry-out) bit of the (WIDTH+1)-bit result.
  reset_behavior: >-
    When rst_n is low (asserted), sum and cout are cleared to 0. Assertion is
    asynchronous (negedge rst_n is in the always sensitivity list), whereas
    deassertion takes effect synchronously on the rising edge of clk.
  reference_model:
    language: python
    file: examples/adder/ref_model.py
    function: adder_ref
    logic: >-
      mask = (1 << width) - 1; total = (a & mask) + (b & mask) + (cin & 1);
      return (total & mask), ((total >> width) & 1)
    latency: 1

directed_test_scenarios:
  - name: add_no_carry_basic
    description: >-
      Verify basic registered addition with no carry-out for representative
      operands.
    priority: high
    stimulus:
      sequence:
        - action: reset
          cycles: 2
          description: Assert reset to clear sum and cout.
        - action: wait
          cycles: 1
        - action: drive
          signals:
            a: "8'd10"
            b: "8'd20"
            cin: "1'b0"
          description: Drive operands to be summed.
        - action: wait
          cycles: 1
          description: Wait for registered sum to settle on next clock edge.
        - action: check
          signals:
            sum: "8'd30"
            cout: "1'b0"
          description: Expect sum = 30, cout = 0.
    expected:
      sum: 30
      cout: 0
    note: Latency 1 cycle from input drive to registered output.

  - name: carry_out_overflow
    description: >-
      Verify overflow behavior at the maximum representable sum, confirming
      cout is set correctly and sum wraps to the low WIDTH bits.
    priority: high
    stimulus:
      sequence:
        - action: reset
          cycles: 2
        - action: wait
          cycles: 1
        - action: drive
          signals:
            a: "8'd255"
            b: "8'd1"
            cin: "1'b0"
        - action: wait
          cycles: 1
        - action: check
          signals:
            sum: "8'd0"
            cout: "1'b1"
    expected:
      sum: 0
      cout: 1
    note: 255 + 1 = 256, which is 2^8, so sum wraps to 0 and cout = 1.

  - name: cin_in_isolation
    description: >-
      Verify cin alone produces the correct sum when both operands are zero.
    priority: high
    stimulus:
      sequence:
        - action: reset
          cycles: 2
        - action: wait
          cycles: 1
        - action: drive
          signals:
            a: "8'd0"
            b: "8'd0"
            cin: "1'b1"
        - action: wait
          cycles: 1
        - action: check
          signals:
            sum: "8'd1"
            cout: "1'b0"
    expected:
      sum: 1
      cout: 0

  - name: carry_propagation_across_bits
    description: >-
      Verify repeated carry propagation using two equal mid-range operands to
      generate a carry-out from the top bit.
    priority: medium
    stimulus:
      sequence:
        - action: reset
          cycles: 2
        - action: wait
          cycles: 1
        - action: drive
          signals:
            a: "8'd128"
            b: "8'd128"
            cin: "1'b0"
        - action: wait
          cycles: 1
        - action: check
          signals:
            sum: "8'd0"
            cout: "1'b1"
    expected:
      sum: 0
      cout: 1

  - name: reset_clears_running_sum
    description: >-
      Assert reset while a non-zero addition would otherwise be registered and
      confirm sum and cout are cleared.
    priority: medium
    stimulus:
      sequence:
        - action: reset
          cycles: 2
        - action: wait
          cycles: 1
        - action: drive
          signals:
            a: "8'd100"
            b: "8'd100"
            cin: "1'b1"
        - action: reset
          cycles: 1
          description: Assert reset asynchronously before the sum is observed.
        - action: wait
          cycles: 1
        - action: check
          signals:
            sum: "8'd0"
            cout: "1'b0"
    expected:
      sum: 0
      cout: 0

corner_cases:
  - name: both_operands_zero_no_cin
    description: >-
      0 + 0 + 0 must register sum = 0 and cout = 0, the identity case.
    expected:
      sum: 0
      cout: 0
  - name: maximum_sum_with_overflow
    description: >-
      (2^WIDTH - 1) + (2^WIDTH - 1) + 1 = 2^(WIDTH+1) - 1, the largest possible
      result, yielding sum = 2^WIDTH - 1 and cout = 1.
    expected:
      sum: 255
      cout: 1
  - name: wrap_at_power_of_two
    description: >-
      (2^(WIDTH-1)) + (2^(WIDTH-1)) equals 2^WIDTH, producing cout = 1 and a
      zeroed sum, the boundary where the carry-out first becomes set.
    expected:
      sum: 0
      cout: 1
  - name: last_bit_residual
    description: >-
      (2^WIDTH - 1) + 0 + 0 = 2^WIDTH - 1 registers the maximum sum with no
      overflow (cout = 0).
    expected:
      sum: 255
      cout: 0

randomized_testing_strategy:
  description: >-
    Randomize a, b, and cin over the full input space for WIDTH = 8 and compare
    the registered outputs against a cycle-accurate reference model
    (adder_ref) that computes {cout, sum} = a + b + cin.
  constraints:
    - variable: a
      range: [0, 255]
    - variable: b
      range: [0, 255]
    - variable: cin
      range: [0, 1]
  injection:
    - type: reset
      frequency: random
      duration_cycles: [1, 4]
      description: Randomly inject reset assertions of varying length to clear state and perturb the sequence.
  pass_criteria: >-
    All randomized transactions produce sum and cout matching the reference
    model within one clock cycle latency, with no mismatches across the run.

functional_coverage:
  covergroups:
    - name: adder_io_cg
      description: >-
        Cover the range of each operand and the carry-in to ensure the full
        input space is exercised.
      clk: clk
      sample_on: sum
      bins:
        - name: a_bins
          variable: a
          bins:
            - name: a_zero
              range: [0, 0]
            - name: a_mid
              range: [64, 191]
            - name: a_max
              range: [255, 255]
        - name: b_bins
          variable: b
          bins:
            - name: b_zero
              range: [0, 0]
            - name: b_max
              range: [255, 255]
        - name: cin_bins
          variable: cin
          bins:
            - name: cin_zero
              range: [0, 0]
            - name: cin_one
              range: [1, 1]
      crosses:
        - name: carry_cross
          variables: [a_bins, b_bins, cin_bins]
          description: >-
            Cross of operand and carry-in bins ensures combinations that
            produce and do not produce a carry are both observed.

scoreboard_reference_model_strategy:
  description: >-
    Use a cycle-accurate inlined golden model implementing {cout, sum} =
    a + b + cin (mirroring adder_ref) in the scoreboard. The reference model
    accounts for the DUT's single-cycle registration latency; expected outputs
    are compared after one clock.
  architecture:
    - type: inlined_reference_model
      description: >-
        Re-implement adder_ref directly in the scoreboard (SystemVerilog) so
        every driven transaction can be checked without external DPI calls.
    - type: expected_fifo
      description: >-
        Push expected {sum, cout} into a FIFO keyed by transaction, and compare
        against the DUT output after the 1-cycle latency.
  pass_criteria: >-
    The scoreboard reports zero mismatches between the reference model outputs
    and the DUT registered outputs for all directed and randomized
    transactions.
  error_reporting: >-
    On any mismatch, report the driven a, b, cin, the reference expected
    {sum, cout}, and the actual DUT {sum, cout}, and flag it as an error.

useful_assertions:
  - name: sum_equals_operands_plus_cin
    description: >-
      After one clock, the registered sum must equal the low WIDTH bits of
      a + b + cin and cout must equal the overflow bit.
    severity: error
    assertion: >-
      ##(1) (sum === (a + b + cin) % (1 << WIDTH)) && (cout === (a + b + cin) >> WIDTH)
    note: Sampled on the registered edge to respect the 1-cycle latency.
  - name: reset_clears_outputs
    description: >-
      When reset is active, sum and cout must be zero; on deassertion the
      next clock re-enables data capture.
    severity: error
    assertion: >-
      !rst_n |-> (sum === '0 && cout === 1'b0)
    note: Holds while reset is asserted.
  - name: no_x_on_outputs
    description: >-
      The registered outputs must never be X once reset deasserts, guarding
      against incomplete initialization.
    severity: error
    assertion: >-
      rst_n |-> !$isunknown(sum) && !$isunknown(cout)

discrepancies:
  - id: DISC-001
    severity: medium
    title: Reset described as synchronous but implemented as asynchronous-assert
    rtl: >-
      The always block sensitivity list is "posedge clk or negedge rst_n" with
      an "if (!rst_n)" branch, making reset assertion asynchronous. There is no
      deassert alignment or synchronizer.
    spec: >-
      spec.md describes the reset as "(active-low, synchronous reset)" and
      implies reset effects take effect only on the clock edge.
    impact: >-
      A testbench that applies reset strictly synchronously (aligned to the
      clock edge) may miss the asynchronous assertion semantics; conversely,
      modeling reset as purely synchronous would not capture the RTL's immediate
      async assertion behavior.
    recommendation: >-
      Model reset as asynchronous_assert_synchronous_deassert in the testbench
      and update spec.md to say "asynchronous assert, synchronous deassert" for
      accuracy. Verify both the assertion and deassertion paths consistently.
