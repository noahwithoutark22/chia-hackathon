schema_version: '2.0'
summary:
  overall_status: verification_weakness
  tests_total: 10
  tests_passed: 10
  tests_failed: 0
weaknesses:
- id: W001_TEST_PASS_DESPITE_MISMATCHES
  severity: critical
  category: test_infrastructure
  title: Tests report PASS despite scoreboard mismatches
  affected_tests:
  - TestPowerOfTwoDataPattern
  - TestRandomized
  evidence:
  - 'TestPowerOfTwoDataPattern: status=pass, scoreboard_mismatches=62'
  - 'TestRandomized: status=pass, scoreboard_mismatches=76'
  - simulation_result.json shows all 10 tests with category=pass despite mismatches
  likely_cause: Test base class (HammingEncoderBaseTest) does not check scoreboard
    error count in report_phase or end_of_simulation_phase. Scoreboard only logs errors
    but doesn't raise UVM_FATAL or cause test failure.
  investigation_targets:
  - tb/test_classes.py (HammingEncoderBaseTest.run_phase)
  - tb/scoreboard.py (report_phase method)
  recommended_action: Add scoreboard error check in test's report_phase or end_of_simulation_phase
    that calls self.fail() or raises UVM_FATAL when scoreboard.errors > 0. Alternatively,
    have scoreboard report_phase raise uvm_fatal on errors.
  confidence: high
- id: W002_ASSERTIONS_ONLY_CHECK_PARITY_CONSISTENCY
  severity: high
  category: assertion_coverage
  title: Assertions verify parity equations hold but not functional correctness
  affected_tests:
  - TestAllZerosInput
  - TestAllOnesInput
  - TestAlternating1010
  - TestAlternating0101
  - TestSingleBitSetLSB
  - TestSingleBitSetMSB
  - TestMaximumInputValue
  - TestMinimumInputValue
  - TestPowerOfTwoDataPattern
  - TestRandomized
  evidence:
  - 'All 10 tests show assertion_failures: 0'
  - verification_plan.yaml documents 4 RTL discrepancies (wrong data-to-position mapping,
    wrong parity masks, wrong codeword bit mapping, wrong overall parity)
  - Assertions in assertions.py only check that parity equations evaluate to even
    (self-consistency), not that codeword matches input data per spec
  likely_cause: Assertion checkers (overall_parity_check, hamming_parity_p*_check)
    only verify the output codeword has even parity per Hamming equations. They do
    not verify data bits are placed in correct non-parity positions, or that parity
    bits correspond to the actual input data. A buggy codeword with internally consistent
    but functionally wrong parity passes these assertions.
  investigation_targets:
  - tb/assertions.py (all hamming_parity_*_check functions)
  - tb/env.py (start_phase where checkers are started)
  recommended_action: Add assertions that verify data bits appear in correct non-parity
    Hamming positions (e.g., check codeword[3] == data_in[0], codeword[5] == data_in[1],
    etc.). Add cross-check between input data and specific codeword bit positions
    per specification.
  confidence: high
- id: W003_DIRECTED_TESTS_DO_NOT_EXPOSE_KNOWN_BUGS
  severity: high
  category: test_coverage
  title: Directed tests use patterns that do not expose documented RTL bugs
  affected_tests:
  - TestAllZerosInput
  - TestAllOnesInput
  - TestAlternating1010
  - TestAlternating0101
  - TestSingleBitSetLSB
  - TestSingleBitSetMSB
  - TestMaximumInputValue
  - TestMinimumInputValue
  evidence:
  - 8 directed/corner-case tests show scoreboard_mismatches=0
  - TestPowerOfTwoDataPattern (walking 1s across 64 bits) shows 62 mismatches
  - TestRandomized (100 random values) shows 76 mismatches
  - verification_plan.yaml discrepancies DISCREPANCY_001 through DISCREPANCY_004 describe
    RTL bugs
  likely_cause: Directed test patterns (all zeros, all ones, alternating, single bit
    at LSB/MSB) happen to not trigger the specific RTL bugs (skipped position 3, wrong
    parity masks, bit 10 mapping error, overall parity inversion). Bugs are only exposed
    when data bits exercise the affected positions (position 3, parity mask differences,
    bit 10, bit 71).
  investigation_targets:
  - tb/sequences.py (SeqAllZerosInput, SeqAllOnesInput, SeqAlternating1010, SeqAlternating0101,
    SeqSingleBitSetLSB, SeqSingleBitSetMSB)
  - tb/test_classes.py (corresponding test classes)
  recommended_action: 'Add directed tests targeting each known bug: (1) data_in with
    bit 0 set (maps to Hamming position 3), (2) patterns that differentiate parity
    mask errors, (3) pattern exercising Hamming position 10/11, (4) pattern exercising
    Hamming position 71 for overall parity. Use reference model to compute expected
    values for these targeted patterns.'
  confidence: high
- id: W004_SCOREBOARD_DOES_NOT_INDEPENDENTLY_VERIFY_PARITY_INVARIANTS
  severity: medium
  category: scoreboard_completeness
  title: Scoreboard only compares against reference model, lacks independent parity
    invariant checks
  affected_tests:
  - TestAllZerosInput
  - TestAllOnesInput
  - TestAlternating1010
  - TestAlternating0101
  - TestSingleBitSetLSB
  - TestSingleBitSetMSB
  - TestMaximumInputValue
  - TestMinimumInputValue
  - TestPowerOfTwoDataPattern
  - TestRandomized
  evidence:
  - scoreboard.py only computes expected_codeword = encode(data_in) and compares with
    actual
  - No independent verification of Hamming parity checks or overall parity on actual
    DUT output
  - If reference model had same bug as RTL, scoreboard would not detect it
  likely_cause: Scoreboard relies solely on reference model comparison. No defensive
    check that actual DUT output satisfies SECDED parity invariants regardless of
    reference model.
  investigation_targets:
  - tb/scoreboard.py (run_phase comparison logic)
  recommended_action: 'Add independent parity invariant checks in scoreboard.run_phase:
    verify actual_codeword has even overall parity, and each Hamming parity check
    evaluates to 0. Log separate error if invariants violated even if reference model
    matches (would indicate common-mode bug).'
  confidence: medium
- id: W005_COVERAGE_DOES_NOT_VERIFY_DATA_POSITION_MAPPING
  severity: medium
  category: functional_coverage
  title: Functional coverage only tracks input patterns and parity even/odd, not data-to-position
    mapping
  affected_tests:
  - TestAllZerosInput
  - TestAllOnesInput
  - TestAlternating1010
  - TestAlternating0101
  - TestSingleBitSetLSB
  - TestSingleBitSetMSB
  - TestMaximumInputValue
  - TestMinimumInputValue
  - TestPowerOfTwoDataPattern
  - TestRandomized
  evidence:
  - coverage.py CoverPoint 'top.data_in_coverage' only bins 6 specific input values
  - Parity cover points only track even/odd (1-bit bins)
  - 'No cover points for: data bit appearing in correct Hamming position, parity bit
    correctness per position, codeword bit mapping fidelity'
  - CoverCross only crosses data_in with overall_parity
  likely_cause: Coverage model follows verification_plan.yaml covergroups which only
    specify input_data_coverage (6 bins) and codeword_parity_coverage (even/odd bins).
    Plan does not specify coverage for data-to-position mapping correctness.
  investigation_targets:
  - tb/coverage.py (cover_data_in, cover_*_parity methods)
  - verification_plan.yaml (functional_coverage section)
  recommended_action: 'Add cover points for: (1) each data_in bit index mapped to
    correct Hamming position (sample codeword bits at non-parity positions), (2) each
    parity bit value vs expected per reference model, (3) codeword bit 10 vs Hamming
    position 10 (catches DISCREPANCY_003), (4) codeword bit 71 inclusion in overall
    parity (catches DISCREPANCY_004).'
  confidence: medium
- id: W006_RANDOMIZED_TEST_ITERATIONS_INSUFFICIENT
  severity: low
  category: test_coverage
  title: Randomized test only runs 100 iterations, verification plan calls for 'large
    number'
  affected_tests:
  - TestRandomized
  evidence:
  - sequences.py SeqRandomized default count=100
  - 'verification_plan.yaml randomized_testing_strategy: ''Generate a large number
    of random 64-bit values'''
  - TestRandomized shows 76 mismatches out of 100, indicating high bug detection rate
    but limited sample
  likely_cause: Default count=100 in SeqRandomized.__init__ is small for 64-bit input
    space. Verification plan text not reflected in implementation.
  investigation_targets:
  - tb/sequences.py (SeqRandomized.__init__ count parameter)
  - tb/test_classes.py (TestRandomized instantiates SeqRandomized with count=100)
  recommended_action: Increase default count to at least 1000 or make configurable
    via plusarg. Consider adding constraint to ensure coverage of all 64 bit positions
    (walking 1s/0s) within randomized test.
  confidence: medium
- id: W007_MONITOR_SCOREBOARD_TIMING_POTENTIAL_RACE
  severity: low
  category: timing_sampling
  title: Monitor and scoreboard both wait 1ns after data_in change; double-sampling
    without stabilization check
  affected_tests:
  - TestAllZerosInput
  - TestAllOnesInput
  - TestAlternating1010
  - TestAlternating0101
  - TestSingleBitSetLSB
  - TestSingleBitSetMSB
  - TestMaximumInputValue
  - TestMinimumInputValue
  - TestPowerOfTwoDataPattern
  - TestRandomized
  evidence:
  - 'monitor.py: await Edge(data_in) -> await Timer(1ns) -> sample data_in and codeword'
  - 'scoreboard.py: await analysis_fifo.get() -> await Timer(1ns) -> read codeword
    from helper again'
  - 'DUT is purely combinational (specification.md: ''No clock, reset, handshake...
    purely combinational'')'
  likely_cause: For combinational DUT, 1ns is likely sufficient for propagation. However,
    monitor samples codeword once, then scoreboard re-reads codeword after another
    1ns. If there were glitches or delta-cycle races, the two samples could differ.
    No check that codeword is stable between samples.
  investigation_targets:
  - tb/monitor.py (run_phase)
  - tb/scoreboard.py (run_phase)
  recommended_action: Since DUT is combinational, consider sampling codeword once
    in monitor and passing it in transaction (already done). Scoreboard should use
    transaction.codeword instead of re-reading from helper. Remove redundant Timer(1ns)
    and helper.codeword read in scoreboard.
  confidence: low
constraints:
  rtl_exposed_to_llm: false
authoritative_inputs:
- specification
- reference_model
- verification_plan
