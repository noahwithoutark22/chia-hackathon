repair_plan:
  version: '1.0'
  verdict: generation_bug
  root_cause:
    category: sequence
    summary: raw Python assert in sequences.py check_codeword method causes uncaught
      AssertionError
    evidence: 'All 11 tests fail with AssertionError at sequences.py:59 in check_codeword;
      TestRandomized shows scoreboard_mismatches: 1 proving scoreboard would report
      errors properly if sequence didn''t crash first'
  changes:
  - file: tb/sequences.py
    action: modify
    reason: replace raw assert with UVM error reporting to match scoreboard.py pattern
    instructions:
    - 'in check_codeword method around line 59, replace `assert condition` with `if
      not condition: self.uvm_report_error("check_codeword", "mismatch detail")`'
  - file: tb/assertions.py
    action: modify
    reason: replace any raw assert with UVM error reporting for consistency
    instructions:
    - 'find any raw assert statements and replace with `if not condition: uvm_report_error(...)`
      pattern'
  validation:
    tests:
    - TestRandomized
    - TestAllZeros
    - TestAllOnes
    - TestSingleBitErrors
    - TestDoubleBitErrors
    - TestSyndromeZero
    - TestSyndromeNonZero
    - TestEncoderDecoderLoopback
    - TestMultipleCodewords
    - TestBackToBack
    - TestResetDuringOperation
    requirements:
    - build succeeds
    - no UVM_ERROR or UVM_FATAL
    - no reference-model mismatch
rtl_exposed_to_llm: false
