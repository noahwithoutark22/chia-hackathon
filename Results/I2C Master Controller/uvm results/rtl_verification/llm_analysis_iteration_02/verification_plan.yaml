      cycles: 4
      description: ''
    - action: deassert_reset
      signals:
        rst_n: 1
      cycles: 1
      description: ''
    - action: start_write
      signals:
        start: 1
        slave_addr: 0
        rw: 0
        tx_data: 0
      cycles: 1
      description: ''
    - action: release_start
      signals:
        start: 0
      cycles: null
      description: ''
    - action: drive_ack
      signals:
        sda_in: 0
      cycles: null
      description: ''
    - action: drive_ack
      signals:
        sda_in: 0
      cycles: null
      description: ''
    - action: wait_for_done
      signals: {}
      cycles: null
      description: ''
    - action: expect
      signals:
        ack_error: 0
        busy: 0
      cycles: null
      description: ''
  expected:
    address_byte: 0
    transmitted_bytes:
    - 0
    - 0
    ack_error: 0
  note: ''
- id: TC-04
  name: write_max
  description: Write to maximum address 0x7F with data 0xFF; address byte is 0xFE.
