dut:
  name: i2c_master
  file: benchmarks/i2c_benchmark_corrupted/i2c_master.sv
  description: Compact single-byte I2C master transaction engine with 7-bit slave
    addressing, write and one-byte read transactions, slave ACK detection, START/STOP
    sequencing, busy/done status, and ack_error reporting. Provides open-drain-style
    SDA/SCL drive-enable outputs for external bus modeling.
parameters:
- name: CLK_DIV
  default: '4'
  description: Number of system clock cycles between transaction-engine state advances.
  test_values:
  - 4
  - 8
  - 16
clock_and_reset:
  clock:
    name: clk
    type: posedge
    description: System clock; all DUT state changes occur on the rising edge.
  reset:
    name: rst_n
    polarity: active-low
    type: synchronous
    description: Synchronous active-low reset that forces the controller to IDLE and
      clears all registered outputs.
    reset_value:
      busy: 0
      done: 0
      ack_error: 0
      rx_data: 0
      state: IDLE
ports:
  inputs:
  - name: clk
    width: 1
    description: System clock.
    type: logic
    latency: null
  - name: rst_n
    width: 1
    description: Active-low synchronous reset.
    type: logic
    latency: null
  - name: start
    width: 1
    description: Transaction start request; honored only while the controller is idle.
    type: logic
    latency: null
  - name: slave_addr
    width: 7
    description: 7-bit I2C slave address.
    type: logic
    latency: null
  - name: rw
    width: 1
    description: Direction bit; 0=write, 1=read.
    type: logic
    latency: null
  - name: tx_data
    width: 8
    description: Data byte to transmit during a write transaction.
    type: logic
    latency: null
  - name: sda_in
    width: 1
    description: Sampled SDA bus value; used for address/data ACK sampling and read-data
      reception.
    type: logic
    latency: null
  - name: scl_in
    width: 1
    description: Sampled SCL bus value.
    type: logic
    latency: null
  outputs:
  - name: rx_data
    width: 8
    description: Received byte for a read transaction.
    type: logic
    latency: null
  - name: done
    width: 1
    description: One-cycle pulse when a transaction completes.
    type: logic
    latency: null
  - name: busy
    width: 1
    description: High while a transaction is active.
    type: logic
    latency: null
  - name: ack_error
    width: 1
    description: High when an expected slave ACK is not observed.
    type: logic
    latency: null
  - name: sda_out
    width: 1
    description: Data value associated with the open-drain SDA output.
    type: logic
    latency: null
  - name: sda_oe
    width: 1
    description: SDA drive-enable control; 1=drive, 0=release so the external pull-up
      drives high.
    type: logic
    latency: null
  - name: scl_out
    width: 1
    description: Clock value associated with the open-drain SCL output.
    type: logic
    latency: null
  - name: scl_oe
    width: 1
    description: SCL drive-enable control; 1=drive, 0=release so the external pull-up
      drives high.
    type: logic
    latency: null
  inouts: []
functional_behavior:
  description: The controller executes a single-byte I2C transaction. The transmitted
    address byte is address_byte = (slave_addr << 1) | rw and is transmitted MSB first.
    A write transaction follows START -> 7-bit address + W -> slave ACK -> 8-bit tx_data
    -> slave ACK -> STOP -> done. A one-byte read transaction follows START -> 7-bit
    address + R -> slave ACK -> 8-bit data from slave (appears on rx_data) -> master
    NACK -> STOP -> done. If an expected slave ACK is not detected (SDA sampled high
    at the ACK point), ack_error is asserted. The controller asserts busy while a
    transaction is active, honors start only while idle, pulses done for exactly one
    clock at completion, and returns to IDLE after STOP so a new transaction cannot
    overwrite an active one.
  reset_behavior: While rst_n=0 the controller returns to IDLE and drives busy=0,
    done=0, ack_error=0, rx_data=0. On reset deassertion the controller is ready to
    accept a start request.
  reference_model:
    language: python
    file: benchmarks/i2c_benchmark_corrupted/i2c_reference_model.py
    function: make_address_byte(), write_transaction(), read_transaction(), address_bits(),
      byte_bits(), expected_write_bytes(), expected_read_address()
    logic: Constructs the address byte as (slave_addr << 1) | int(read). write_transaction(slave_addr,
      data, slave_ack) returns start, address_byte, rw=0, tx_data, expected_slave_acks=2,
      expected_ack_error = not slave_ack, stop. read_transaction(slave_addr, data_from_slave,
      slave_ack) returns start, address_byte, rw=1, slave_data, expected_slave_acks=1,
      master_final_ack=False, expected_ack_error = not slave_ack, expected_rx_data
      = data_from_slave, stop. TEST_VECTORS cover write_basic (0x50,0xA5), write_zero
      (0x00,0x00), write_max (0x7F,0xFF), read_basic (0x50,0x3C), read_max (0x2A,0xFF).
    latency: Transaction completion is signaled by the done pulse; latency is not
      a fixed number of cycles (spec section 9).
directed_test_scenarios:
- id: TC-01
  name: reset_idle_check
  description: Verify that reset clears all status outputs and the controller is idle.
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals:
        rst_n: 0
      cycles: 4
      description: Hold rst_n low for 4 clocks.
    - action: deassert_reset
      signals:
        rst_n: 1
      cycles: 2
      description: Release reset and wait.
    - action: expect
      signals:
        busy: 0
        done: 0
        ack_error: 0
        rx_data: 0
      cycles: null
      description: Check the post-reset idle state.
  expected:
    busy: 0
    done: 0
    ack_error: 0
    rx_data: 0
  note: ''
- id: TC-02
  name: write_basic
  description: Basic write transaction to 0x50 with data 0xA5 and slave ACK on both
    phases; reference vector write_basic.
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals:
        rst_n: 0
      cycles: 4
      description: ''
    - action: deassert_reset
      signals:
        rst_n: 1
      cycles: 1
      description: ''
    - action: start_write
      signals:
        start: 1
        slave_addr: 80
        rw: 0
        tx_data: 165
      cycles: 1
      description: Request a write to slave 0x50 with data 0xA5.
    - action: release_start
      signals:
        start: 0
      cycles: 1
      description: ''
    - action: drive_ack
      signals:
        sda_in: 0
      cycles: null
      description: Slave ACKs the address phase.
    - action: drive_ack
      signals:
        sda_in: 0
      cycles: null
      description: Slave ACKs the write-data phase.
    - action: wait_for_done
      signals: {}
      cycles: null
      description: Wait for the done pulse marking transaction completion.
    - action: expect
      signals:
        ack_error: 0
        busy: 0
      cycles: null
      description: Successful transaction must leave ack_error low and busy deasserted.
  expected:
    address_byte: 160
    transmitted_bytes:
    - 160
    - 165
    ack_error: 0
    done: one-cycle pulse
    busy_after_completion: 0
  note: ''
- id: TC-03
  name: write_zero
  description: Write to slave 0x00 with data 0x00; address byte and data are both
    0x00.
  priority: medium
  stimulus:
    sequence:
    - action: reset
