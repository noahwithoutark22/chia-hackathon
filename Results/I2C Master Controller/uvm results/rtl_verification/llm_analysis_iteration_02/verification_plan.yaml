    - action: reset
      signals:
        rst_n: 0
      cycles: 4
      description: ''
    - action: deassert_reset
      signals:
        rst_n: 1
      cycles: 1
      description: ''
    - action: start_write
      signals:
        start: 1
        slave_addr: 80
        rw: 0
        tx_data: 165
      cycles: 1
      description: ''
    - action: release_start
      signals:
        start: 0
      cycles: null
      description: ''
    - action: drive_ack
      signals:
        sda_in: 0
      cycles: null
      description: First address ACK; transaction is now busy.
    - action: start_write
      signals:
        start: 1
        slave_addr: 10
        rw: 0
        tx_data: 99
      cycles: 1
      description: Illegal start while busy must be ignored.
    - action: release_start
      signals:
        start: 0
      cycles: null
      description: ''
    - action: drive_ack
      signals:
        sda_in: 0
      cycles: null
      description: Data ACK completing the first transaction.
    - action: wait_for_done
      signals: {}
      cycles: null
      description: ''
    - action: expect
      signals:
        ack_error: 0
        busy: 0
      cycles: null
      description: ''
  expected:
    address_byte: 160
    transmitted_bytes:
    - 160
    - 165
    done: exactly one done pulse
    note: Only the first transaction's address/data may be observed; the second start
      is ignored.
  note: ''
