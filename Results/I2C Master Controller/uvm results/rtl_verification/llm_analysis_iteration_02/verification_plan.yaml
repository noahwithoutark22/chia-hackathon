      cycles: 1
      description: Request a read from slave 0x50.
    - action: release_start
      signals:
        start: 0
      cycles: null
      description: ''
    - action: drive_ack
      signals:
        sda_in: 0
      cycles: null
      description: Slave ACKs the address phase.
    - action: drive_byte
      signals:
        sda_in: 60
      cycles: null
      description: Slave drives data byte 0x3C on sda_in MSB first during the read-data
        phase.
    - action: drive_nack
      signals:
        sda_in: 1
      cycles: null
      description: After the data byte SDA is released and pulled high; this is the
        master NACK sample window.
    - action: wait_for_done
      signals: {}
      cycles: null
      description: Wait for the done pulse marking transaction completion.
    - action: expect
      signals:
        ack_error: 0
        busy: 0
        rx_data: 60
      cycles: null
