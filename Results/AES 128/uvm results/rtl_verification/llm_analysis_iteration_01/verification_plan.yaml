    - action: wait_done
      signals: {}
      cycles: null
      description: ''
    - action: drive
      signals:
        key: 000102030405060708090a0b0c0d0e0f
        plaintext: 8899aabbccddeeff0011223344556677
      cycles: null
      description: ''
    - action: drive
      signals:
        start: 1
      cycles: 1
      description: ''
    - action: drive
      signals:
        start: 0
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
      cycles: null
      description: ''
  expected:
    description: ciphertext(plaintext_a) != ciphertext(plaintext_b) and both equal
      aes128_encrypt(plaintext, key).
  note: ''
- id: TC08
  name: determinism_repeated_encryption
  description: Encrypt the identical (key, plaintext) pair twice; both ciphertexts
    must be identical and equal the reference result.
  priority: medium
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 2
      description: ''
    - action: drive
      signals:
        key: 000102030405060708090a0b0c0d0e0f
        plaintext: 00112233445566778899aabbccddeeff
      cycles: null
      description: ''
    - action: drive
      signals:
        start: 1
      cycles: 1
      description: ''
    - action: drive
      signals:
        start: 0
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
      cycles: null
      description: ''
    - action: drive
      signals:
        key: 000102030405060708090a0b0c0d0e0f
        plaintext: 00112233445566778899aabbccddeeff
      cycles: null
      description: ''
    - action: drive
      signals:
        start: 1
      cycles: 1
      description: ''
    - action: drive
      signals:
        start: 0
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
