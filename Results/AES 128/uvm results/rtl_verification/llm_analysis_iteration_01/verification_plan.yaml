dut:
  name: aes128
  file: benchmarks/aes128_benchmark_corrupted/aes128.sv
  description: 'AES-128 single-block ECB encryption engine with a start/done transaction
    interface. Ports: clk, rst_n, start, key[127:0], plaintext[127:0], done, ciphertext[127:0].
    One 128-bit block per transaction.

    '
parameters: []
clock_and_reset:
  clock:
    name: clk
    type: posedge
    description: Rising-edge system clock; inputs sampled and outputs updated on the
      positive edge.
  reset:
    name: rst_n
    polarity: active-low
    type: synchronous
    description: Active-low synchronous reset that clears the internal transaction
      state and leaves the DUT idle.
    reset_value:
      done: 0
      ciphertext: 0
ports:
  inputs:
  - name: clk
    width: 1
    description: Rising-edge clock.
    type: logic
    latency: null
  - name: rst_n
    width: 1
    description: Active-low synchronous reset.
    type: logic
    latency: null
  - name: start
    width: 1
    description: Transaction start strobe; honored on the clock edge while the DUT
      is idle.
    type: logic
    latency: null
  - name: key
    width: 128
    description: 128-bit AES-128 encryption key; most-significant byte is AES state
      byte 0.
    type: logic
    latency: null
  - name: plaintext
    width: 128
    description: 128-bit plaintext block; most-significant byte is AES state byte
      0.
    type: logic
    latency: null
  outputs:
  - name: done
    width: 1
    description: Pulses high for one clock cycle when ciphertext is valid.
    type: logic
    latency: null
  - name: ciphertext
    width: 128
    description: 128-bit ciphertext output, valid to sample while done is high.
    type: logic
    latency: null
  inouts: []
functional_behavior:
  description: 'AES-128 encryption of a single 128-bit plaintext block under a 128-bit
    key. A transaction starts when start is asserted while the DUT is idle; key and
    plaintext are captured at start, 10 AES encryption rounds are performed (SubBytes,
    ShiftRows, MixColumns, AddRoundKey; the final round omits MixColumns), and ciphertext
    is presented with a one-cycle done pulse. A new transaction must only be started
    after the previous one completes. Byte ordering is conventional AES: the most-significant
    byte of the 128-bit vector is AES state byte 0 and the state is arranged column-major.

    '
  reset_behavior: 'Asserting rst_n low for at least one rising edge clears all internal
    transaction state. After reset deassertion the DUT must be idle (ready to accept
    start) with done low.

    '
  reference_model:
    language: python
    file: aes128_reference_model.py
    function: aes128_encrypt
    logic: 'Independent FIPS-197 pure-Python model with its own S-box, key expansion,
      SubBytes, ShiftRows, MixColumns and AddRoundKey. aes128_encrypt(plaintext, key)
      is the oracle for the expected ciphertext. TEST_VECTORS provide the mandatory
      known answers used by the scoreboard and directed tests.

      '
    latency: null
directed_test_scenarios:
- id: TC01
  name: reset_release_idle
  description: Assert and release reset; verify the DUT is idle with done low and
    that a transaction can be started afterwards.
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 3
      description: Force rst_n low for 3 clock cycles.
    - action: wait
      signals: {}
      cycles: 2
      description: Wait after reset deassertion.
    - action: check
      signals:
        done: 0
      cycles: null
      description: done must be low after reset.
  expected:
    done: 0
    idle: true
  note: Detects reset-control defects such as the DUT not returning to the idle state
    after reset.
- id: TC02
  name: fips197_known_answer
  description: Encrypt the official FIPS-197 vector and compare against the mandated
    ciphertext.
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 2
      description: ''
    - action: drive
      signals:
        key: 000102030405060708090a0b0c0d0e0f
        plaintext: 00112233445566778899aabbccddeeff
      cycles: null
      description: Drive key and plaintext before start.
    - action: drive
      signals:
        start: 1
      cycles: 1
      description: Assert start for one cycle.
    - action: drive
      signals:
        start: 0
      cycles: null
      description: Deassert start.
    - action: wait_done
      signals: {}
      cycles: null
      description: Wait until done pulses.
    - action: check
      signals:
        ciphertext: 69c4e0d86a7b0430d8cdb78070b4c55a
      cycles: null
      description: Sample ciphertext while done is high.
  expected:
    ciphertext: 69c4e0d86a7b0430d8cdb78070b4c55a
  note: ''
- id: TC03
  name: all_zero_known_answer
  description: Encrypt the all-zero vector and compare against the mandated ciphertext.
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 2
      description: ''
    - action: drive
      signals:
        key: '00000000000000000000000000000000'
        plaintext: '00000000000000000000000000000000'
      cycles: null
      description: All-zero key and plaintext.
    - action: drive
      signals:
        start: 1
      cycles: 1
      description: ''
    - action: drive
      signals:
        start: 0
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
      cycles: null
      description: ''
    - action: check
      signals:
        ciphertext: 66e94bd4ef8a2c3b884cfa59ca342b2e
      cycles: null
      description: ''
  expected:
    ciphertext: 66e94bd4ef8a2c3b884cfa59ca342b2e
  note: ''
- id: TC04
  name: incrementing_known_answer
  description: Encrypt the incrementing vector and compare against the mandated ciphertext.
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 2
      description: ''
    - action: drive
      signals:
        key: 000102030405060708090a0b0c0d0e0f
        plaintext: 000102030405060708090a0b0c0d0e0f
      cycles: null
      description: ''
    - action: drive
      signals:
        start: 1
      cycles: 1
      description: ''
    - action: drive
      signals:
        start: 0
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
      cycles: null
      description: ''
    - action: check
      signals:
        ciphertext: 0a940bb5416ef045f1c39458c653ea5a
      cycles: null
      description: ''
  expected:
    ciphertext: 0a940bb5416ef045f1c39458c653ea5a
  note: ''
- id: TC05
  name: back_to_back_transactions
  description: Run two complete transactions back to back; each must produce the reference
    ciphertext for its own key/plaintext pair.
  priority: medium
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 2
      description: ''
    - action: drive
      signals:
        key: 000102030405060708090a0b0c0d0e0f
        plaintext: 00112233445566778899aabbccddeeff
      cycles: null
      description: ''
    - action: drive
      signals:
        start: 1
      cycles: 1
      description: ''
    - action: drive
      signals:
        start: 0
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
      cycles: null
      description: ''
    - action: check
      signals:
        ciphertext: 69c4e0d86a7b0430d8cdb78070b4c55a
      cycles: null
      description: ''
    - action: drive
      signals:
        key: '00000000000000000000000000000000'
        plaintext: '00000000000000000000000000000000'
      cycles: null
      description: Second transaction data.
    - action: drive
      signals:
        start: 1
      cycles: 1
      description: ''
    - action: drive
      signals:
        start: 0
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
      cycles: null
      description: ''
    - action: check
      signals:
        ciphertext: 66e94bd4ef8a2c3b884cfa59ca342b2e
      cycles: null
      description: ''
  expected:
    description: Second ciphertext equals the reference result for the second transaction
      and the first result is unaffected.
  note: Also verifies the DUT accepts a new transaction once done is observed.
- id: TC06
  name: key_sensitivity
  description: Fix plaintext and use two different keys; the two ciphertexts must
    differ and each must match the reference model.
  priority: medium
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 2
      description: ''
    - action: drive
      signals:
        key: 000102030405060708090a0b0c0d0e0f
        plaintext: 00112233445566778899aabbccddeeff
      cycles: null
      description: ''
    - action: drive
      signals:
        start: 1
      cycles: 1
      description: ''
    - action: drive
      signals:
        start: 0
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
      cycles: null
      description: ''
    - action: drive
      signals:
        key: ffeeddccbbaa99887766554433221100
        plaintext: 00112233445566778899aabbccddeeff
      cycles: null
      description: ''
    - action: drive
      signals:
        start: 1
      cycles: 1
      description: ''
    - action: drive
      signals:
        start: 0
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
      cycles: null
      description: ''
  expected:
    description: ciphertext(key_a) != ciphertext(key_b) and both equal aes128_encrypt(plaintext,
      key).
  note: ''
- id: TC07
  name: plaintext_sensitivity
  description: Fix key and use two different plaintexts; the two ciphertexts must
    differ and each must match the reference model.
  priority: medium
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 2
      description: ''
    - action: drive
      signals:
        key: 000102030405060708090a0b0c0d0e0f
        plaintext: 00112233445566778899aabbccddeeff
      cycles: null
      description: ''
    - action: drive
      signals:
