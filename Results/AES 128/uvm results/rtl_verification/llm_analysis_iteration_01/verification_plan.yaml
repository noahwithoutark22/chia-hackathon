  note: ''
- id: TC09
  name: done_pulse_and_start_ignored_while_busy
  description: Verify done pulses for exactly one cycle and that a start asserted
    while a transaction is in flight is ignored and does not corrupt the running transaction.
  priority: high
  stimulus:
    sequence:
    - action: reset
      signals: {}
      cycles: 2
      description: ''
    - action: drive
      signals:
        key: 000102030405060708090a0b0c0d0e0f
        plaintext: 00112233445566778899aabbccddeeff
      cycles: null
      description: ''
    - action: drive
      signals:
        start: 1
      cycles: 1
      description: ''
    - action: drive
      signals:
        start: 0
      cycles: null
      description: ''
    - action: drive
      signals:
        start: 1
      cycles: null
      description: Illegal restart while transaction is busy; must be ignored.
    - action: drive
      signals:
        start: 0
      cycles: null
      description: ''
    - action: wait_done
      signals: {}
      cycles: null
